<!--
  Isolated Ambàra prospect demo. Do not copy another client's ElevenLabs agent into this page.
  Facts checked against ambaralounge.it on 2026-11-05.
  Public booking link: Plateform (homepage). API and internal PMS are not verified.
  Instagram @ambarasardinianlounge is the homepage outbound link. The profile was not inspected.
  GoatCounter base /ambarra. ?p= records the prospect tag. ?internal=1 sets skipgc and loads nothing.
-->
<script>
(function(){
 var BASE='/ambarra';
 var m=(location.search+location.hash).match(/[?&#]internal=([01])/);
 try{ if(m){ if(m[1]==="1") localStorage.setItem("skipgc","t"); else localStorage.removeItem("skipgc"); } }catch(e){}
 var internal=false; try{ internal=localStorage.getItem("skipgc")==="t"; }catch(e){}
 var sm=location.search.match(/[?&]p=([^&#]*)/);
 var tag=sm?decodeURIComponent(sm[1]).toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,60):"";
 var q=[]; window.bsTrack=function(sub,title){ if(internal) return;
   if(window.goatcounter&&window.goatcounter.count) window.goatcounter.count({path:BASE+sub,title:title||sub,event:true}); else q.push([BASE+sub,title||sub]); };
 if(internal) return;
 window.goatcounter={no_onload:true};
 var s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js";
 s.setAttribute("data-goatcounter","https://bollastudio.goatcounter.com/count");
 s.onload=function(){ try{ window.goatcounter.count({path:BASE+'/'+(tag?'?p='+tag:''),title:'Ambàra demo'});
   q.forEach(function(e){window.goatcounter.count({path:e[0],title:e[1],event:true});}); q=[]; }catch(e){} };
 document.head.appendChild(s);
})();
</script>

var A={
it:{
 hi:'Buongiorno. Sono l\'assistente di dimostrazione di Ambàra Sardinian Lounge, a Monte Petrosu. Rispondo con ciò che è pubblicato sul sito. Un tavolo lo annoto come richiesta: non lo confermo.',
 hours:'La pagina dedicata alla colazione pubblica 07:30–11:30. Il piè di pagina della carta bevande indica invece colazione e brunch 08:30–12:00. Do priorità alla pagina dedicata e conviene confermare l\'orario del giorno.\nLa pagina della cena indica tutte le sere 17:00–01:00.\nUn orario di pranzo verificato non c\'è in questa demo: non lo invento. Non so se oggi è aperto e non controllo i tavoli.',
 where:'Ambàra Sardinian Lounge, Monte Petrosu, Via di Li Graniti, 07052 San Teodoro, Sardegna. Nessun numero civico verificato.\nTelefono e WhatsApp pubblicati: +39 340 199 1233. Email: info@ambaralounge.it.\nInstagram pubblicato in homepage: @ambarasardinianlounge. Facebook: facebook.com/ambaralounge. I profili non sono stati ispezionati e questa demo non li collega.\nIl sito cita la strada verso la Spiaggia dei Sassi Piatti, le calette di Punta Molara, Cala Girgolu e Porto Taverna, e i nuraghi nei dintorni.\nSulla distanza non do un solo numero: in homepage c\'è «a solo 1 km dalle spiagge», nella pagina Dove siamo «a soli 2 km dal mare». Il percorso lo conferma il team.',
 menu:'La cucina è presentata sul sito come curata dallo chef Andrea Locci, dalla colazione ai cocktail.\nEsempi pubblicati sul menu cena: battuta di tonno 20 €, culurgiones 22 €, degustazione griglia 55 € a persona. Il coperto sulla pagina cena e sulla colazione è 3 €; la carta bevande indica 2 €. Non c\'è un coperto unico. Colazione: «uova e un contorno» 10 €.\nIl menu intero resta sul sito. I prezzi possono cambiare. Per gli allergeni avvisa la sala: non confermo una modifica al piatto e non garantisco l\'assenza di contaminazioni.',
 events:'Sul sito: DJ set dal vivo ogni mercoledì e venerdì, dalle 18:30 alle 00:00; jazz moderno; serate karaoke selezionate. Se una data precisa è in programma, lo conferma il team.',
 book:'DEMO — prenotazione simulata / simulated reservation. Posso annotare la richiesta: occasione, data, orario, persone, nome e un recapito. Non controllo i tavoli e non confermo.\nSul sito il percorso pubblico è Plateform: https://ambarasardinianlounge.plateform.app/r/ambarainstagram . È il link pubblicato, non la prova di un\'API. Questa demo non invia nulla a Plateform e non usa OpenTable.\nIl modulo sotto registra la stessa richiesta solo in questo browser.',
 instagram:'Il link Instagram pubblicato in homepage è https://www.instagram.com/ambarasardinianlounge/ (@ambarasardinianlounge). Facebook, sempre dalla homepage: https://www.facebook.com/ambaralounge . I profili non sono stati letti uno per uno. Questa simulazione non è collegata e non invia nulla.',
 opentable:'La pagina live di OpenTable dice che Ambàra non è sul network di prenotazione. Non uso OpenTable. Il link pubblico sul sito è Plateform, e l\'API non è verificata.',
 allergy:'Le allergie le conferma il personale di sala, come chiede anche il menu pubblicato. Non garantisco una preparazione adatta. Passo la nota a una persona del team. Nessun messaggio reale è stato inviato.',
 group:'Per un gruppo o un evento non invento una disponibilità. Passo la richiesta a una persona del team, con data, persone e occasione se le hai scritte.',
 parking:'La pagina Chi siamo pubblica un ampio parcheggio gratuito. Non ho altri dettagli, per esempio il numero di posti.',
 fb:'Questo dato non è tra quelli letti sul sito, quindi non lo invento. Lo passo a una persona del team.',
 chef:'Il sito indica la cucina come curata dallo chef Andrea Locci. Non ho altri nomi del team.',
 beaches:'Il sito indica, come mete vicine, la Spiaggia dei Sassi Piatti, le calette di Punta Molara, Cala Girgolu e Porto Taverna, oltre a sentieri e nuraghi. Non fisso una distanza in chilometri: le due pagine del sito non dicono la stessa cifra.',
 chips:[['Orari','hours'],['Dove siete','where'],['Dal menu','menu'],['DJ di venerdì','events'],['Tavolo sabato','book'],['Allergia','allergy'],['Evento per 20','group'],['In English','hours','en']],
 sc:[
  ['Tavolo per 4, sabato',[['u','Buonasera, avete un tavolo per 4 sabato alle 20:30?'],['b','Buonasera. DEMO — prenotazione simulata / simulated reservation. Annoto la richiesta: sabato, 20:30, 4 persone, cena. Non vedo i tavoli liberi e non confermo.\nIl link pubblico sul sito è Plateform. L\'API non è verificata e da questa demo non parte nessun messaggio. Nome e recapito, se vuoi, restano solo nel modulo di questa pagina.']]],
  ['Orari e spiagge',[['u','Che orari fate? E come si arriva verso le spiagge?'],['i','hours'],['i','beaches']]],
  ['Ospite in inglese',[['u','Hi, could we request a table for 2 on Saturday at 20:00?'],['b','Hello. DEMO — prenotazione simulata / simulated reservation. I can note the request: Saturday, 20:00, 2 people. I cannot see open tables and I will not confirm it.\nThe public link is Plateform and the API is not verified. Nothing is sent from this demo.','en']]],
  ['Allergia, al team',[['u','Una di noi è celiaca. Si può modificare un piatto?'],['i','allergy']]]
 ]
},
en:{
 hi:'Hello. I am the demonstration assistant for Ambàra Sardinian Lounge, in Monte Petrosu. I answer from what is published on the website. I can note a table as a request: I do not confirm it.',
 hours:'The dedicated breakfast page publishes 07:30–11:30. The drinks-page footer instead says breakfast and brunch 08:30–12:00. I prefer the dedicated page and the day itself should be confirmed.\nThe dinner page says every evening 17:00–01:00.\nA verified lunch service is not in this demo: I will not invent one. I do not know if it is open today and I do not check tables.',
 where:'Ambàra Sardinian Lounge, Monte Petrosu, Via di Li Graniti, 07052 San Teodoro, Sardinia. No house number is verified.\nPublished phone and WhatsApp: +39 340 199 1233. Email: info@ambaralounge.it.\nInstagram published on the homepage: @ambarasardinianlounge. Facebook: facebook.com/ambaralounge. The profiles were not inspected and this demo does not connect them.\nThe website names the road toward Spiaggia dei Sassi Piatti, the coves of Punta Molara, Cala Girgolu and Porto Taverna, and nuraghi nearby.\nI will not give a single distance: the homepage says “just 1 km from the beaches”, and the Where we are page says “just 2 km from the sea”. The team confirms the route.',
 menu:'The website presents the kitchen as looked after by chef Andrea Locci, from breakfast through to cocktails.\nExamples published on the dinner menu: tuna battuta €20, culurgiones €22, grill tasting €55 per person. Cover on the dinner and breakfast pages is €3; the drinks page says €2. There is no single cover charge. Breakfast: “eggs and one side” €10.\nThe full menu stays on the website. Prices can change. For allergens, tell the dining-room staff: I will not confirm a change to a dish and I cannot guarantee freedom from cross-contact.',
 events:'On the website: a live DJ set every Wednesday and Friday, from 18:30 to 00:00; modern jazz; selected karaoke nights. Whether a specific date is on, the team confirms.',
 book:'DEMO — prenotazione simulata / simulated reservation. I can note the request: occasion, date, time, party size, name and a contact. I do not check tables and I do not confirm it.\nThe public path on the website is Plateform: https://ambarasardinianlounge.plateform.app/r/ambarainstagram . That is the published link, not proof of an API. This demo sends nothing to Plateform and does not use OpenTable.\nThe form below saves the same request in this browser only.',
 instagram:'The Instagram link published on the homepage is https://www.instagram.com/ambarasardinianlounge/ (@ambarasardinianlounge). Facebook, also from the homepage: https://www.facebook.com/ambaralounge . The profiles were not read one by one. This simulation is not connected and sends nothing.',
 opentable:'The live OpenTable page says Ambàra is not on the booking network. I do not use OpenTable. The public link on the website is Plateform, and the API is not verified.',
 allergy:'Allergies are confirmed by the dining-room staff, which is also what the published menu asks. I cannot guarantee suitable preparation. I am passing the note to a person on the team. No real message was sent.',
 group:'For a group or an event I will not invent availability. I am passing the request to a person on the team, with the date, party size and occasion if you wrote them.',
 parking:'The About page publishes a large free parking area. I do not have further details, such as the number of spaces.',
 fb:'That fact is not among the ones read on the website, so I will not invent it. I am passing it to a person on the team.',
 chef:'The website describes the kitchen as looked after by chef Andrea Locci. I do not have other names from the team.',
 beaches:'The website names Spiaggia dei Sassi Piatti, the coves of Punta Molara, Cala Girgolu and Porto Taverna, plus paths and nuraghi. I am not stating one distance in kilometres: the two website pages do not give the same figure.',
 chips:[['Hours','hours'],['Where are you?','where'],['From the menu','menu'],['Friday DJ','events'],['Saturday table','book'],['Allergy','allergy'],['Event for 20','group'],['In italiano','hours','it']],
 sc:[
  ['Table for 4, Saturday',[['u','Good evening, do you have a table for 4 on Saturday at 20:30?'],['b','Good evening. DEMO — prenotazione simulata / simulated reservation. I am noting the request: Saturday, 20:30, 4 people, dinner. I cannot see open tables and I will not confirm it.\nThe public link on the website is Plateform. The API is not verified and nothing is sent from this demo. A name and a contact, if you want them, stay in the form on this page only.']]],
  ['Hours and beaches',[['u','What are your hours? And how do we get toward the beaches?'],['i','hours'],['i','beaches']]],
  ['Guest in Italian',[['u','Buonasera, si può annotare un tavolo per 2 sabato alle 20?'],['b','Buonasera. DEMO — prenotazione simulata / simulated reservation. Annoto la richiesta: sabato alle 20, 2 persone. Non vedo i tavoli liberi e non confermo.\nIl link pubblico è Plateform e l\'API non è verificata. Da qui non parte nessun messaggio.','it']]],
  ['Allergy, to the team',[['u','One of us is coeliac. Can a dish be changed?'],['i','allergy']]]
 ]
},
de:{
 hi:'Guten Tag. Ich bin der Demo-Assistent von Ambàra Sardinian Lounge in Monte Petrosu. Ich antworte mit dem, was auf der Website steht. Einen Tisch notiere ich als Anfrage, ich bestätige ihn nicht.',
 hours:'Die Frühstücksseite nennt 07:30–11:30. Die Getränkekarte nennt stattdessen 08:30–12:00. Ich bevorzuge die eigene Seite und der Tag selbst ist zu bestätigen.\nDie Abendkarte sagt jeden Abend 17:00–01:00.\nEin geprüftes Mittagessen steht in dieser Demo nicht: ich erfinde es nicht. Ob jetzt geöffnet ist, weiss ich nicht, und ich prüfe keine Tische.',
 where:'Ambàra Sardinian Lounge, Monte Petrosu, Via di Li Graniti, 07052 San Teodoro, Sardinien. Keine geprüfte Hausnummer.\nTelefon und WhatsApp auf der Website: +39 340 199 1233. E-Mail: info@ambaralounge.it.\nInstagram auf der Startseite: @ambarasardinianlounge. Facebook: facebook.com/ambaralounge. Die Profile wurden nicht geprüft und diese Demo verbindet sie nicht.\nDie Website nennt den Weg zur Spiaggia dei Sassi Piatti, zu den Buchten von Punta Molara, nach Cala Girgolu und Porto Taverna.\nEine einzelne Entfernung nenne ich nicht: die Startseite schreibt «nur 1 km von den Stränden», die Seite Dove siamo «nur 2 km vom Meer». Den Weg bestätigt das Team.',
 menu:'Die Website stellt die Küche als von Chef Andrea Locci geführt vor.\nBeispiele auf der Abendkarte: Thunfisch-Battuta 20 €, Culurgiones 22 €, Grill-Degustation 55 € pro Person. Das Gedeck auf Abend- und Frühstückskarte ist 3 €, die Getränkekarte nennt 2 €. Es gibt kein einheitliches Gedeck.\nDie ganze Karte bleibt auf der Website. Bei Allergien antwortet der Service, nicht ich. Ich garantiere keine kreuzkontaktfreie Zubereitung.',
 events:'Auf der Website: Live-DJ jeden Mittwoch und Freitag, 18:30–00:00; moderner Jazz; ausgewählte Karaoke-Abende. Ob ein bestimmtes Datum stattfindet, bestätigt das Team.',
 book:'DEMO — prenotazione simulata / simulated reservation. Ich kann die Anfrage notieren. Ich sehe keine freien Tische und bestätige nichts.\nDer öffentliche Weg auf der Website ist Plateform: https://ambarasardinianlounge.plateform.app/r/ambarainstagram . Das ist der veröffentlichte Link, kein API-Nachweis. Diese Demo sendet nichts an Plateform und nutzt nicht OpenTable.',
 instagram:'Der Instagram-Link auf der Startseite ist https://www.instagram.com/ambarasardinianlounge/ (@ambarasardinianlounge). Facebook, ebenfalls von der Startseite: https://www.facebook.com/ambaralounge . Die Profile wurden nicht einzeln gelesen. Diese Simulation ist nicht verbunden und sendet nichts.',
 opentable:'Die live gelesene OpenTable-Seite sagt, Ambàra sei nicht im Buchungsnetz. Ich nutze OpenTable nicht. Der öffentliche Link ist Plateform, und die API ist nicht geprüft.',
 allergy:'Allergien bestätigt das Service-Team, so steht es auch auf der veröffentlichten Karte. Ich garantiere keine geeignete Zubereitung. Ich gebe die Notiz an eine Person im Team weiter. Es wurde keine echte Nachricht gesendet.',
 group:'Für eine Gruppe oder ein Event erfinde ich keine Verfügbarkeit. Ich gebe die Anfrage an eine Person im Team weiter.',
 parking:'Die Seite Chi siamo nennt einen grossen kostenlosen Parkplatz. Weitere Details, etwa die Zahl der Plätze, habe ich nicht.',
 fb:'Diese Angabe steht nicht in dem, was ich auf der Website gelesen habe. Ich erfinde sie nicht und gebe sie an das Team weiter.',
 chef:'Die Website nennt Chef Andrea Locci für die Küche. Weitere Namen habe ich nicht.',
 beaches:'Die Website nennt die Spiaggia dei Sassi Piatti, die Buchten von Punta Molara, Cala Girgolu und Porto Taverna, dazu Wege und Nuraghen. Eine einzelne Kilometerzahl nenne ich nicht.'
},
fr:{
 hi:'Bonjour. Je suis l\'assistant de démonstration d\'Ambàra Sardinian Lounge, à Monte Petrosu. Je réponds avec ce qui est publié sur le site. Une table, je la note comme demande : je ne la confirme pas.',
 hours:'La page du petit-déjeuner publie 07:30–11:30. Le pied de page de la carte des boissons indique 08:30–12:00. Je privilégie la page dédiée et le jour même est à confirmer.\nLa page du dîner indique tous les soirs 17:00–01:00.\nUn service de déjeuner vérifié n\'est pas dans cette démo : je ne l\'invente pas. Je ne sais pas si c\'est ouvert aujourd\'hui et je ne vérifie pas les tables.',
 where:'Ambàra Sardinian Lounge, Monte Petrosu, Via di Li Graniti, 07052 San Teodoro, Sardaigne. Aucun numéro de rue vérifié.\nTéléphone et WhatsApp publiés : +39 340 199 1233. E-mail : info@ambaralounge.it.\nInstagram publié sur l\'accueil : @ambarasardinianlounge. Facebook : facebook.com/ambaralounge. Les profils n\'ont pas été inspectés et cette démo ne les connecte pas.\nLe site cite la route vers la Spiaggia dei Sassi Piatti, les criques de Punta Molara, Cala Girgolu et Porto Taverna.\nJe ne donne pas une seule distance : la page d\'accueil dit « à seulement 1 km des plages », la page Dove siamo « à seulement 2 km de la mer ». L\'équipe confirme le trajet.',
 menu:'Le site présente la cuisine comme suivie par le chef Andrea Locci.\nExemples publiés au menu du soir : battuta de thon 20 €, culurgiones 22 €, dégustation grill 55 € par personne. Le couvert des pages dîner et petit-déjeuner est 3 € ; la carte des boissons indique 2 €. Il n\'y a pas un couvert unique.\nLa carte complète reste sur le site. Pour les allergènes, c\'est la salle qui répond. Je ne garantis pas l\'absence de contamination.',
 events:'Sur le site : DJ en direct chaque mercredi et vendredi, de 18h30 à 00h00 ; jazz moderne ; soirées karaoké choisies. Pour une date précise, l\'équipe confirme.',
 book:'DEMO — prenotazione simulata / simulated reservation. Je peux noter la demande. Je ne vois pas les tables et je ne confirme pas.\nLe chemin public sur le site est Plateform : https://ambarasardinianlounge.plateform.app/r/ambarainstagram . C\'est le lien publié, pas la preuve d\'une API. Cette démo n\'envoie rien à Plateform et n\'utilise pas OpenTable.',
 instagram:'Le lien Instagram publié sur l\'accueil est https://www.instagram.com/ambarasardinianlounge/ (@ambarasardinianlounge). Facebook, aussi depuis l\'accueil : https://www.facebook.com/ambaralounge . Les profils n\'ont pas été lus un par un. Cette simulation n\'est pas connectée et n\'envoie rien.',
 opentable:'La page OpenTable lue en direct dit qu\'Ambàra n\'est pas sur le réseau de réservation. Je n\'utilise pas OpenTable. Le lien public est Plateform, et l\'API n\'est pas vérifiée.',
 allergy:'Les allergies sont confirmées par la salle, comme le demande aussi le menu publié. Je ne garantis pas une préparation adaptée. Je transmets la note à une personne de l\'équipe. Aucun message réel n\'a été envoyé.',
 group:'Pour un groupe ou un événement, je n\'invente pas de disponibilité. Je transmets la demande à une personne de l\'équipe.',
 parking:'La page Chi siamo publie un grand parking gratuit. Je n\'ai pas d\'autres détails, par exemple le nombre de places.',
 fb:'Cette information ne figure pas dans ce que j\'ai lu sur le site. Je ne l\'invente pas et je la passe à l\'équipe.',
 chef:'Le site indique le chef Andrea Locci pour la cuisine. Je n\'ai pas d\'autres noms.',
 beaches:'Le site cite la Spiaggia dei Sassi Piatti, les criques de Punta Molara, Cala Girgolu et Porto Taverna, ainsi que des sentiers et des nuraghi. Je ne fixe pas une seule distance en kilomètres.'
},
es:{
 hi:'Buenos días. Soy el asistente de demostración de Ambàra Sardinian Lounge, en Monte Petrosu. Respondo con lo publicado en la web. Una mesa la anoto como solicitud: no la confirmo.',
 hours:'La página del desayuno publica 07:30–11:30. El pie de la carta de bebidas indica 08:30–12:00. Doy prioridad a la página dedicada y conviene confirmar el día.\nLa página de la cena indica todas las noches 17:00–01:00.\nUn horario de almuerzo verificado no está en esta demo: no lo invento. No sé si hoy está abierto y no compruebo las mesas.',
 where:'Ambàra Sardinian Lounge, Monte Petrosu, Via di Li Graniti, 07052 San Teodoro, Cerdeña. Sin número de portal verificado.\nTeléfono y WhatsApp publicados: +39 340 199 1233. Correo: info@ambaralounge.it.\nInstagram publicado en la portada: @ambarasardinianlounge. Facebook: facebook.com/ambaralounge. Los perfiles no se inspeccionaron y esta demo no los conecta.\nLa web cita el camino hacia la Spiaggia dei Sassi Piatti, las calas de Punta Molara, Cala Girgolu y Porto Taverna.\nNo doy una sola distancia: la portada dice «a solo 1 km de las playas» y la página Dove siamo «a solo 2 km del mar». El recorrido lo confirma el equipo.',
 menu:'La web presenta la cocina a cargo del chef Andrea Locci.\nEjemplos publicados en la carta de la cena: battuta de atún 20 €, culurgiones 22 €, degustación a la parrilla 55 € por persona. El cubierto en cena y desayuno es 3 €; la carta de bebidas indica 2 €. No hay un cubierto único.\nLa carta completa sigue en la web. Los alérgenos los confirma la sala. No garantizo una preparación sin contaminación.',
 events:'En la web: DJ en directo cada miércoles y viernes, de 18:30 a 00:00; jazz moderno; noches de karaoke seleccionadas. Si una fecha concreta está en programa, lo confirma el equipo.',
 book:'DEMO — prenotazione simulata / simulated reservation. Puedo anotar la solicitud. No veo las mesas libres y no confirmo.\nEl camino público en la web es Plateform: https://ambarasardinianlounge.plateform.app/r/ambarainstagram . Es el enlace publicado, no la prueba de una API. Esta demo no envía nada a Plateform y no usa OpenTable.',
 instagram:'El enlace de Instagram publicado en la portada es https://www.instagram.com/ambarasardinianlounge/ (@ambarasardinianlounge). Facebook, también desde la portada: https://www.facebook.com/ambaralounge . Los perfiles no se leyeron uno a uno. Esta simulación no está conectada y no envía nada.',
 opentable:'La página viva de OpenTable dice que Ambàra no está en la red de reservas. No uso OpenTable. El enlace público es Plateform, y la API no está verificada.',
 allergy:'Las alergias las confirma el personal de sala, como pide también la carta publicada. No garantizo una preparación adecuada. Paso la nota a una persona del equipo. No se ha enviado ningún mensaje real.',
 group:'Para un grupo o un evento no invento disponibilidad. Paso la solicitud a una persona del equipo.',
 parking:'La página Chi siamo publica un aparcamiento amplio y gratuito. No tengo más detalles, por ejemplo el número de plazas.',
 fb:'Ese dato no está entre lo leído en la web, así que no lo invento. Lo paso a una persona del equipo.',
 chef:'La web indica al chef Andrea Locci para la cocina. No tengo otros nombres del equipo.',
 beaches:'La web cita la Spiaggia dei Sassi Piatti, las calas de Punta Molara, Cala Girgolu y Porto Taverna, además de senderos y nuraghi. No fijo una sola distancia en kilómetros.'
}

 ['opentable',/opentable|open table/],
 ['instagram',/instagram|facebook/],
 ['allergy',/allerg|celiac|celiach|coeliac|glutine|gluten|glutenfrei|intoller|lactos|nuss|noix|frutos secos|unvertrag/],
 ['parking',/parchegg|parking|parkplatz|stationnement|aparcamiento/],
 ['group',/evento|compleanno|privato|matrimonio|battesimo|wedding|birthday|private dining|geburtstag|hochzeit|mariage|anniversaire|cumple|boda|gruppo|\b([1-9][0-9])\s*(persone|pers\.|people|guests|personen|personnes|personas|gaste)/],
 ['chef',/chef|locci|cuoco|koch\b/],
 ['events',/\bdj\b|karaoke|jazz|venerdi sera|friday night|mittwoch|mercredi|miercoles/],
 ['beaches',/spiagg|beach|cala |sassi piatti|molara|girgolu|taverna|nuragh|plage|strand|playa/],
 ['hours',/orari|orario|apert|chius|hours|opening|open\b|close|offen|geoffnet|horaire|horario|a che ora|what time|wann/],
 ['where',/dove|indirizzo|where|address|wo seid|wo ist|adresse|ou etes|donde|come si arriva|how (do|to) (we|i) get|anfahrt|weg nach/],
 ['menu',/menu|carta|piatt|dish|speise|karte|plat\b|brunch|colazione|breakfast|pranzo|lunch|mittag|cena\b|dinner|cocktail|preis|prezzo|cuanto cuesta/],
 ['book',/prenot|tavolo|book|reserv|tisch|mesa|disponib|table for|un tavolo|vorrei venire/]
];
var lang='it', channel='wa', run=0, slot=null;
var $=function(id){return document.getElementById(id)};
function ls(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var SK={s:'bolla_ambarra_stats',h:'bolla_ambarra_hand',r:'bolla_ambarra_req'};
function stats(){return ls(SK.s,{msg:0,auto:0,hand:0})}
function bump(f){var s=stats();s[f]=(s[f]||0)+1;lsSet(SK.s,s)}
function nowStr(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss')}
function scoreLang(n){
 var bags={
  it:['ciao','buongiorno','buonasera','prenot','tavolo','orari','dove','colazione','pranzo','grazie','vorrei','siamo','persone','allerg','orario'],
  en:['hello',' hi','please','table','book','hours','where','breakfast','lunch','dinner','thanks','people','allergy','open'],
  de:['hallo','bitte','tisch','reserv','offnung','fruhstuck','abendessen','danke','personen','allerg','geoffnet','uhr'],
  fr:['bonjour','salut','horaires','reservation','petit dejeuner','dejeuner','merci','personnes','allerg','ou etes'],
  es:['hola','mesa','reserva','horario','donde','desayuno','almuerzo','gracias','personas','alerg']
 };
 var scores={it:0,en:0,de:0,fr:0,es:0}, k;
 for(k in bags){bags[k].forEach(function(w){if(n.indexOf(w)>=0) scores[k]++})}
 if(/\b(hello|hi|please)\b/.test(n)) scores.en+=2;
 if(/\b(ciao|buongiorno|buonasera)\b/.test(n)) scores.it+=2;
 if(/\b(hallo|guten tag)\b/.test(n)) scores.de+=2;
 if(/\b(bonjour|salut)\b/.test(n)) scores.fr+=2;
 if(/\bhola\b/.test(n)) scores.es+=2;
 return scores;
}
function detectLang(raw){
 var scores=scoreLang(norm(raw)), best=lang, n=scores[lang]||0, k;
 for(k in scores){ if(scores[k]>n){ n=scores[k]; best=k } }
 return n>0?best:lang;
}
function classify(raw){
 var n=norm(raw), i;
 for(i=0;i<RX.length;i++){ if(RX[i][1].test(n)) return RX[i][0] }
 return 'fb';
}
var M=$('msgs');
function add(t,c){var e=document.createElement('div');e.className='m '+c;e.textContent=t;M.appendChild(e);M.scrollTop=M.scrollHeight;return e}
function handLog(key,q,replyLang){
 var h=ls(SK.h,[]);
 h.unshift({t:nowStr(),l:(replyLang||lang).toUpperCase(),q:q,r:key,ch:channel});
 lsSet(SK.h,h.slice(0,30));
}
function botSay(text,isHand,key,r,replyLang,q,cb){
 var t=add('…','b typing');
 setTimeout(function(){
  if(r!==run) return;
  t.remove();
  add(text,isHand?'b h':'b');
  if(isHand){ bump('hand'); handLog(key,q,replyLang); add(T[lang].sysHand,'sys'); }
  else bump('auto');
  if(cb) cb();
 },700);
}
function answer(key,r,replyLang,q){
 var pack=A[replyLang]||A[lang];
 var text=pack[key]||pack.fb;
 botSay(text,!!HAND[key],key,r,replyLang,q);
}
function userAsk(text,key,replyLang){
 var rl=replyLang||detectLang(text);
 var k=key||classify(text);
 add(text,'u'); bump('msg');
 if(window.bsTrack) window.bsTrack('/ask/'+rl+'/'+k,'Ask '+k);
 answer(k,run,rl,text);
}
function playScen(i){
 run++; var r=run; M.innerHTML='';
 var steps=A[lang].sc[i][1];
 if(window.bsTrack) window.bsTrack('/scenario/'+lang+'/'+(i+1),'Scenario '+(i+1));
 (function step(j){
  if(r!==run||j>=steps.length) return;
  var m=steps[j];
  if(m[0]==='u'){ add(m[1],'u'); bump('msg'); setTimeout(function(){step(j+1)},550); return; }
  var replyLang=m[2]||lang;
  var text=m[1], key=null, isHand=false, q=m[1];
  if(m[0]==='i'){
    var said=steps.filter(function(s){return s[0]==='u'}).map(function(s){return s[1]}).join(' ');
    replyLang=detectLang(said);
    key=m[1]; q=said; isHand=!!HAND[key];
    text=(A[replyLang]||A[lang])[key]||(A[replyLang]||A[lang]).fb;
  }
  botSay(text,isHand,key,r,replyLang,q,function(){step(j+1)});
 })(0);
}
function renderChips(){
 var ch=$('chips'); ch.innerHTML='';
 A[lang].chips.forEach(function(c){
  var b=document.createElement('button'); b.type='button'; b.textContent=c[0];
  b.onclick=function(){ userAsk(c[0],c[1],c[2]||lang); };
  ch.appendChild(b);
 });
 var sc=$('scen'); sc.innerHTML='';
 A[lang].sc.forEach(function(s,i){
  var b=document.createElement('button'); b.type='button'; b.className='sc'; b.textContent=s[0];
  b.onclick=function(){ playScen(i); };
  sc.appendChild(b);
 });
}
function greet(){ run++; M.innerHTML=''; add(A[lang].hi,'b'); renderChips(); }
function channelCopy(){
 var t=T[lang];
 $('chName').textContent=channel==='ig'?t.chIg:t.chWa;
 $('chSub').textContent=t.chSub;
 $('chBanner').textContent=t.banner;
}
function show(tab){
 channel=tab==='ig'?'ig':(tab==='wa'?'wa':channel);
 document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
 var chat=tab==='wa'||tab==='ig';
 $('pane-chat').classList.toggle('on',chat);
 $('pane-google').classList.toggle('on',tab==='google');
 $('pane-voice').classList.toggle('on',tab==='voice');
 $('pane-team').classList.toggle('on',tab==='team');
 if(chat) channelCopy();
 if(tab==='team') renderTeam();
 if(window.bsTrack) window.bsTrack('/tab/'+tab,'Tab '+tab);
}
function gCardText(){
 return lang==='it'
  ? 'Ambàra Sardinian Lounge\nMonte Petrosu, Via di Li Graniti, 07052 San Teodoro\nColazione, pagina dedicata: 07:30–11:30\nCarta bevande: 08:30–12:00\nSera, pagina cena: 17:00–01:00\n+39 340 199 1233 · info@ambaralounge.it\nInstagram: @ambarasardinianlounge\nPrenotazione pubblica: Plateform, API non verificata\nNon è una scheda Google collegata.'
  : 'Ambàra Sardinian Lounge\nMonte Petrosu, Via di Li Graniti, 07052 San Teodoro\nBreakfast, dedicated page: 07:30–11:30\nDrinks page: 08:30–12:00\nEvening, dinner page: 17:00–01:00\n+39 340 199 1233 · info@ambaralounge.it\nInstagram: @ambarasardinianlounge\nPublic booking: Plateform, API not verified\nThis is not a connected Google listing.';
}
function fillSelect(){
 var s=$('item'), v=s.value||'evening'; s.innerHTML='';
 T[lang].items.forEach(function(it){ var o=document.createElement('option'); o.value=it[0]; o.textContent=it[1]; s.appendChild(o); });
 s.value=v; renderSlots();
}
function renderSlots(){
 var box=$('slots'), key=$('item').value||'evening', list=SLOTS[key]||SLOTS.evening;
 box.innerHTML=''; slot=null;
 list.forEach(function(n){
  var b=document.createElement('button'); b.type='button'; b.textContent=n;
  b.onclick=function(){ [].forEach.call(box.children,function(x){x.classList.remove('on')}); b.classList.add('on'); slot=n; };
  box.appendChild(b);
 });
}
function renderTeam(){
 var t=T[lang], s=stats(), req=ls(SK.r,[]), hd=ls(SK.h,[]);
 var kv=[s.msg||0,s.auto||0,s.hand||0,req.length];
 $('kpis').innerHTML=kv.map(function(v,i){return '<div class="kpi"><b>'+v+'</b><span>'+t.k[i]+'</span></div>'}).join('');
 var rows=req.map(function(r){
  return '<tr><td>'+esc(r.t)+'</td><td>'+esc(r.ch)+'</td><td>'+esc(r.sum)+'</td><td><span class="pill">'+esc(t.stNew)+'</span></td></tr>';
 }).join('') || '<tr><td colspan="4">—</td></tr>';
 $('tReq').innerHTML='<thead><tr>'+t.hReq.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody>';
 var hr=hd.map(function(h){
  var why=(A[lang]&&T[lang].why[h.r])||h.r;
  return '<tr><td>'+esc(h.t)+'</td><td>'+esc(h.l)+'</td><td>'+esc(h.q)+'</td><td><span class="pill">'+esc(why)+'</span></td></tr>';
 }).join('') || '<tr><td colspan="4">—</td></tr>';
 $('tHand').innerHTML='<thead><tr>'+t.hHand.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')+'</tr></thead><tbody>'+hr+'</tbody>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function setLang(l){
 lang=l; document.documentElement.lang=l; var t=T[l];
 document.querySelectorAll('[data-t]').forEach(function(e){ var k=e.dataset.t; if(k==='top') e.innerHTML=t.top; else if(t[k]!=null) e.textContent=t[k]; });
 document.querySelectorAll('[data-h]').forEach(function(e){ e.innerHTML=t[e.dataset.h]; });
 document.querySelectorAll('#langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l===l); });
 $('inp').placeholder=t.ph;
 $('gCard').textContent=gCardText();
 var q=location.search||'';
 $('voiceLink').setAttribute('href','../voz/ambarra/'+q);
 channelCopy(); fillSelect(); greet(); renderTeam();
 clearTimeout(setLang._t);
 setLang._t=setTimeout(function(){ if(lang===l && !M.querySelector('.u')) playScen(0); }, 350);
}
document.querySelectorAll('#tabs button').forEach(function(b){ b.onclick=function(){ show(b.dataset.tab); }; });
document.querySelectorAll('#langs button').forEach(function(b){ b.onclick=function(){ setLang(b.dataset.l); if(window.bsTrack) window.bsTrack('/lang/'+b.dataset.l,'Lang '+b.dataset.l); }; });
$('send').onclick=function(){ var v=$('inp').value.trim(); if(!v) return; $('inp').value=''; userAsk(v); };
$('inp').addEventListener('keydown',function(e){ if(e.key==='Enter') $('send').click(); });
$('item').addEventListener('change',renderSlots);
$('cta').onclick=function(){
 var ok=$('ok'); ok.style.display='block';
 if(!$('date').value||!slot){ ok.textContent=T[lang].pick; return; }
 var item=T[lang].items.filter(function(it){return it[0]===$('item').value})[0];
 var sum=(item?item[1]:$('item').value)+' · '+$('date').value+' · '+slot+' · '+($('guests').value||'?')+' · '+($('nm').value||'—')+' · '+($('ct').value||'—')+($('notes').value?' · '+$('notes').value:'');
 var rec={t:nowStr(),ch:channel==='ig'?'Instagram':'WhatsApp',sum:sum};
 var a=ls(SK.r,[]); a.unshift(rec); lsSet(SK.r,a.slice(0,30));
 ok.textContent=T[lang].ok.replace('{s}',sum);
 if(window.bsTrack) window.bsTrack('/request/demo','Demo table request');
 renderTeam();
};
$('clr').onclick=function(){ [SK.s,SK.h,SK.r].forEach(function(k){ try{localStorage.removeItem(k)}catch(e){} }); renderTeam(); };
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var d0=new Date(); d0.setDate(d0.getDate()+2);
$('date').min=iso(new Date());
$('date').value=iso(d0);
setLang('it');
window.AmbarraDemo={detectLang:detectLang,classify:classify,norm:norm};
</script>
