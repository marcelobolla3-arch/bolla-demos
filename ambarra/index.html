<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Assistente per Ambara Sardinian Lounge · BOLLA STUDIO</title>
<link rel="stylesheet" href="demo.css">
<!-- GoatCounter (BOLLA STUDIO): page /ambarra/?p=<tag>; events under /ambarra/...; ?internal=1 -> localStorage skipgc=t, nothing counted or loaded (?internal=0 resets). Counts only on demo.bollastudio.com. -->
<script type="module">
import { bootAnalytics } from "./analytics.js";
bootAnalytics();
</script>
</head>
<body>
<a class="skip" id="skip" href="#contenuto"></a>
<div class="banner" id="banner" role="status"></div>
<header>
  <a class="brand" href="https://bollastudio.com" target="_blank" rel="noopener noreferrer">BOLLA STUDIO</a>
  <p class="tag">Demo</p>
  <div class="langs" id="langs" role="group"></div>
</header>
<main id="contenuto">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <p class="note" id="lang-note"></p>
  <section aria-labelledby="kb-title">
    <h2 id="kb-title"></h2>
    <p id="one-base"></p>
    <div class="facts" id="facts"></div>
  </section>
  <div class="channels" id="channels" role="tablist"></div>
  <p class="channel-note" id="channel-note"></p>
  <div class="layout">
    <section id="stage">
      <div id="voice-panel" hidden></div>
      <div id="google-panel" hidden></div>
      <div id="chat-panel">
        <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div class="prompts" id="prompts"></div>
        <form class="ask" id="ask">
          <label id="ask-label" for="ask-input"></label>
          <input id="ask-input" name="question" autocomplete="off">
          <button class="primary" id="ask-send" type="submit"></button>
        </form>
        <div class="samples">
          <button class="ghost" id="sample-btn" type="button"></button>
        </div>
      </div>
    </section>
    <aside id="side">
      <form class="card book" id="book" novalidate></form>
      <section class="card" id="contact"></section>
    </aside>
  </div>
  <section id="menu-panel"></section>
  <section id="sources"></section>
  <details id="team"></details>
</main>
<footer>
  <span>BOLLA STUDIO · <a href="https://bollastudio.com" target="_blank" rel="noopener noreferrer">bollastudio.com</a></span>
  <span id="footer-demo"></span>
</footer>
<p class="boot" id="boot"></p>
<noscript>Questa demo ha bisogno di JavaScript. I fatti restano sul sito ufficiale https://ambaralounge.it/</noscript>
<script type="module" src="demo.js"></script>
</body>
</html>
