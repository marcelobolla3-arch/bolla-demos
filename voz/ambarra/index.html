/* Schloss Wülflingen's agent must never be mounted on this page. */
var FORBIDDEN_AGENT={"agent_3101m5z30nvbf06rvwp6def0k85b":1};
function validAgent(id){
  id=String(id||"");
  return /^agent_[a-z0-9]+$/i.test(id) && !/pendiente/i.test(id) && !FORBIDDEN_AGENT[id.toLowerCase()];
}

function apply(lang){
  var t=COPY[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-k]").forEach(function(el){
    var k=el.getAttribute("data-k");
    if(t[k]!=null && k!=="widget") el.textContent=t[k];
  });
  document.querySelectorAll("#langs button").forEach(function(b){b.classList.toggle("on", b.getAttribute("data-l")===lang);});
  var back=document.getElementById("back");
  var q=location.search||"";
  back.setAttribute("href","../../ambarra/"+q);
  var widget=document.querySelector("elevenlabs-convai");
  if(widget) widget.setAttribute("text-contents", JSON.stringify(t.widget));
  try{ sessionStorage.setItem("ambarraVoiceLang", lang); }catch(e){}
}

document.querySelectorAll("#langs button").forEach(function(b){
  b.addEventListener("click", function(){
    apply(b.getAttribute("data-l"));
    if(window.bsTrack) window.bsTrack("/ambarra/voice-lang-"+b.getAttribute("data-l"), "Voice lang "+b.getAttribute("data-l"));
  });
});

var saved="it";
try{ saved=sessionStorage.getItem("ambarraVoiceLang")||"it"; }catch(e){}
if(!COPY[saved]) saved="it";
apply(saved);

if(validAgent(AGENT_ID)){
  var el=document.createElement("elevenlabs-convai");
  el.setAttribute("agent-id", AGENT_ID);
  el.setAttribute("placement","bottom-right");

 button.addEventListener('click',function(){apply('es');setVoiceLanguage('es');if(window.bsTrack)window.bsTrack('/ambarra/voice-lang-'+button.dataset.l,'Voice lang '+button.dataset.l);});
 langs.querySelectorAll('button[data-l="it"],button[data-l="en"]').forEach(function(b){b.addEventListener('click',function(){setVoiceLanguage(b.dataset.l);});});
 var requested=new URLSearchParams(location.search).get('lang');
 if(requested==='es'||(!requested&&(/^es\b/i.test(navigator.language||'')||/\/es\//.test(document.referrer)))){apply('es');setVoiceLanguage('es');}
})();
</script>
