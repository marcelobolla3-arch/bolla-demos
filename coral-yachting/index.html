es:{hi:"¡Hola! 👋 Soy el asistente de Coral Yachting (Marina Botafoch, Ibiza). Le respondo al momento sobre barcos, precios orientativos, qué incluye, combustible, horarios o salidas. Lo que no sé con seguridad lo paso a una persona del equipo.",
 incluye:"Depende del barco y está en cada ficha. Ejemplo, De Antonio 28 «VIAMAR»:\n✅ Incluye: amarre en puerto base, bebidas de cortesía, hielo, IVA, seguro del barco, tabla de paddle surf, toallas y tripulación.\n❌ No incluye: combustible, catering, propina de la tripulación, seabob, moto de agua, efoil ni tender.\n¿Qué barco le interesa? Le digo el de ese.",
 combustible:"Con patrón: se calcula según las horas navegadas. Normalmente se pide un depósito de 2 horas de combustible por adelantado; si se gasta más se abona la diferencia y si se gasta menos se devuelve.\nSin patrón: el barco sale con el depósito lleno y al volver se reposta y se paga lo consumido.\nEjemplo: el VIAMAR consume unos 90 L/h según su ficha.",
 capacidad:"Por ley en España un barco lleva como máximo 12 pasajeros más la tripulación. Cada ficha indica su capacidad: VIAMAR 9, De Antonio 36 «IKIGAI» 11, Sunseeker Camargue 50 «SAMI DOS» 12 + 1.\nSi son más de 12, lo mejor son 2 o 3 barcos que fondean juntos; a partir de 20 personas recomendamos una goleta o un catamarán para grupos.",
 patron:"Casi toda la flota sale con patrón y tripulación. También hay barcos sin patrón, por ejemplo la Glastron 225 GTS (6 + 1 personas, desde 484 €/día orientativo; patrón opcional +220 €/día).\nQué titulación hace falta para llevarlo usted no está en la web: se lo confirma una persona del equipo.",
 horario:"La mayoría de barcos salen a partir de las 10:00 y vuelven al puerto base antes de la puesta de sol (depende del barco y de la época). Si quieren ver el atardecer a bordo, lo consulto con el equipo.",
 tiempo:"Nuestros brokers recomiendan la zona según el parte: si sopla en una costa, se busca una cala resguardada en otra.\nQué pasa con la fecha o el pago si el tiempo no permite salir no está publicado en la web, así que no se lo invento: lo paso ahora a una persona del equipo y le responde por aquí. 🙋",
 cancel:"Las condiciones de cambio o cancelación no están publicadas en la web y pueden depender del barco, así que prefiero no adivinar. Paso su consulta a una persona del equipo y le contesta por aquí. 🙋",
 salida:"Depende del barco. Puertos base de la flota: Marina Botafoch (la mayoría; ahí está nuestra oficina, local 323-324), Marina Ibiza, Santa Eulalia, San Antonio e Ibiza Port Nautic.\nIr a Formentera es el plan más habitual: en lancha o yate rápido, menos de media hora; en velero o catamarán, unas 3 h según el viento.\n¿Quieren embarcar o desembarcar en Formentera? Eso lo confirma el equipo según el barco.",
 libre:"La disponibilidad la confirma el equipo al momento, porque los barcos también se reservan por otros canales. Dígame barco, fecha y número de personas (o use «Solicitud de reserva») y lo paso ya a una persona del equipo. 🙋\nEn la versión real, el asistente consulta el calendario de la flota y responde solo.",
 pago:"Para reservar se abona el 50 % por adelantado, con tarjeta o transferencia; la reserva queda confirmada al recibir ese depósito. El resto se paga 15 días antes o el mismo día (según el barco), siempre antes de salir.",
 ninos:"Sí, la gran mayoría de barcos son aptos para niños. Díganos la edad del más pequeño y le recomendamos el barco más adecuado para su seguridad.",
 comida:"Como prefieran: pueden llevar su comida y bebida, pedir uno de nuestros menús de catering a bordo o comer en un restaurante (con antelación les podemos reservar mesa). Confirmamos qué ofrece cada barco.",
 dormir:"Sí, según el barco: suelen ser de más de 16 m y algunos tienen coste extra por noche. Para pernoctar se pide un APA del 30 % de la tarifa por adelantado (combustible, comida, amarres…); al final se hace balance y se devuelve lo que sobre.",
 precio:"Cada barco tiene su tarifa por mes publicada. Ejemplo VIAMAR (precio base orientativo por día): 1.200 € de enero a mayo y de octubre a diciembre, 1.300 € en junio, 1.400 € en julio y agosto, 1.250 € en septiembre.\nEl presupuesto completo (combustible, extras) se lo prepara el equipo.",
 extras:"Extras: seabob desde 363 €/día, paddle surf desde 72 €/día (en muchos barcos ya va incluido), catering, bebidas y transfer hasta su barco. Los puede marcar en la «Solicitud de reserva».",
 fb:"No tengo esa información confirmada en la web de Coral Yachting, así que no se la invento. Paso su pregunta a una persona del equipo y le responde por este mismo chat. 🙋",
 especial:"¡Claro! Llevamos más de 30 años en el sector y hemos organizado desde pedidas de matrimonio hasta bodas a bordo, o el transfer desde su alojamiento al puerto. Para preparar algo así le paso ya con una persona del equipo, que le asesora en persona. 🙋",

en:{hi:"Hi! 👋 I'm the Coral Yachting assistant (Marina Botafoch, Ibiza). I answer straight away about boats, indicative prices, what's included, fuel, times or departures. Anything I'm not sure about goes to a person on the team.",
 incluye:"It depends on the boat and is listed on each boat page. Example, De Antonio 28 \"VIAMAR\":\n✅ Included: mooring at home port, complimentary drinks, ice, VAT, boat insurance, paddle board, towels and crew.\n❌ Not included: fuel, catering, crew tip, seabob, jet ski, efoil or tender.\nWhich boat are you interested in? I'll tell you for that one.",
 combustible:"Skippered boats: fuel is charged by the hours cruised. We normally ask for a 2-hour fuel deposit in advance; if more is used you pay the difference, if less, it's refunded.\nBareboat: the tank is full on departure; on return it's refilled and you pay for what you used.\nExample: VIAMAR uses about 90 L/h according to its boat page.",
 capacidad:"By Spanish law a boat can carry max. 12 passengers plus crew. Each boat page shows its capacity: VIAMAR 9, De Antonio 36 \"IKIGAI\" 11, Sunseeker Camargue 50 \"SAMI DOS\" 12 + 1.\nFor more than 12, the best option is 2 or 3 boats anchoring together; for over 20 people we recommend a schooner or a group catamaran.",
 patron:"Almost the whole fleet goes out with skipper and crew. There are also bareboat options, e.g. the Glastron 225 GTS (6 + 1 people, from €484/day indicative; optional skipper +€220/day).\nWhich licence you need to skipper it yourself isn't on the website, so a person on the team will confirm it.",
 horario:"Most boats are available from 10:00 and return to their home port before sunset (depends on boat and season). If you'd like the sunset on board, I'll check with the team.",
 tiempo:"Our brokers recommend the area based on the forecast: if the wind blows on one coast, they look for a sheltered cove on another.\nWhat happens to the date or payment if the weather doesn't allow going out isn't published on the website, so I won't make it up: I'm passing this to a person on the team, who'll reply here. 🙋",
 cancel:"Change and cancellation terms aren't published on the website and may depend on the boat, so I'd rather not guess. I'm passing your question to a person on the team, who'll reply here. 🙋",
 salida:"It depends on the boat. The fleet's home ports: Marina Botafoch (most boats; our office is there, unit 323-324), Marina Ibiza, Santa Eulalia, San Antonio and Ibiza Port Nautic.\nGoing to Formentera is the classic plan: under half an hour by speedboat or motor yacht; about 3 hours by sailing boat or catamaran, depending on the wind.\nWant to board or get off in Formentera? The team confirms that per boat.",
 libre:"The team confirms availability straight away, because boats are also booked through other channels. Tell me boat, date and number of guests (or use \"Booking request\") and I'll pass it to a person on the team now. 🙋\nIn the real version, the assistant checks the fleet calendar and answers by itself.",
 pago:"To book, 50% is paid in advance by card or bank transfer; the booking is confirmed once the deposit is received. The rest is paid 15 days before or on the day (depending on the boat), always before setting off.",
 ninos:"Yes, the great majority of our boats are suitable for children. Tell us the age of the youngest and we'll recommend the right boat for their safety.",
 comida:"Up to you: bring your own food and drinks, order one of our onboard catering menus or eat at a restaurant (booking ahead lets us reserve a table). We'll confirm what each boat offers.",
 dormir:"Yes, depending on the boat: usually boats over 16 m, and some charge extra per night. For overnight stays a 30% APA (Advance Provisioning Allowance) is paid in advance for fuel, food, moorings…; at the end it's settled and any balance refunded.",
 precio:"Each boat has a published monthly rate. Example VIAMAR (indicative base price per day): €1,200 January–May and October–December, €1,300 in June, €1,400 in July and August, €1,250 in September.\nThe team prepares the full quote (fuel, extras).",
 extras:"Extras: seabob from €363/day, paddle surf from €72/day (already included on many boats), catering, drinks and transfer to your boat. You can tick them in the \"Booking request\".",
 fb:"I don't have that confirmed on the Coral Yachting website, so I won't make it up. I'm passing your question to a person on the team, who'll reply in this chat. 🙋",
 especial:"Of course! We have more than 30 years in the business and have organised everything from marriage proposals to weddings on board, or a transfer from your accommodation to the port. To plan something like that, I'm passing you to a person on the team for personal advice. 🙋",
 why:{especial:"Special request",libre:"Availability",tiempo:"Weather / date change",cancel:"Change or cancellation",fb:"Not published"},

fr:{hi:"Bonjour ! 👋 Je suis l'assistant de Coral Yachting (Marina Botafoch, Ibiza). Je réponds tout de suite sur les bateaux, les prix indicatifs, ce qui est inclus, le carburant, les horaires ou les départs. Ce dont je ne suis pas sûr, je le transmets à une personne de l'équipe.",
 incluye:"Cela dépend du bateau et figure sur chaque fiche. Exemple, De Antonio 28 « VIAMAR » :\n✅ Inclus : amarrage au port d'attache, boissons offertes, glace, TVA, assurance, paddle, serviettes et équipage.\n❌ Non inclus : carburant, traiteur, pourboire de l'équipage, seabob, jet-ski, efoil et annexe.\nQuel bateau vous intéresse ? Je vous dis pour celui-là.",
 combustible:"Avec skipper : le carburant est calculé selon les heures de navigation. On demande en général un dépôt de 2 heures de carburant à l'avance ; si vous consommez plus, vous payez la différence, sinon on vous rembourse.\nSans skipper : le réservoir est plein au départ ; au retour on refait le plein et vous payez ce qui a été consommé.\nExemple : le VIAMAR consomme environ 90 L/h selon sa fiche.",
 capacidad:"Selon la loi espagnole, un bateau transporte au maximum 12 passagers plus l'équipage. Chaque fiche indique sa capacité : VIAMAR 9, De Antonio 36 « IKIGAI » 11, Sunseeker Camargue 50 « SAMI DOS » 12 + 1.\nAu-delà de 12, le mieux est 2 ou 3 bateaux qui mouillent côte à côte ; au-delà de 20 personnes, nous conseillons une goélette ou un catamaran pour groupes.",
 patron:"Presque toute la flotte sort avec skipper et équipage. Il existe aussi des bateaux sans skipper, par exemple le Glastron 225 GTS (6 + 1 personnes, dès 484 €/jour indicatif ; skipper en option +220 €/jour).\nLe permis nécessaire pour le piloter vous-même n'est pas indiqué sur le site : une personne de l'équipe vous le confirme.",
 horario:"La plupart des bateaux sont disponibles à partir de 10h00 et rentrent au port d'attache avant le coucher du soleil (selon le bateau et la saison). Pour le coucher de soleil à bord, je vérifie avec l'équipe.",
 tiempo:"Nos brokers conseillent la zone selon la météo : si le vent souffle sur une côte, on cherche une crique abritée sur une autre.\nCe qui se passe pour la date ou le paiement si la météo empêche de sortir n'est pas publié sur le site, donc je ne l'invente pas : je transmets à une personne de l'équipe, qui vous répond ici. 🙋",
 cancel:"Les conditions de modification ou d'annulation ne sont pas publiées sur le site et peuvent dépendre du bateau, je préfère donc ne pas deviner. Je transmets votre question à une personne de l'équipe, qui vous répond ici. 🙋",
 salida:"Cela dépend du bateau. Ports d'attache de la flotte : Marina Botafoch (la plupart ; notre bureau y est, local 323-324), Marina Ibiza, Santa Eulalia, San Antonio et Ibiza Port Nautic.\nAller à Formentera est le grand classique : moins d'une demi-heure en vedette ou yacht à moteur ; environ 3 h en voilier ou catamaran, selon le vent.\nVous voulez embarquer ou débarquer à Formentera ? L'équipe le confirme selon le bateau.",
 libre:"L'équipe confirme la disponibilité tout de suite, car les bateaux se réservent aussi par d'autres canaux. Donnez-moi bateau, date et nombre de personnes (ou utilisez « Demande de réservation ») et je transmets à une personne de l'équipe. 🙋\nDans la vraie version, l'assistant consulte le calendrier de la flotte et répond seul.",
 pago:"Pour réserver, 50 % sont payés à l'avance par carte ou virement ; la réservation est confirmée à réception de cet acompte. Le solde se paie 15 jours avant ou le jour même (selon le bateau), toujours avant le départ.",
 ninos:"Oui, la grande majorité de nos bateaux conviennent aux enfants. Indiquez-nous l'âge du plus jeune et nous vous conseillerons le bateau le plus adapté à sa sécurité.",
 comida:"Comme vous préférez : apporter vos repas et boissons, commander un de nos menus traiteur à bord ou déjeuner au restaurant (en réservant tôt, nous pouvons réserver une table). Nous confirmons ce que propose chaque bateau.",
 dormir:"Oui, selon le bateau : en général plus de 16 m, et certains facturent un supplément par nuit. Pour dormir à bord, on demande un APA de 30 % du tarif à l'avance (carburant, repas, amarrages…) ; à la fin on fait le bilan et on rembourse le solde.",
 precio:"Chaque bateau a un tarif mensuel publié. Exemple VIAMAR (prix de base indicatif par jour) : 1 200 € de janvier à mai et d'octobre à décembre, 1 300 € en juin, 1 400 € en juillet et août, 1 250 € en septembre.\nL'équipe prépare le devis complet (carburant, extras).",
 extras:"Extras : seabob dès 363 €/jour, paddle dès 72 €/jour (déjà inclus sur beaucoup de bateaux), traiteur, boissons et transfert jusqu'au bateau. Vous pouvez les cocher dans la « Demande de réservation ».",
 fb:"Je n'ai pas cette information confirmée sur le site de Coral Yachting, donc je ne l'invente pas. Je transmets votre question à une personne de l'équipe, qui vous répond dans ce chat. 🙋",
 especial:"Bien sûr ! Avec plus de 30 ans d'expérience, nous avons organisé des demandes en mariage, des mariages à bord ou le transfert depuis votre hébergement jusqu'au port. Pour préparer cela, je vous mets en contact avec une personne de l'équipe qui vous conseillera. 🙋",
 why:{especial:"Demande spéciale",libre:"Disponibilité",tiempo:"Météo / changement de date",cancel:"Modification ou annulation",fb:"Info non publiée"},
 chips:[["Qu'est-ce qui est inclus ?","incluye"],["Combien de personnes ?","capacidad"],["Carburant ?","combustible"],["Sans skipper ?","patron"],["Horaires","horario"],["D'où partez-vous ?","salida"],["Prix","precio"],["Et s'il fait mauvais ?","tiempo"],["Annuler","cancel"],["Libre le 15/7 ?","libre"],["Paiement","pago"],["Enfants","ninos"]],
 sc:[["⛵ « VIAMAR pour 8 le 15/7 ? Et s'il y a du vent ? »",[["u","Bonjour ! Le VIAMAR est libre le 15 juillet pour 8 personnes ? Qu'est-ce qui est inclus ?"],["b","Bonjour ! Le De Antonio 28 « VIAMAR » (2024, Marina Botafoch) accueille jusqu'à 9 personnes, donc 8 c'est parfait 👍\nPrix de base indicatif en juillet : 1 400 €/jour.\nInclus : amarrage, boissons offertes, glace, TVA, assurance, paddle, serviettes et équipage. Non inclus : carburant (environ 90 L/h ; dépôt de 2 h), traiteur et pourboire."],["h","Une personne de l'équipe confirme maintenant la disponibilité du 15/7 : je lui ai transmis bateau, date et personnes. 🙋","libre"],["u","Et s'il y a du vent ce jour-là ?"],["i","tiempo"]]],
  ["👥 « Nous sommes 15 amis »",[["u","Nous sommes 15 amis, il y a un bateau pour tous ? On peut apporter à manger ?"],["i","capacidad"],["i","comida"]]],
  ["🏝️ « Nous logeons à Formentera »",[["u","Nous logeons à Formentera. D'où partez-vous et combien de temps faut-il ?"],["i","salida"]]],
  ["🧭 « Sans skipper ? Et le carburant ? »",[["u","Vous avez des bateaux sans skipper ? Comment ça marche pour le carburant ?"],["i","patron"],["i","combustible"]]],
  ["🐶 Question absente du site",[["u","Je peux emmener mon chien à bord ?"],["i","fb"]]]]},
de:{hi:"Hallo! 👋 Ich bin der Assistent von Coral Yachting (Marina Botafoch, Ibiza). Ich antworte sofort zu Booten, unverbindlichen Preisen, Leistungen, Treibstoff, Zeiten oder Abfahrten. Was ich nicht sicher weiß, gebe ich an eine Person im Team weiter.",
 incluye:"Das hängt vom Boot ab und steht auf jeder Bootsseite. Beispiel De Antonio 28 „VIAMAR“:\n✅ Inklusive: Liegeplatz im Heimathafen, Begrüßungsgetränke, Eis, MwSt., Bootsversicherung, Paddle-Board, Handtücher und Crew.\n❌ Nicht inklusive: Treibstoff, Catering, Trinkgeld, Seabob, Jetski, Efoil und Tender.\nWelches Boot interessiert Sie? Dann sage ich es Ihnen dafür.",
 combustible:"Mit Skipper: Der Treibstoff wird nach Fahrstunden berechnet. Meist wird ein Treibstoffdepot für 2 Stunden im Voraus verlangt; bei mehr Verbrauch zahlen Sie die Differenz, bei weniger gibt es eine Rückerstattung.\nOhne Skipper: Der Tank ist bei Abfahrt voll; bei Rückkehr wird nachgetankt und der Verbrauch bezahlt.\nBeispiel: Die VIAMAR verbraucht laut Bootsseite etwa 90 L/h.",
 capacidad:"Nach spanischem Gesetz darf ein Boot max. 12 Passagiere plus Crew befördern. Jede Bootsseite nennt die Kapazität: VIAMAR 9, De Antonio 36 „IKIGAI“ 11, Sunseeker Camargue 50 „SAMI DOS“ 12 + 1.\nBei mehr als 12 sind 2 oder 3 Boote ideal, die nebeneinander ankern; ab 20 Personen empfehlen wir einen Schoner oder Gruppenkatamaran.",
 patron:"Fast die ganze Flotte fährt mit Skipper und Crew. Es gibt auch Boote ohne Skipper, z. B. die Glastron 225 GTS (6 + 1 Personen, ab 484 €/Tag unverbindlich; Skipper optional +220 €/Tag).\nWelcher Bootsführerschein nötig ist, steht nicht auf der Website: das bestätigt Ihnen eine Person im Team.",
 horario:"Die meisten Boote sind ab 10:00 Uhr verfügbar und kehren vor Sonnenuntergang in den Heimathafen zurück (je nach Boot und Saison). Für den Sonnenuntergang an Bord frage ich beim Team nach.",
 tiempo:"Unsere Broker empfehlen das Gebiet je nach Wetterbericht: Weht es an einer Küste, sucht man eine geschützte Bucht an einer anderen.\nWas mit Datum oder Zahlung passiert, wenn das Wetter keine Ausfahrt erlaubt, steht nicht auf der Website. Deshalb erfinde ich nichts: Ich gebe das jetzt an eine Person im Team weiter, die Ihnen hier antwortet. 🙋",
 cancel:"Umbuchungs- und Stornobedingungen sind nicht auf der Website veröffentlicht und können vom Boot abhängen, darum rate ich lieber nicht. Ich gebe Ihre Frage an eine Person im Team weiter, die Ihnen hier antwortet. 🙋",
 salida:"Das hängt vom Boot ab. Heimathäfen der Flotte: Marina Botafoch (die meisten; dort ist auch unser Büro, Lokal 323-324), Marina Ibiza, Santa Eulalia, San Antonio und Ibiza Port Nautic.\nNach Formentera ist der Klassiker: mit Speedboot oder Motoryacht unter einer halben Stunde; mit Segelboot oder Katamaran etwa 3 Stunden, je nach Wind.\nSie möchten in Formentera ein- oder aussteigen? Das bestätigt das Team je nach Boot.",
 libre:"Die Verfügbarkeit bestätigt das Team sofort, weil die Boote auch über andere Kanäle gebucht werden. Nennen Sie mir Boot, Datum und Personenzahl (oder nutzen Sie die „Buchungsanfrage“), dann gebe ich es gleich an eine Person im Team weiter. 🙋\nIn der echten Version prüft der Assistent den Flottenkalender und antwortet selbst.",
 pago:"Zur Buchung werden 50 % im Voraus per Karte oder Überweisung bezahlt; die Buchung ist mit Eingang der Anzahlung bestätigt. Der Rest wird 15 Tage vorher oder am selben Tag (je nach Boot) bezahlt, immer vor dem Auslaufen.",
 ninos:"Ja, die allermeisten unserer Boote sind für Kinder geeignet. Nennen Sie uns das Alter des jüngsten Kindes, dann empfehlen wir das passende Boot für seine Sicherheit.",
 comida:"Wie Sie möchten: eigenes Essen und Getränke mitbringen, eines unserer Catering-Menüs an Bord bestellen oder im Restaurant essen (bei früher Buchung reservieren wir einen Tisch). Wir bestätigen, was jedes Boot bietet.",
 dormir:"Ja, je nach Boot: meist Boote über 16 m, manche mit Aufpreis pro Nacht. Für Übernachtungen wird ein APA von 30 % des Tarifs im Voraus verlangt (Treibstoff, Verpflegung, Liegeplätze…); am Ende wird abgerechnet und der Rest erstattet.",
 precio:"Jedes Boot hat einen veröffentlichten Monatstarif. Beispiel VIAMAR (unverbindlicher Grundpreis pro Tag): 1.200 € von Januar bis Mai und Oktober bis Dezember, 1.300 € im Juni, 1.400 € im Juli und August, 1.250 € im September.\nDas vollständige Angebot (Treibstoff, Extras) erstellt das Team.",
 extras:"Extras: Seabob ab 363 €/Tag, Paddle-Surf ab 72 €/Tag (auf vielen Booten schon inklusive), Catering, Getränke und Transfer zum Boot. Sie können sie in der „Buchungsanfrage“ ankreuzen.",
 fb:"Dazu habe ich auf der Website von Coral Yachting keine bestätigte Angabe, deshalb erfinde ich nichts. Ich gebe Ihre Frage an eine Person im Team weiter, die Ihnen in diesem Chat antwortet. 🙋",
 especial:"Sehr gern! Wir sind seit über 30 Jahren in der Branche und haben schon Heiratsanträge, Hochzeiten an Bord oder den Transfer von Ihrer Unterkunft zum Hafen organisiert. Damit wir so etwas vorbereiten, gebe ich Sie an eine Person im Team weiter, die Sie persönlich berät. 🙋",
 why:{especial:"Sonderwunsch",libre:"Verfügbarkeit",tiempo:"Wetter / Umbuchung",cancel:"Umbuchung oder Storno",fb:"Nicht veröffentlicht"},
 chips:[["Was ist inklusive?","incluye"],["Wie viele Personen?","capacidad"],["Treibstoff?","combustible"],["Ohne Skipper?","patron"],["Zeiten","horario"],["Wo geht es los?","salida"],["Preise","precio"],["Bei schlechtem Wetter?","tiempo"],["Stornieren","cancel"],["Am 15.7. frei?","libre"],["Zahlung","pago"],["Kinder","ninos"]],
 sc:[["⛵ „VIAMAR für 8 am 15.7.? Und bei Wind?“",[["u","Hallo! Ist die VIAMAR am 15. Juli für 8 Personen frei? Was ist inklusive?"],["b","Hallo! Die De Antonio 28 „VIAMAR“ (2024, Marina Botafoch) ist für bis zu 9 Personen, 8 passen also gut 👍\nUnverbindlicher Grundpreis im Juli: 1.400 €/Tag.\nInklusive: Liegeplatz, Begrüßungsgetränke, Eis, MwSt., Versicherung, Paddle-Board, Handtücher und Crew. Nicht inklusive: Treibstoff (ca. 90 L/h; Depot für 2 Std.), Catering und Trinkgeld."],["h","Die Verfügbarkeit für den 15.7. bestätigt jetzt eine Person im Team: Boot, Datum und Personenzahl habe ich weitergegeben. 🙋","libre"],["u","Und wenn an dem Tag Wind ist?"],["i","tiempo"]]],
  ["👥 „Wir sind 15 Freunde“",[["u","Wir sind 15 Freunde, gibt es ein Boot für alle? Dürfen wir Essen mitbringen?"],["i","capacidad"],["i","comida"]]],
  ["🏝️ „Wir wohnen auf Formentera“",[["u","Wir wohnen auf Formentera. Wo legen Sie ab und wie lange dauert es?"],["i","salida"]]],
  ["🧭 „Ohne Skipper? Und Treibstoff?“",[["u","Haben Sie Boote ohne Skipper? Wie läuft das mit dem Treibstoff?"],["i","patron"],["i","combustible"]]],

var lang='es',run=0;
var $=function(id){return document.getElementById(id)};
function ls(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function stats(){return ls('cy_stats',{conv:0,auto:0,hand:0,langs:{}})}
function bump(f){var s=stats();s[f]=(s[f]||0)+1;s.langs[lang]=1;lsSet('cy_stats',s)}
function nowStr(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var M=$('msgs');
function add(t,c){var e=document.createElement('div');e.className='m '+c;e.textContent=t;M.appendChild(e);M.scrollTop=M.scrollHeight;return e}
var lastQ='';
function handLog(key,q){var h=ls('cy_hand',[]);h.unshift({t:nowStr(),l:lang.toUpperCase(),q:q||lastQ,r:key});lsSet('cy_hand',h.slice(0,30))}
function botSay(text,isHand,key,r,cb){var t=add('…','b typing');setTimeout(function(){if(r!==run)return;t.remove();add(text,isHand?'b h':'b');
 if(isHand){bump('hand');handLog(key);add(T[lang].sysHand,'sys')}else bump('auto');cb&&cb()},850)}
function answer(key,r,cb){var a=A[lang];botSay(a[key]||a.fb,!!HAND[key],key,r,cb)}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function classify(s){var n=norm(s);for(var i=0;i<RX.length;i++){if(RX[i][1].test(n))return RX[i][0]}return 'fb'}
function userAsk(text,key){lastQ=text;add(text,'u');var k=key||classify(text);window.bsTrack&&bsTrack('/ask/'+lang+'/'+k,'Ask '+k);answer(k,run)}
function playScen(i){run++;var r=run;M.innerHTML='';var S=A[lang].sc[i][1];bump('conv');window.bsTrack&&bsTrack('/scenario/'+lang+'/'+(i+1),'Scenario '+(i+1));
 (function step(j){if(r!==run||j>=S.length)return;var m=S[j];
  if(m[0]=='u'){lastQ=m[1];add(m[1],'u');setTimeout(function(){step(j+1)},700)}
  else if(m[0]=='b')botSay(m[1],false,null,r,function(){setTimeout(function(){step(j+1)},500)});
  else if(m[0]=='h')botSay(m[1],true,m[2],r,function(){setTimeout(function(){step(j+1)},500)});
  else answer(m[1],r,function(){setTimeout(function(){step(j+1)},500)})})(0)}
function renderChat(){run++;M.innerHTML='';add(A[lang].hi,'b');var ch=$('chips');ch.innerHTML='';
 A[lang].chips.forEach(function(c){var b=document.createElement('button');b.textContent=c[0];b.onclick=function(){userAsk(c[0],c[1])};ch.appendChild(b)});
 var sc=$('scen');sc.innerHTML='';A[lang].sc.forEach(function(s,i){var b=document.createElement('button');b.className='sc';b.textContent=s[0];b.onclick=function(){playScen(i);if(window.innerWidth<860)M.scrollIntoView({behavior:'smooth',block:'center'})};sc.appendChild(b)});
 $('inp').placeholder=T[lang].ph}
var started={};
function send(){var v=$('inp').value.trim();if(!v)return;$('inp').value='';if(!started[run]){started[run]=1;bump('conv')}userAsk(v)}
$('send').onclick=send;$('inp').onkeydown=function(e){if(e.key==='Enter')send()};

var EXK=['seabob','paddle','catering','transfer','drinks','skipper'];
function boatName(b){return b.id==='other'?T[lang].other:b.n.replace('(catamarán)',{es:'(catamarán)',en:'(catamaran)',fr:'(catamaran)',de:'(Katamaran)'}[lang]).replace('(sin patrón)',{es:'(sin patrón)',en:'(bareboat)',fr:'(sans skipper)',de:'(ohne Skipper)'}[lang])}
function renderForm(){var s=$('boat'),sel=s.value||'viamar';s.innerHTML='';BOATS.forEach(function(b){var o=document.createElement('option');o.value=b.id;o.textContent=b.id==='other'?T[lang].other:boatName(b)+' · '+b.cap+' '+T[lang].pers+' · '+b.base;s.appendChild(o)});s.value=sel;
 var ex=$('extras'),was={};[].forEach.call(ex.querySelectorAll('input'),function(i){was[i.value]=i.checked});ex.innerHTML='';
 EXK.forEach(function(k){var l=document.createElement('label');l.innerHTML='<input type="checkbox" value="'+k+'"'+(was[k]?' checked':'')+'> '+esc(T[lang].ex[k]);l.dataset.k=k;ex.appendChild(l)});
 [].forEach.call(ex.querySelectorAll('input'),function(i){i.onchange=price});price()}
function cur(){var b=BOATS.filter(function(x){return x.id===$('boat').value})[0]||BOATS[0];return b}
function price(){var b=cur(),t=T[lang],v=$('date').value,g=+$('guests').value||0,p=$('price'),w=$('warn');
 var sk=$('extras').querySelector('label[data-k="skipper"]');if(sk){sk.style.display=b.bare?'':'none';if(!b.bare)sk.querySelector('input').checked=false}
 var pl=$('extras').querySelector('label[data-k="paddle"]');if(pl){pl.style.display=b.pad?'none':'';if(b.pad)pl.querySelector('input').checked=false}
 var warn=[];if(g>12)warn.push(t.wLaw);else if(b.id!=='other'&&g>b.cap)warn.push(t.wCap.replace('{c}',b.cap));
 w.style.display=warn.length?'block':'none';w.textContent=warn.join(' ');
 if(b.id==='other'){p.textContent=t.pOther;return null}
 if(!v){p.textContent=t.need;return null}
 var mo=+v.split('-')[1]-1,r=b.r[mo];
 if(r==null){p.textContent=t.pNone;return null}
 var extra=[];if(b.bare&&$('extras').querySelector('input[value="skipper"]').checked)extra.push(t.ex.skipper);
 p.innerHTML=esc(t.pBase)+' ('+esc(t.pMonth)+' '+esc(MONTHS[lang][mo])+'): <b class="big">'+eur(r)+esc(t.perDay)+'</b><br><span class="note">'+esc(b.pad?t.pNote:t.pNote2)+' · coralyachting.com</span>';
 return eur(r)+t.perDay}
['boat','date','guests'].forEach(function(id){$(id).addEventListener('input',price);$(id).addEventListener('change',price)});
$('cta').onclick=function(){var b=cur(),v=$('date').value,g=$('guests').value,ok=$('ok');ok.style.display='block';
 if(!v||!g){ok.textContent=T[lang].need;return}
 var pr=price()||'—',exs=[].filter.call($('extras').querySelectorAll('input'),function(i){return i.checked&&i.parentNode.style.display!=='none'}).map(function(i){return T[lang].ex[i.value].replace(/ \(.*\)/,'')});
 var d=v.split('-'),ds=d[2]+'/'+d[1]+'/'+d[0];
