var req=new URLSearchParams(location.search).get("lang");
apply(req==="en"?"en":"it");

/* ---- WhatsApp-style chat on the real agent (text-only) ---- */
var body=document.getElementById("waBody"),ws=null,ready=false,pending=[],typingEl=null,started=false,waiting=0;
function hhmm(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function bubble(cls,text){var d=document.createElement("div");d.className="msg "+cls;d.textContent=text;var s=document.createElement("span");s.className="t";s.textContent=hhmm()+(cls==="me"?" ✓✓":"");d.appendChild(s);body.appendChild(d);body.scrollTop=body.scrollHeight;return d;}
function sys(text){var d=document.createElement("div");d.className="sys";d.textContent=text;body.appendChild(d);}
function typing(on){if(on&&!typingEl){typingEl=document.createElement("div");typingEl.className="typing";typingEl.innerHTML="<i></i><i></i><i></i>";body.appendChild(typingEl);body.scrollTop=body.scrollHeight;document.getElementById("waStatus").textContent=COPY[lang].connecting;}
 if(!on&&typingEl){typingEl.remove();typingEl=null;document.getElementById("waStatus").textContent=COPY[lang].online;}}
function resetChat(){try{if(ws)ws.close();}catch(e){}ws=null;ready=false;pending=[];started=false;waiting=0;body.innerHTML="";sys(COPY[lang].sys);}
function connect(){
 if(!validAgent(AGENT_ID)){sys(COPY[lang].err);return;}
 ws=new WebSocket("wss://api.elevenlabs.io/v1/convai/conversation?agent_id="+AGENT_ID);
 ws.onopen=function(){ws.send(JSON.stringify({type:"conversation_initiation_client_data",conversation_config_override:{conversation:{text_only:true},agent:{language:lang}}}));};
 ws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data);}catch(e){return;}
  if(m.type==="ping"){ws.send(JSON.stringify({type:"pong",event_id:m.ping_event.event_id}));return;}
  if(m.type==="conversation_initiation_metadata"){ready=true;setTimeout(function(){pending.forEach(function(p){ws.send(JSON.stringify({type:"user_message",text:p}));});pending=[];},300);return;}
  if(m.type==="agent_response"){var txt=m.agent_response_event.agent_response;
   typing(false);bubble("bot",txt);capture(txt);if(window.bsTrack&&!body.dataset.resp){body.dataset.resp=1;window.bsTrack("/la-tavernetta-porto-taverna/chat-response","chat-response");}
   if(!started){started=true;if(waiting>0)typing(true);}else{waiting=Math.max(0,waiting-1);if(waiting>0)typing(true);}}
 };
 ws.onerror=function(){typing(false);sys(COPY[lang].err);};
 ws.onclose=function(){ready=false;ws=null;typing(false);};
}
var lastBot=[],added={};
function capture(txt){lastBot.push(txt);if(lastBot.length>4)lastBot.shift();
 if(/annotato la richiesta|noted (your|the) request|I've noted|ho annotato|anotado la solicitud/i.test(txt)){
  var summary="";for(var i=lastBot.length-2;i>=0;i--){if(/riassum|summar|recap|conferma\?|confirm\?|\d{1,2}[:.]\d{2}/i.test(lastBot[i])){summary=lastBot[i];break;}}
  var it=summary||txt;if(added[it])return;added[it]=1;if(summary)added[txt]=1;addStaff(it);if(window.bsTrack)window.bsTrack("/la-tavernetta-porto-taverna/request","Richiesta annotata");}}
function addStaff(s){var box=document.getElementById("staffList");var e=box.querySelector(".empty");if(e)e.remove();
 var t=box.querySelector("table");if(!t){t=document.createElement("table");t.innerHTML="<tr><th>"+(lang==="en"?"Time":"Ora")+"</th><th>"+(lang==="en"?"Request":"Richiesta")+"</th></tr>";box.appendChild(t);}
 var tr=document.createElement("tr");var a=document.createElement("td");a.textContent=hhmm();var b=document.createElement("td");b.textContent=s;tr.appendChild(a);tr.appendChild(b);t.appendChild(tr);}
function send(text){text=String(text||"").trim();if(!text)return;bubble("me",text);typing(true);waiting++;
 if(window.bsTrack&&!body.dataset.tracked){body.dataset.tracked=1;window.bsTrack("/la-tavernetta-porto-taverna/chat-start","Chat avviata");}
 if(ws&&ready){ws.send(JSON.stringify({type:"user_message",text:text}));}else{pending.push(text);if(!ws)connect();}}
document.getElementById("waForm").addEventListener("submit",function(e){e.preventDefault();var i=document.getElementById("waInput");send(i.value);i.value="";});
resetChat();

/* ---- Uso: link/pulsanti con data-track (nessun testo digitato) ---- */
document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("[data-track]"):null;if(a&&window.bsTrack)window.bsTrack(a.getAttribute("data-track"),a.getAttribute("data-title"));},true);
/* ---- Voice: ElevenLabs widget with the same agent ---- */
if(validAgent(AGENT_ID)){
 var el=document.createElement("elevenlabs-convai");el.setAttribute("agent-id",AGENT_ID);el.setAttribute("placement","bottom-right");el.setAttribute("override-language",lang);el.style.display="none";
 el.setAttribute("text-contents",JSON.stringify(lang==="en"?{main_label:"La Tavernetta assistant",start_call:"Start the call",end_call:"End",new_call:"New call",listening_status:"Listening",speaking_status:"Speak to interrupt",connecting_status:"Connecting"}:{main_label:"Assistente La Tavernetta",start_call:"Avvia la chiamata",end_call:"Termina",new_call:"Nuova chiamata",listening_status:"In ascolto",speaking_status:"Parla per interrompere",connecting_status:"Connessione"}));
 document.body.appendChild(el);
 var sc=document.createElement("script");sc.src="https://unpkg.com/@elevenlabs/convai-widget-embed";sc.async=true;document.body.appendChild(sc);
 document.addEventListener("elevenlabs-convai:call",function(){if(window.bsTrack)window.bsTrack("/la-tavernetta-porto-taverna/voice-start","Chiamata vocale avviata");},true);
}
document.getElementById("voiceBtn").addEventListener("click",function(){
 var w=document.querySelector("elevenlabs-convai");if(!w)return;w.style.display="";
 setTimeout(function(){var root=w.shadowRoot;var b=null;
  if(root){b=root.querySelector('button[aria-label*="all"],button[aria-label*="hiamat"]');}
  if(b){b.click();}},500);
});
</script>
