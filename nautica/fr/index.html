40 Ah (12 V) Engines.................................................................. 2 x 110 Ah (12 V) Generator..................................................................... 110 Ah (12 V) Maxi engine power............................................................. 2 x 57 CV LAGOON 42 1 Bottom surface: approx. 55 m2"},{"d":"UG","p":12,"pdf":14,"sec":"","t":"HELM STATION 1 2 3 4 5 2 6 7 8 9 SPECIFICATIONS 12 10 1 - Port engine panel. 2 - Screen / repeater for electronic (optional extra). 3 - Power, start and stop switches for the port engine. 4 - Screen / repeater for electronic (optional extra). LAGOON 42 11 5 - Compass. 6 - Starboard engine panel. 7 - Automatic pilot control (optional extra). 8 - Power, start and stop switches for the starboard engine. 9 - Engine controls. 10 - Steering wheel. 11 - Double USB socket."},{"d":"UG","p":13,"pdf":15,"sec":"Electrical panel","t":"ELECTRICAL PANEL 1 2 3 4 5 6 7 8 9 1 SPECIFICATIONS 13 10 11 1 - Water heater 220 V power switch. 2 - Voltmeter / 220 V. 3 - Battery charger switch. 4 - Internal lighting switch. 5 - Auxiliary unit (electro valve for U.S. version). 6 - Refrigerated unit switch. LAGOON 42 12 13 14 15 7 - Deck floodlight switch. 8 - Navigation instruments switch. 9 - LCD screen. 10 - 220 V socket switch. 11 - Line-reversing switch (US version). 12 - 12 V socket. 16 17 13 - Pressure water pump switch. 14 - Bilge pump switch. 15 - Anchorage light switch. 16 - Engine light switch. 17 - LCD screen control (fresh water / fuel gauge, voltmeter, ammeter, battery alarm)."},{"d":"UG","p":15,"pdf":17,"sec":"","t":"HULL / DECK 2 2.1 Construction 2.2 Careening - Dry harbour 2.3 Deck equipments 2.4 Cockpit 2.5 Gangway 2.6 Steering system 2.7 Anchoring 2.8 Deckwash pump 2.9 Davit 2.10 Solar panels 2.11 Access to helm station 15"},{"d":"UG","p":16,"pdf":18,"sec":"","t":"HULL PROTECTION PROTECTIVE FENDERS HULL / DECK 16 SECURED BY PROPS IN DRY HARBOUR 4608 mm LAGOON 42"},{"d":"UG","p":17,"pdf":19,"sec":"2.1 Construction","t":"HULL / DECK n 2.1 Construction n 2.3 Deck equipments The LAGOON 42 is constructed following the infusion process of a polyester resin and a high quality anti-osmotic resin on a core of balsa and fibreglass layers. l The hull bottoms and keels are made of monolithic laminates by infusion. n 2.2 Careening - Dry harbour A periodical careening of your boat will keep her original performances and avoid any adhesion of marine vegetation. The type of the water where you boat sails determines how to choose the antifouling paint as well as how often to carry out these careenings. Please contact a professional for advice. DECK FITTINGS The fittings on the deck of your LAGOON 42 were selected according to quality criteria. To keep them to their best look, a regular maintenance is necessary. - Rinse the equipments with fresh water, particularly the stainless steel parts. - Lubricate the different blocks, sheaves, turnbuckles, winches, tracks and travellers. - Clean and polish the stainless steel parts with a chrome and stainless steel polish in case of oxidation. HULL / DECK PULPITS Regularly rinse the stainless steel parts with fresh water. l LIFELINES Inspect the metal lifelines for ‘hairy wires’. Check for corrosion, in particular on the connections. l WARNING When in dry harbour, it is vital to secure the boat’s base by placing a prop under each hull as shown in the following diagram. LAGOON 42 2 OUTSIDE WOODWORK Regularly rinse and brush the outside woodwork with fresh water. There are teak cleaners and brighteners on sale. The use of a pressure washer is not advisable on teak. l 17"},{"d":"UG","p":18,"pdf":20,"sec":"2.2 Careening - Dry harbour","t":"Deck equipmentS SLIDING WINDOW - ENTRANCE DOOR ENTRANCE DOOR EXTERNAL LOCK SYSTEM HULL / DECK 18 ENTRANCE DOOR INTERNAL BRAKE SYSTEM LAGOON 42 SWIM LADDER SHOWER IN TRANSOM"},{"d":"UG","p":19,"pdf":21,"sec":"2.4 Cockpit","t":"HULL / DECK PLEXIGLAS To protect the surface of your windows in plexiglas, avoid any contact with alcohols, tanning creams, sand and all abrasive products generally speaking. - Rinse the plexiglas with fresh water, do not use solvents. - Brighten up with a soft rag soaked with a gentle cleaning product. - Use polish paste to remove scratches. l COCKPIT TABLE The cockpit table is removable. l SWIM LADDER A stainless steel swimming ladder is located on the aft starboard transom. The boat may optionally be fitted with a second swimming ladder. l WARNING For safety’s sake, always sail with the ladder up and kept in position. Unfold the ladder at the mooring whenever a crew member is lowered to the water. n 2.4 Cockpit ACCESS DOOR The sliding door is fitted with a mechanism allowing its locking in an open position. A latch on the door jamb allows its locking from inside the saloon. l RECOMMENDATION While sailing, block the sliding door locking it. LAGOON 42 2 HULL / DECK 19 SHOWER A shower supplied with hot and cold water (optional extra) is located on the side of the aft starboard transom. l"},{"d":"UG","p":20,"pdf":22,"sec":"2.4 Cockpit","t":"STROP - ELECTRIC WINDLASS STROP CIRCUIT 1 2 HULL / DECK 3 20 CONTROL OF THE WINDLASS 1 - Electric windlass. 2 - Control of the electric windlass. 3 - Windlass automatic breaker. LAGOON 42 AUTOMATIC BREAKER OF THE WINDLASS"},{"d":"UG","p":21,"pdf":23,"sec":"2.5 Gangway (optional extra)","t":"HULL / DECK n 2.5 Gangway (optional extra) The boat may optionally be fitted with a foldable carbon gangway. Remove, store and stow the gangway when sailing. WARNING Do not use the gangway as a diving board. n 2.7 Anchoring WINDLASS The electric windlass works with the 12 V domestic batteries. Activate the windlass using its control located in the starboard side locker on the front deck. l If the electrical windlass does not function properly, check its automatic breaker located in the starboard passageway cupboard. For the maintenance of the windlass, please refer to the manufacturer’s guide. n 2.6 Steering system The steering system is made up of steering cables (stainless steel cables) and two quadrants. You can reach it through the engine compartments both starboard and port sides. RECOMMENDATION Use the electric windlass when one or two engines are operating. PREPARING ANCHORING Set the strop fastening it to the chainplates at the ends of the main beam. Insert the strop inside the stem anchor roller. Make fast the strop to the central cleat when lowering the chain. l The suspended rudders are fitted with stainless steel stocks. Only WD 40 should be used to maintain nylon ertalon or teflon bushings. Please refer to Chapter ‘SAFETY’ as for the emergency tiller use. RECOMMENDATION Before you anchor, check the type of the sea bed, the depth of water and the strength of the stream. LAGOON 42 2 HULL / DECK 21"},{"d":"UG","p":22,"pdf":24,"sec":"2.6 Steering system","t":"DECKWASH PUMP 1 2 HULL / DECK 22 1 - Deckwash pump. 2 - Valve to select fresh water / sea water. 4 1 2 3 4 5 Nota: the same layout can be observed in the other version. LAGOON 42 3 - Power switch. 4 - Sea water inlet valve. 5 - Intake to connect hose. 5 3"},{"d":"UG","p":23,"pdf":25,"sec":"2.7 Anchoring","t":"HULL / DECK ANCHORING Have your boat head wind and without speed. Pay out the chain while moving back slowly. Secure the chain on the strop. Release the chain until the strop is taut. Pay attention to the swinging space when mooring. l RAISING THE GROUND TACKLE Check the chain is properly set on the grab. Operate the windlass setting it to the ‘upward’ position. Slowly go near the anchor using the engine (do not use the windlass force to winch up the boat). Visually check the final metres until the anchor gets into contact with the anchor fairlead. Check the position of the anchor on the stem fitting. WARNING Windlass operations are dangerous: - Always keep the ground takle clear and free. - Always proceed with care, wearing gloves and always wearing shoes. - Make sure that nobody leans on the windlass when operating the control. l Rinse the windlass and the ground tackle with fresh water after each trip. In case of electric failure, use the winch handle on the windlass to raise the ground tackle. Refer to the manufacturer’s instructions for windlass maintenance. LAGOON 42 n 2.8 Deckwash pump (optional extra) The deck wash pump is located in the port engine compartment. It can provide sea water or fresh water coming from the tank. The freshwater / seawater selector valve, the seacock and the pump’s power switch are located in the port engine compartment. 2 HULL / DECK 23"},{"d":"UG","p":24,"pdf":26,"sec":"2.8 Deckwash pump (optional extra)","t":"DAVIT SYSTEM DAVIT SYSTEM + TENDER HULL / DECK 24 LAGOON 42"},{"d":"UG","p":25,"pdf":27,"sec":"2.9 Davit system (optional extra)","t":"HULL / DECK n 2.9 Davit system (optional extra) The boat can be fitted with a davit system with manual winch (code 0 or genoa furling winch) as an option. WARNING The davit system is designed to support a maximum load of 250 kg and a tender which is maximum 3,50 metres long. INSTALLING A TENDER ONTO THE DAVIT After having taken away everything from the tender: - Lower the davit system as close as possible to the tender. - Fix the tackle hooks located on the davits to the fore and aft of the tender. - Close the blocker located on the port side of the davit system. - Remount the davit and tender using the electric manoeuvring winch. - Once in the top position, secure the davit system and tender using the appropriate ropes. - Remove the water drain plug from the tender. l LAGOON 42 LAUNCHING A TENDER FROM THE DAVIT Put the water drain plug back into position in the tender. - Check that the jammer located on the davit is locked. - Pass the davit line around the winch (make at least three turns). l After having removed the hold safety devices and moored the tender: - Open the blocker and let the line run until the tender reaches the water. - Cast off the tackle hooks on the davit to the fore and aft of the tender. - Remount and secure the davit system. When sailing, remove the tender engine and store it on board. Moor the tender considering the sea state and the route. Put in the tender the security equipment in conformity with the registration country of the boat. WARNING Nobody should be on board or under the tender during manoeuvres carried out with the davit. Tie up the tender during manoeuvres. 2 HULL / DECK 25"},{"d":"UG","p":26,"pdf":28,"sec":"2.9 Davit system (optional extra)","t":"SOLAR PANELS - RIGID BIMINI RIGID BIMINI + SOLAR PANELS HULL / DECK 26 AUTOMATIC BREAKERS OF THE SOLAR PANELS LAGOON 42 ROOF ACCESS LADDER"},{"d":"UG","p":27,"pdf":29,"sec":"2.10 Solar panels (optional extra)","t":"HULL / DECK n 2.10 Solar panels (optional extra) The boat may be optionally fitted with flexible solar panels on the roof. Should the solar panels fail, check the circuit breaker located in the starboard passageway cupboard. Check battery charge levels on the screen in the chart table. Refer to the manufacturer’s manual for use and maintenance of solar panels. n 2.11 Access to helm station A staircase to port in the cockpit enables access to the helm station. A second set of stairs (optional extra) provides access to the roof. During sailing, watch out for possible movements of the boat when using these staircases. The helm station may be optionally equipped with a rigid protection (bimini) with opening panel and a security door on the port side. RECOMMENDATION Secure the rigging before accessing the mast step or sun bed. LAGOON 42 2 HULL / DECK 27"},{"d":"UG","p":29,"pdf":31,"sec":"2.11 Access to helm station","t":"RIGGING / SAILS 3 3.1 Sailing 3.2 Standing rigging 3.3 Running rigging 3.4 Sails 29"},{"d":"UG","p":30,"pdf":32,"sec":"2.11 Access to helm station","t":"RIGHTING MOMENT Illustration of the difference of the righting moment existing between a 10 m monohull and catamaran. D : 3 meters RIGGING / SAILS CATAMARAN Weight of the boat: 10 tons 30 MONOHULL Weight of the boat: 10 tons D : 0,5 meter LAGOON 42 d: distance between centre of the bottom and centre of gravity. RMmax : Weight of the boat x d (RMmax : moment of maximum uprighting) RMmax monohull : 10 tons x 0,5 meter : 5 tons.meter RMmax catamaran : 10 tons x 3 meters : 30 tons.meters"},{"d":"UG","p":31,"pdf":33,"sec":"3.1 Sailing","t":"RIGGING / SAILS n 3.1 Sailing l BEWARE A catamaran is about 6 times more resistant to heeling than a monohull. In naval architecture, it is referred to as uprighting moment multiplication of the weight of the boat by the transversal distance between the centre of gravity and the centre of flotation (or bottom). See the illustration on the opposite page. Wind force given in apparent wind - From 0 to 16 knots: full sail; sheet traveller 30 cm above the centre line of the boat, mainsail sheeted with a slightly open leech (boom on the centre line of the boat). The jib is fully unwound. TRIMMING WHEN CLOSE HAULED (between 75 and 50° of true wind) l This fact has real consequences as for the sailing and sail trimming of a catamaran. The fact that the boat does not heel may mask overcanvassing, which may be very dangerous for the crew and the boat. Therefore you must permanently keep a close eye on the speed of the true wind, and trim the sail surface according to the latter as a matter of priority. The below-mentioned trims apply in a calm sea. When the sea is brown, you shall reduce earlier by 10% as far as the speed of true wind is concerned. And as a general rule, it is absolutely imperative to permanently try to ease up the boat rather than to stress her. You will always try to have the forward edges of the sails facing the apparent wind, and to have the sail not sheeted home, so that the airflow behind the sail may be laminar, that is to say so that it may go off the aft part of the sail without any disruption. In case you shouldn’t follow the recommendations below, it might be dangerous for the boat and the crew, and, in case of an accident, the manufacturer’s responsibility would not be involved. LAGOON 42 - From 16 to 20 knots: full sail; the sheet traveller goes up 60 cm above the centre line of the boat, mainsail sheeted with a leech a little more open (boom always in line: therefore you must ease off the sheet). The jib is fully unwound. - De 20 à 26 noeuds : 1 ris ; le chariot de GV revient à 30 cm au dessus de l’axe du navire. The jib is fully unwound. - From 26 to 30 knots: 1 reef, 75% of the jib; the sheet traveller goes up 60 cm above the centre line of the boat. - From 30 to 36 knots: 2 reefs, 60% of the jib; the sheet traveller is back 30 cm above the centre line of the boat, the sheet is 50 cm eased off and the boom is leeward. 3 RIGGING / SAILS 31"},{"d":"UG","p":32,"pdf":34,"sec":"3.1 Sailing","t":"SAILS n Sails Fully battened mainsail. ...........................................55 m2 / 592 sq.ft Square top mainsail (optional extra).........................59 m2 / 635 sq.ft Self-tacking jib.........................................................35 m2 / 377 sq.ft Code 0 (optional extra).............................................68 m2 / 732 sq.ft I. .............................................................................15,377 m / 50’5’’ J .............................................................................. 5,95 m / 19’6’’ P.............................................................................15,945 m / 52’4’’ E...............................................................................4,86 m / RIGGING / SAILS 32 LAGOON 42"},{"d":"UG","p":33,"pdf":35,"sec":"3.1 Sailing","t":"RIGGING / SAILS - From 36 to 45 knots: 2 reefs, jib 40%. The sheet traveller is on the centre line of the boat, the sheet is 1 metre eased off and the boom is leeward. The jib sheet is eased off in order to open wide in gusts. - From 33 to 38 knots: 2 reefs, 60% of the jib. The trimmings remain similar. - From 38 to 45 knots: 3 reefs (or mainsail lowered and slightly more genoa), jib 40%. The trimmings remain similar. - From 45 to 55 knots: 3 reefs only (or try sail, or lying to), the traveller is on the centre line of the boat, the sheet is 1 metre eased off and the boom is leeward. The boat would be more at ease scudding in such a weather. - Fom 45 to 55 knots: mainsail lowered, jib 40 to 30% quite hardened in order to avoid flapping. - Over 55 knots: lying to, sea anchor, or preferably scudding. - Over 55 knots: scudding, depending on the sea, you will set mooring ropes from one transom extension to the other one in order to reduce the speed of the boat. l TRIMMING WHEN DOWN WIND (between 75 and 130° of true wind) - From 0 to 23 knots: full sail; the traveller can be set at different places ranging from 1 metre off the centre line of the boat to the end of the track, depending on the angle of the wind, the sheet is eased off so that the boom may be leeward and 50 cm far from the traveller in dead calm then up to 2 metres when the wind strengthens. In all the cases, you will avoid having more than one batten chafing against the upper shroud, in the fairest points of saling. The jib is eased off in order to have its average front edge facing the apparent wind. - From 23 to 28 knots: 1 reef, full jib. The trimmings are similar. - From 28 to 33 knots: 2 reefs, 80% of the jib. The trimmings remain similar. LAGOON 42 These figures are given for reference only and are to be adapted regarding external conditions. l Square top mainsail WARNING A cruising square top mainsail is more powerful than a standard mainsail. Short en the sails earlier, depending on the wind conditions. 3 RIGGING / SAILS 33"},{"d":"UG","p":34,"pdf":36,"sec":"3.1 Sailing","t":"MANOEUVRING PLAN - MAST STEP CIRCUIT 1 2 3 4 56 7 8 9 1 2 RIGGING / SAILS 34 3 4 5 1 - Code 0 halyard (optional extra). 2 - Self-tacking jib sheet. 3 - Topping lift. 4 - Main halyard. 5 - Reef 1. LAGOON 42 6 - Mainsheet. 7 - Reef 3. 8 - Reef 2. 9 - Mainsail traveller. 6 7 8"},{"d":"UG","p":35,"pdf":37,"sec":"3.2 Standing rigging","t":"RIGGING / SAILS n 3.2 Standing rigging The LAGOON 42 has been adjusted by the shipyard and by the mast manufacturer when first masting. The cables stretch a little during the first sailings. Therefore it is advisable to have the mast inspected and adjusted by a specialist. Before you put out to sea, it is essential to make sure that the standing rigging is in good condition: inspect the gooseneck, turnbuckles, and check the condition of the shrouds. RECOMMENDATION Any intervention on the standing rigging comes within a specialist remit. To hoist a crew member up to the top of the mast, use the man hoisting halyard. Belay the crew member with a bowline on the bosun’s chair ring (do not use snap shackle or shackle). WARNING The man hoisting halyard which is the only one to be authorized for this purpose, is only meant to hoist a crew member up to the top of the mast. LAGOON 42 n 3.3 Running rigging Description of the ropes length (m) diametre (mm) Jib halyard 41 12 Jib sheet 38 10 Mainsail halyard 57 12 Mainsail topping lift 40 10 Mainsheet 34 14 Mainsail traveller adjustment 19 x 2 10 RIGGING / SAILS Reef 1 19 12 35 Reef 2 32 12 Reef 3 46 12 Boom loop 0,6 10 Code 0 sheet (optional extra) 34 10 Code 0 halyard (optional extra) 65 10 The mainsail and jib sheets, the topping lift, the reefing lines, the mainsail and code 0 halyards, the control lines for the main traveller are led back to the manoeuvre station. 3"},{"d":"UG","p":36,"pdf":38,"sec":"3.3 Running rigging","t":"RUNNING RIGGING - MAINSAIL CIRCUIT 1 2 RIGGING / SAILS 36 3 1 - Mainsail traveller adjustment / starboard. 2 - Mainsail sheet. 3 - Mainsail traveller adjustment / port side. LAGOON 42"},{"d":"UG","p":37,"pdf":39,"sec":"3.4 Sails","t":"RIGGING / SAILS SHEET WINCHES AND MANOEUVRE WINCHES (MANUAL OR ELECTRIC) (OPTIONAL EXTRA) l n 3.4 Sails STANDARD MAINSAIL To hoist the standard mainsail: - Point your boat into wind with engine in gear. - Make sure that the mainsheet is eased off and the reefs are free. - Open the jammer. - Hoist the sail being careful for the battens not to get jammed in the lazy-jacks. - Make fast the halyard with the jammer. - Trim the mainsail according to the wind and sea conditions. l The circuit breakers for the electric winches are located in the starboard passageway cupboard. RECOMMENDATION Have at least 3 turns on the winch. Electrical winches generate an extremely powerful force and you should use them with much care. Never force when you find a jamming point. When using the winches, keep your hands away. After use, shut the switch covers. WARNING Refer to the manufacturer’s instructions to remove the winches and put them back. Improper refitting may result in accidents (for example: kick of the crank handle). To lower the standard mainsail: - Haul up. - Tighten the topping lift. - Slacken off the halyard, lower the mainsail then furl it. - Tighten the sheet. SHORTENING THE SAILS Automatic reefing system: - Move into the wind. - Release the tension on the downhaul. - Ease off the mainsail a bit. - Ease off the mainsail halyard. - Take up the reef tack line. - Tension the mainsail halyard. - Set the mainsail. - Tension the downhaul if necessary. l During automatic reefing, the mainsail halyard must not be dropped too far (risk of incorrect pulley positioning). LAGOON 42 3 RIGGING / SAILS 37"},{"d":"UG","p":38,"pdf":40,"sec":"3.4 Sails","t":"CRUISING SQUARE TOP MAINSAIL FASTENING OF THE RUISING SQUARE TOP MAINSAIL A 2 1 3 RIGGING / SAILS B 38 1 - Headboard traveller. 2 - Halyard block (to be fastened onto the headboard eye). 3 - Cruising square top mainsail. LAGOON 42"},{"d":"UG","p":39,"pdf":41,"sec":"3.4 Sails","t":"RIGGING / SAILS CRUISING SQUARE TOP MAINSAIL (OPTIONAL EXTRA) The cruising square top mainsail halyard is lashed on the eyelet of the sail, not on the headboard traveller. The square top will be properly set automatically once the sail is hoisted up. l FITTING OF THE MAINSAIL CRUISING SQUARE TOP SYSTEM Refer to the drawing on the opposite page. - Remove the pin of the headboard car (mark A). - Make the 2 strand tackle as per the drawing on the opposite page. - Put back the headboard car pin (mark A), adding the sheave. The length of the headboard line is adjusted to the right dimension for a new sail at the sailmaker’s. The lashing (mark B) makes possible to make up for the possible lengthening of the rope due to ageing. Nota: this system is patented by the INCIDENCES sailmaker. WARNING A cruising square top mainsail has a more important power than a standard mainsail. Shorten the sail earlier depending on the wind conditions. LAGOON 42 ROLLER FURLING JIB Hoist the jib before you get under way, taking advantage of a windless period of time. - Secure the head. - Secure the halyard to the slide-swivel. - Secure the tack to the drum and secure the sheets. - Insert carefully the bolt rope into the hole, hoist the jib and take care you do not tear it. - Haul the halyard taut enough but sway it up less than a sail on a standard stay. - Hoist it until the horizontal creases disappear (the tension of the luff shall be adjusted after a few sea trips). - Pull on the line from the cockpit to furl the jib. l RECOMMENDATION Hand pre roll the drum to set the genoa furling line on it. Pay attention to the drum furling direction: the sacrificial strip of the jib shall be wrapped outside. Never force when you furl or unfurl the head sails in case it seizes. Make sure a halyard is not caught in the roller furler. 3 RIGGING / SAILS 39"},{"d":"UG","p":40,"pdf":42,"sec":"3.4 Sails","t":"RUNNING RIGGING - CODE 0 3 RIGGING / SAILS 40 1 2 2 1 1 1 - Code 0 port sheet. 2 - Code 0 starboard sheet. 3 - Code 0 halyard. LAGOON 42"},{"d":"UG","p":41,"pdf":43,"sec":"3.4 Sails","t":"RIGGING / SAILS CODE 0 (optional extra) It is possible to remove the front guard lines when using the code 0. Before getting under the way, take advantage of a windless period of time and hoist the code 0. l - Secure the swivel to the code 0 headboard. - Secure the furling system to the tack clew. - Put the furling system to the boomsprit with a snap shackle. - Secure the halyard to the headboard swivel. - Hoist the code 0. Use the furling system line to furl or unfurl the code 0. Code 0 sheets: - Secure the sheets to the code 0 clew. - Have the sheets go on the outside of the stay and shrouds and above the guardrails. - Make fast the sheet leading blocks to the chainplates. - Sheet the sails to the outer winches. WARNING In some sailing trims, the code 0 may hide the fore navigation lights. WARNING Unrig the code 0 when not in use (risk of being UV damaged and inadvertently unfurled). LAGOON 42 3 RIGGING / SAILS 41"},{"d":"UG","p":43,"pdf":45,"sec":"3.4 Sails","t":"ACCOMMODATIONS 4 4.1 Saloon - Galley 4.2 Lighting 4.3 Portholes - Deck hatches 4.4 Window blinds 43"},{"d":"UG","p":44,"pdf":46,"sec":"3.4 Sails","t":"DRAWERS - REMOVABLE SEAT SUCTION PADS FOR THE FLOORBOARDS KITCHEN DRAWER ACCOMMODATIONS 44 REMOVABLE SALOON SEAT LAGOON 42"},{"d":"UG","p":45,"pdf":47,"sec":"4.1 Saloon - Galley","t":"ACCOMMODATIONS n 4.1 Saloon - Galley n 4.2 Lighting FLOORBOARDS The floorboards can be lifted up to have access to the different technical components on board. There are many ways of lighting the saloon, directly or indirectly, depending on the atmosphere you want to create. l RECOMMENDATION To avoid premature ageing of the floorboards (dents, scratches) it is recommended to keep them as clean as possible and to remove shoes inside the boat. REMOVABLE SEAT (OPTIONAL EXTRA) The seat facing the table is mounted on a pantograph and can be moved to provide more deck space in the saloon. l DRAWERS The drawers in the galley have an automatic closing function. Gently push the drawer till the movement ends itself. These drawers can be removed pushing on the levers on each side, under the rails. When you reassemble it, clip the drawer before you push it back. l LAGOON 42 After having turned on the 12 V circuit on board and the lighting circuit using the switch located on the electrical panel in the starboard hull companionway, you can turn the light on. 4 ACCOMMODATIONS 45"},{"d":"UG","p":46,"pdf":48,"sec":"4.2 Lighting","t":"PORTHOLES - HATCHES - WINDOWS PORTHOLE + CURTAIN BLIND AND MOSQUITO SCREEN ON DECK HATCH CABIN CURTAIN SALOON SLIDING DOOR CURTAIN ACCOMMODATIONS 46 LAGOON 42"},{"d":"UG","p":47,"pdf":49,"sec":"4.3 Portholes - Deck hatches","t":"ACCOMMODATIONS n 4.3 Portholes - Deck hatches The portholes and deck hatches have locking systems to keep them in a closed position. At anchor, intermediate opening position allows the ventilation of the boat. The deck hatches are fitted with a blind and mosquito screen system that can be used even when the hatch is open. Their handling shall be done carefully. n 4.4 Window blinds All the windows have blinds. The opening hatches of the aft cabins are also fitted with blinds. RECOMMENDATION Pull and push the blinds carefully. Take care to fasten them when they are fitted with the relevant systems. LAGOON 42 4 ACCOMMODATIONS 47"},{"d":"UG","p":49,"pdf":51,"sec":"4.4 Window blinds","t":"ON BOARD UTILITY 5 5.1 Refrigerators - Freezer - Icemaker 5.2 Microwave oven 5.3 Oven, hotplate 5.4 Washing machine 5.5 Television 5.6 Air conditioning 5.7 Heating 49"},{"d":"UG","p":50,"pdf":52,"sec":"4.4 Window blinds","t":"REFRIGERATORS - FREEZER - ICEMAKER - MICROWAVE OVEN FREEZER (OPTIONAL EXTRA) REFRIGERATOR GALLEY 1 2 3 UTILITY ABOARD 50 4 5 COCKPIT ICEMAKER (OPTIONAL EXTRA) 1 - 110 V - 220 V selection panel. 2 - Freezer (optional extra). 3 - Refrigerator. 4 - Microwave oven (optional extra). 5 - Refrigerator / icemaker - cockpit (optional extra). Nota: the same layout can be observed in the other version. LAGOON 42"},{"d":"UG","p":51,"pdf":53,"sec":"5.1 Refrigerators - Freezer - Icemaker","t":"UTILITY ABOARD n 5.1 Refrigerators - Freezer - Icemaker The boat standard features include a 137 l refrigerator located in the galley. It may optionally be fitted with a freezer (100 l) located in the cupboard in the saloon port entrance. The boat may also be fitted with an optional refrigerator (65 l) or an icemaker located in the cockpit. Once the general 12 V on board circuit has been powered, turn on the elements using the refrigerated unit switch located on the electrical panel in the starboard hull companionway. RECOMMENDATION Defrost then drain the refrigerators, freezer and icemaker before you stop the domestic 12 V circuit. n 5.2 Microwave oven (optional extra) The boat is fitted with an optional microwave oven on a tabletop located on the kitchen cabinet. l - Check the microwave plugging. - Check that the sockets switch has been powered on the electrical panel. - Check that the automatic breaker located in the starboard passageway cupboard. POWER SUPPLY Select the power supply source (generator or supply shore socket) using the right hand selector on the 110 V - 220 V selector board (in the starboard hull companionway). POWER SUPPLY Select the power supply source (generator or supply shore socket) using the right hand selector on the 110 V - 220 V selector board (in the starboard hull companionway). For the use and maintenance of the microwave oven, please refer to its instruction guide. ICEMAKER USE The icemaker requires 220 V. It is supplied with water through the fresh water circuit. Nota: the icemaker circuit is fitted with a filter. Have this filter changed regularly. For the use and maintenance of the refrigerators, freezer and icemaker, please refer to their instruction guides. LAGOON 42 5 UTILITY ABOARD 51"},{"d":"UG","p":52,"pdf":54,"sec":"5.2 Microwave oven (optional extra)","t":"OVEN - HOTPLATES - WASHING MACHINE GAS VALVES WASHING MACHINE 1 2 3 UTILITY ABOARD 4 52 5 6 7 Nota: the same layout can be observed in the other version. LAGOON 42 WATER SUPPLY VALVE (US VERSION) + OUTLET VALVE OF THE WASHING MACHINE 1 - Washing machine (option for 3-cabin version). 2 - 110 V - 220 V selection panel. 3 - Circuit breakers panel. 4 - Outlet valve + supply valve of the washing machine. 5 - Hotplates. 6 - Gas valves. 7 - Oven."},{"d":"UG","p":53,"pdf":55,"sec":"5.3 Oven, hotplate","t":"UTILITY ABOARD n 5.3 Oven, hotplate The boat is standard fitted with a gas cooking hob. The gas valves are located in the cupboard at the left of the oven. The gas cartridges are located in the starboard side cockpit locker. RECOMMENDATION Shut the gas valves and the regulator tap when you do not use the hob. POWER SUPPLY Select the power supply source (generator or supply shore socket) using the right hand selector on the 110 V - 220 V selector board (in the starboard hull companionway). RECOMMENDATION The washing machine shall not work while you are sailing. For the use and maintenance of the washing machine, please refer to its instruction guide. 5 UTILITY ABOARD n 5.4 Washing machine (optional extra) The 3-cabin boat is fitted with an optional washing machine located inside a cabinet in the front starboard passageway. It is supplied with water coming from the fresh water system. Check the opening of its freshwater feed valve (valves in the US model) located in the central starboard passageway cupboard. Water is drained via the valve located in this same cupboard. - Check that the automatic breaker located in the starboard passageway cupboard. LAGOON 42 53"},{"d":"UG","p":54,"pdf":56,"sec":"5.4 Washing machine (optional extra)","t":"TELEVISION - AIR CONDITIONING SALOON TELEVISION 1 2 3 4 1 1 3 4 6 1 7 8 4 2 3 UTILITY ABOARD 54 AIR CONDITIONING UNIT 5 2 3 4 1 1 1 - Air conditioning unit. 2 - Air conditioning control. 3 - Drain + condensation valves. 4 - Sea water supply valve + sea water pump / Air conditioning. 5 - Television. 6 - Selection panel / Air conditioning. Nota: the same layout can be observed in the other version. 7 - Air conditioning units automatic breakers. 8 - 12 V / 110 V - 220 V Inverter. LAGOON 42 AIR CONDITIONING UNITS AUTOMATIC BREAKERS"},{"d":"UG","p":55,"pdf":57,"sec":"5.5 Television (optional extra)","t":"UTILITY ABOARD n 5.5 Television (optional extra) n 5.6 Air conditioning (optional extra) The saloon is optionally equipped with a television and CD / DVD player that may be used after turning on the 12 V domestic circuit. The boat may be fitted with an optional reversible air conditioning system. The air conditioning units are located in the cabins and in the saloon. You will find vents in every cabin and in the saloon. The television is powered by the 12 V / 110 V - 220 V converter. An antenna amplifier is located at the level of the pillar in the saloon. For the use and maintenance of the television, please refer to its instruction guide. Before you start the system: Open the circulating seawater systems (suction valves located under the floors of the passageways, drain and condensation valves in the cabins). POWER SUPPLY Select the power supply source (generator or supply shore socket) using the left hand 110 V - 220 V selector board (in the starboard hull companionway). Check that the pumps and air conditioning units are turned on using the circuit breakers located in the locker in the starboard passageway cupboard. Start the air conditioning unit in the desired area, select hot or cold and set the temperature using its control. Regularly clean the filters on the conditioned-air systems and sea water suction valves. For the drainage, use and maintenance of the air conditioning system, please refer to its instruction guide. LAGOON 42 5 UTILITY ABOARD 55"},{"d":"UG","p":56,"pdf":58,"sec":"5.6 Air conditioning (optional extra)","t":"HEATING THERMOSTAT + VENTILATION SWITCH + HEAT CONTROL / TIMER 5 UTILITY ABOARD 56 1 - Fuel tanks. 2 - Water system valves. 3 - Boiler. 4 - Boiler exhaust outlet. 5 - Control + ventilation switch. 1 2 3 BOILER + VALVES 4 Nota: the same layout can be observed in the other version. LAGOON 42 HEATING SYSTEM VALVES"},{"d":"UG","p":57,"pdf":59,"sec":"5.7 Heating (optional extra)","t":"UTILITY ABOARD n 5.7 Heating (optional extra) The boat may optionally be fitted with a diesel heating system with circulating water. The boiler is located in the port engine compartment. - Check that the water system valves are open (access through the port engine compartment). - Turn on the boiler using the control / timer located at the chart table. - Adjust the temperature using the cabin and saloon thermostats. - Adjust the speed of the ventilator using the 2-speed switches. For the use and maintenance of the heating system, please refer to its instruction guide. WARNING Do not place fenders near emergency exits of the heat system boiler. LAGOON 42 5 UTILITY ABOARD 57"},{"d":"UG","p":59,"pdf":61,"sec":"5.7 Heating (optional extra)","t":"WATER SYSTEMS 6 6.1 Bilge pump system 6.2 Grey waters 6.3 Black waters 6.4 Fresh water 6.5 Watermaker 59"},{"d":"UG","p":60,"pdf":62,"sec":"5.7 Heating (optional extra)","t":"BILGE PUMP SYSTEM - GREY WATERS 1 1 2 3 WATER SYSTEMS 60 4 5 3 1 - Shower pump switches. 2 - Shower drain pumps. 3 - Front / aft compartment outlet valve. 4 - Hull sump. 5 - Electric bilge pumps. 6 - Manual bilge pumps. 2 3 3 Each hull has the same components. Nota: each valve in the boat is identified. 6 6 Nota: the same layout can be observed in the other version. LAGOON 42 SEA-COCK OPEN SEA-COCK CLOSED 5"},{"d":"UG","p":61,"pdf":63,"sec":"6.1 Bilge pump system","t":"WATER SYSTEMS n 6.1 Bilge pump system A main sump is under the floorboard of each hull. The fore and aft compartments are linked to these sumps by a bilge pipe and a valve (access under the floorboards). Each well is emptied by two bilge pumps: - A manual cockpit pump. - An electric pump with manual and automatic release (electrical panel switch) located in the well. RECOMMENDATION Regularly check the valves and sea-cocks for proper operation and watertightness. Regularly make sure the filters and strainers on the draining system are clean. WARNING The bilge pump system is not designed to provide buoyancy to the boat in case of damage. The bilge pump system is designed to drive out the water being either sea spray or leaks but absolutely not the water coming through a hole in the hull, this hole being the result of a damage. LAGOON 42 RECOMMENDATION Always keep the bilge pumps switched on the automatic mode with alarm. We advise you to test the bilge pumps every time you put out to sea. n 6.2 Grey waters The grey waters (sink, washbasins) directly flow out via sea-cocks with valves. Please note: a valve is closed when its handle is perpendicular to the hose and it is open when its handle is in line with the hose. Grey waters coming from the showers are emptied through pumps located in the port and starboard bathroom cabinets. The pumps are switched on from the 12 V domestic circuit. In order to empty the showers, use the pump switch located on the wet room cupboard. RECOMMENDATION When mooring in a harbour, if possible, use the sanitary facilities provided by the port authority. In some harbours or countries, wastewater disposal is forbidden. You will then have to use the waste tank. 6 WATER SYSTEMS 61"},{"d":"UG","p":62,"pdf":64,"sec":"6.2 Grey waters","t":"BLACK WATERS WATER SYSTEMS 62 1 2 1 2 3 3 3 1 4 1 - Holding tank. 2 - Drain bung hole on deck. 3 - Drain valve on hull. 4 - Switch of the electric toilets. Nota: the holding tanks are located behind showers in the other version. LAGOON 42"},{"d":"UG","p":63,"pdf":65,"sec":"6.3 Black waters","t":"WATER SYSTEMS n 6.3 Black waters The boat is fitted with manual toilets and holding tanks in all the washrooms. She may be fitted with optional electric toilets. USE OF THE MANUAL TOILETS - Open the water inlet and drain valves. To empty the bowl: - Set the control lever of the pump slantwise (FLUSH) and operate the pump. To dry the bowl: - Set the lever back vertical (DRY) and operate the pump. l In order to avoid clogging the toilets, use absorbent paper only and pump until the emptying hose is completly empty. Regularly rinse the toilets with fresh water. Close the valves after each use. USE OF THE ELECTRIC TOILETS The electric toilets are rinsed with sea water. Electrical pumps, filters, and supply valves are located in different wet rooms under the washbasin. - Switch on the 12 V domestic circuit. - Open the water inlet and drain valves. l LAGOON 42 One of the switches next to the toilets makes possible a water intake cycle and a water outlet cycle. The second switch makes possible to carry out a rinse cycle. Rinse the toilets with fresh water and regularly clean the filters. Close the valves after each use. For the use and maintenance of the electric toilets, please refer to their instruction guide. USE OF THE HOLDING TANKS Tanks can be reached through the wet rooms. Make sure the drain valve of the tank is closed in order to avoid any inadvertent discharge (the valve is closed when the handle is perpendicular to the hose). Tank drainage: - In an authorized area, open the drain valve. - In a marina equipped with an organic waste suction system, fit the suction hose into the tank through the deck filler. - Start the pump of the suction system. l Regularly rinse the holding tank. The tanks shall be emptied when the boat is berthed in negative temperatures. WARNING Use the suction systems in marinas to empty your holding tank. In order to respect environment, do not discharge your holding tanks near the shore. 6 WATER SYSTEMS 63"},{"d":"UG","p":64,"pdf":66,"sec":"6.3 Black waters","t":"FRESH WATER 1 2 2 WATER SYSTEMS 1 - Starboard tank (optional extra) / 64 port tank (standard). 1 3 - Pressure water pump. 4 - Shore fresh water supply. 2 - Deck filler. 3 3 4 Nota: the same layout can be observed in the other version. LAGOON 42 4 1"},{"d":"UG","p":65,"pdf":67,"sec":"6.4 Fresh water","t":"WATER SYSTEMS n 6.4 Fresh water FRESH WATER TANKS The boat is standardly equipped with a 300-litre tank located in the fore peak port locker. The boat may optionally be equipped with a second 300-litre tank. l To prevent any handling mistake, never fill the water and fuel tanks at the same time. A front filler is provided to fill the tank. During filling, avoid handling contaminants near the fillers. Open and close the filler caps with the right key. Check the filler cap seal for condition during filling. Never insert the water filling hose deep down into the system in order to prevent any over-pressure in the systems. RECOMMENDATION Pay attention to the quality of the water for the filling up. Check if it is drinking water. If the boat is not used for long, purify the tanks and pipes with proper treatment. Please note: the capacity of the fresh water tank(s) indicated on the page ‘SPECIFICATIONS’ may be not completely usable depending on the trim and load of the boat. LAGOON 42 PRESSURE WATER PUMP The pressure water pump is located in the port engine compartment. Its starting is done by using a switch on the electrical panel. l RECOMMENDATION Never operate the water system equipment when the valves are closed or when the tanks are empty (the electrical equipment may be damaged). Check the different water filters for condition. WATER GAUGE Watch the water level in the tank(s) using the gauge located on the electrical panel in the companionway. l SHORE FRESH WATER SUPPLY (OPTIONAL EXTRA) The shore fresh water supply is located on the port fore peak. To use the marina fresh water: - Connect the shore supply. - Set the pressure water pump switch to ‘OFF’. l RECOMMENDATION When you leave the boat unattended, systematically disconnect the shore fresh water supply. 6 WATER SYSTEMS 65"},{"d":"UG","p":66,"pdf":68,"sec":"6.4 Fresh water","t":"FOOT PUMP - WATER HEATER 1 WATER SYSTEMS 1 66 2 3 2 1 - Foot pump. 2 - Valve to select fresh water / sea water. 3 - Sea water supply valve. 4 - Water heater. 5 - Shower. 4 4 5 Nota: the same layout can be observed in the other version. LAGOON 42 5"},{"d":"UG","p":67,"pdf":69,"sec":"6.4 Fresh water","t":"WATER SYSTEMS FRESH WATER / SEA WATER FOOT PUMP The foot pump makes possible to supply a tap of the sink with fresh water and sea water. The 3-way fresh / sea water valve can be reached through the sink unit. l In case of foot pump hardening, check if the water supply hose is not blocked, or if the tap is not choked. In the latter case, remove the tap end and clean it. WATER HEATER The water heater is located in the aft port cabin. It has a capacity of 40 litres. l The water heater functions automatically when the engine is on or when set on the 110 V - 220 V circuit (generator or shore supply socket) after having activated its circuit breaker on the electrical panel in the companionway. The hot water temperature is pre-set using the thermostatic tap located on the water heater. EXTERIOR SHOWER A shower supplied with hot and cold water (mixing faucet) is located on the starboard side of the transom. l It is supplied by the pressure water pump. WARNING In period of frost, do not forget to empty the cockpit shower, even if there is someone onboard the boat. LAGOON 42 RECOMMENDATION When the water heater is not used, switch it off using its 110 V - 220 V circuit. Before you switch it on using the 110 V - 220 V circuit, check the water heater is full of water. 6 WATER SYSTEMS 67"},{"d":"UG","p":68,"pdf":70,"sec":"6.4 Fresh water","t":"WATERMAKER 7 1 2 WATER SYSTEMS 68 3 4 5 6 7 Nota: the same layout can be observed in the other version. LAGOON 42 1 1 - Control. 2 - Automatic breaker. 3 - Filters + rinsing valve. 4 - Drain valve. 5 - Sea water supply valve. 6 - Membranes. 7 - Watermaker. 3 5 3 1 - Watermaker + pump. 2 - Filters + rinsing valve. 3 - Sea water supply valve. 4 - Drain valve. 5 - Control. 6 - Automatic breaker. 6 2"},{"d":"UG","p":69,"pdf":71,"sec":"6.5 Watermaker","t":"WATER SYSTEMS n 6.5 Watermaker (optional extra) The boat may optionally be fitted with a water maker (63 l / hour) located in the port engine compartment. OPERATION The watermaker works either in 12 V. Check that the relevant circuit breaker located in the starboard passageway cupboard. Check the openings of the seacock and the drain valve (accessed via the port engine compartment). Start the water maker using its control located under the chart table. Check the level of fresh water in the tank when the watermaker is working. Regularly clean the filters located in the port engine compartment. For the use and maintenance of the water maker, refer to the instruction guide. RECOMMENDATION The watermaker shall exclusively be used in clear waters and preferably at anchor. LAGOON 42 6 WATER SYSTEMS 69"},{"d":"UG","p":71,"pdf":73,"sec":"6.5 Watermaker (optional extra)","t":"ELECTRICITY 7 7.1 12 V Circuit 7.2 Inverter 7.3 110 V - 220 V Circuit 7.4 Electronics 71"},{"d":"UG","p":72,"pdf":74,"sec":"6.5 Watermaker (optional extra)","t":"12 V ELECTRICAL PANEL - BATTERY CHARGERS - INVERTER 4 1 3 5 6 7 5 6 7 ELECTRICITY 8 72 1 - Port engine battery and coupling cut-outs. 2 - Engine battery. 3 - Load balancer. 4 - Generator battery. 5 - Electrical panel. 9 10 9 2 11 1 2 3 Nota: the same layout can be observed in the other version. LAGOON 42 8 10 6 - Switch of the inverter + voltmeter. 7 - Automatic breaker of the inverter. 8 - 12 V / 110 V - 220 V inverter. 9 - On board batteries. 10 - Battery chargers. 11 - On board and starboard engine cut-outs. 10 11"},{"d":"UG","p":73,"pdf":75,"sec":"7.1 12 V Circuit · 7.2 Inverter","t":"ELECTRICITY n 7.1 12 V Circuit Check battery charge levels on the screen in the chart table. The main domestic circuit is supplied in 12 V. SUPPLY OF THE CHARGERS Select the power supply source (generator or supply shore socket) using the right hand selector on the 110 V - 220 V selector board (in the starboard hull companionway). The auxiliary batteries (on-board) and the starboard engine battery are located in the starboard engine compartment. The port engine battery is located in the port engine compartment. The generator battery (optional) is located in the starboard locker of the forward swim deck. The 12 V consuming appliances circuit breakers are located in a cupboard under the chart table. They can be wound by pressing a black lug. The starboard engine and auxiliary cut-outs (on-board) are located in the starboard engine compartment. For safety reasons, a coupling system for the engine batteries allows the engine to start if the relevant battery is faulty. The port engine and coupling cut-outs are located in the port engine compartment. The generator includes its own cut outs located in the starboard locker of the forward swim deck. The batteries can be charged either by the engine alternator or by the 110 V - 220 V / 12 V - 40 A battery charger. According to the lay out, the boat may optionally be fitted with an extra 110 V - 220 V / 12 V - 40 A charger. The battery chargers are located in the starboard engine compartment. LAGOON 42 n 7.2 Inverter The boat is optionally equipped with a 12 V / 110 V - 220 V / 2000 Va inverter located in the starboard passageway cupboard. The inverter supplies the galley sockets with 110 V - 220 V. The power switch of the inverter and its voltmeter are located in the starboard hull companionway. Check that the switch on the inverter is in REMOTE position in order for the main switch to be turned on. RECOMMENDATION Check the battery charge during the use of the inverter. 7 ELECTRICITY 73"},{"d":"UG","p":74,"pdf":76,"sec":"7.2 Inverter","t":"SHORE POWER SOCKETS - GENERATOR AUTOMATIC BREAKER OF A SHORE POWER SOCKET GENERATOR START-UP CONTROL GENERATOR TANK / GENERATOR SELECTION PULL ROD AUTOMATIC BREAKERS OF THE GENERATOR WATER FILTER + FUEL FILTER BATTERY + CHARGER ELECTRICITY 74 LAGOON 42"},{"d":"UG","p":75,"pdf":77,"sec":"7.3 110 V - 220 V circuit","t":"ELECTRICITY n 7.3 110 V - 220 V circuit SHORE POWER SOCKETS (optional extra) Both shore supply sockets (220 V) are located in the port transom. They supply the 220 V circuit and the battery chargers, as well as the air conditioning units (a single 110 V socket). l Before you plug in or unplug the boat / shore power supply cable, switch off the shut off device connected to the shore supply. Connect the boat / shore power supply cable in the boat before connecting it to the shore supply socket. Unplug the boat / shore supply cable on shore first. Close the protecting cover of the shore supply socket when you do not use the plug. The shore power sockets are protected by circuit breakers located in the port engine compartment. WARNING Before using the shore power socket, imperatively check the shore power is 32 Ah. DANGER Never let the end of the boat / shore supply cable hang in the water; the result may be an electric field liable to hurt or kill the swimmers nearby. LAGOON 42 GENERATOR The generator (optional extra) is located in the starboard locker of the forward swim deck. Its function is to re-supply the batteries via the chargers and supply 110 V - 220 V electricity on board. l OPERATION After turning ON the cut outs located in the starboard locker of the forward swim deck, the generator is powered up either on the generator or via its control in the starboard hull companionway. - Make sure that the seawater cooling valve (accessed under the floor of the front starboard passageway) and separator drain valve (accessed in the wardrobe door of the front starboard cabin) are open. - Select the fuel tank using the pull rod located on the side of the rear starboard berth. For the use and maintenance of the generator, please refer to its instruction guide. 7 ELECTRICITY 75"},{"d":"UG","p":76,"pdf":78,"sec":"7.3 110 V - 220 V circuit","t":"ELECTRICAL PANELS - SELECTORS - AUTOMATIC BREAKERS ELECTRICAL PANEL CONSUMING APPLIANCES CIRCUIT BREAKERS 110 V - 220 V SUPPLY SELECTION PANELS AUXILIARY BATTERIES CHARGE STATUS CHECK SCREEN ELECTRICITY 76 LAGOON 42"},{"d":"UG","p":77,"pdf":79,"sec":"7.3 110 V - 220 V circuit","t":"ELECTRICITY CHECKING OF THE 110 V - 220 V CONSUMING APPLIANCES SELECTION PANEL (in the starboard hull companionway): The panel is composed of selectors allowing to choose the electrical power source for the different 110 V - 220 V consuming appliances on board. l RIGHT-HAND SIDE SELECTOR: - allows to use the appliances requiring a 110 V - 220 V current coming from the generator, the shore power or the inverter. LEFT-HAND SIDE SELECTOR: - allows to use the air conditioning powered by a 110 V - 220 V current coming from the generator or from the shore power. RECOMMENDATION Keep an eye on the charge of the batteries when you use the inverter. USE OF THE 110 V - 220 V POWERED APPLIANCES SWITCHING ON THE APPLIANCES In order to be able to use the 110 V - 220 V powered appliances (washing machine, watermaker, etc), it is advisable: - Make sure that the circuit breakers are switched OFF on the 110 V - 220 V circuit breaker panel. - Switch on the 110 V - 220 V source (start the generator or connect a shore power socket to shore). - Select this source on the selection panel so that this source supplies the boat (110 V - 220 V electrical selection panel) or turn on the inverter for the outlets. l LAGOON 42 - Turn on the circuit breakers for the units to be used by using the circuit breaker panel. Then start the appliance with its own controls. To start 110 V - 220 V elements, wait for 10 to 15 seconds between the start up of each new component (in order to allow the generator to become stabilized and be able to give the power necessary for the starting up). STOPPING THE 110 V - 220 V POWERED APPLIANCES To stop the 110 V - 220 V powered appliances (washing machine, etc.) it is advisable to do as follows: - Stop the appliance with its own controls. To stop 110 V - 220 V elements, wait for 10 to 15 seconds between the stop of each new component (in order to allow the generator to become stabilized). - Turn off the unit circuit breakers by using circuit breaker panel. - Turn to OFF the 110 V - 220 V source selector (generator or shore power) or turn off the inverter. WARNING Before you turn the 110 V - 220 V source selector to OFF, make sure no other appliance is working (danger of an electric arc that would destroy the changeover switch and risk of damaging the generator). 7 ELECTRICITY 77"},{"d":"UG","p":78,"pdf":80,"sec":"7.3 110 V - 220 V circuit","t":"ELECTRONICS ELECTRONIC BOXES ELECTRICITY 78 ELECTRONIC COMPASS LAGOON 42 AUTOMATIC PILOT COMPASS + ANGLE INDICATOR LOG + DEPTH SOUNDER SENSOR"},{"d":"UG","p":79,"pdf":81,"sec":"7.4 Electronics","t":"ELECTRICITY n 7.4 Electronics The boat may be fitted with an optional electronic pack and different navigation aid accessories. For the use and maintenance of all these components, please refer to their instruction guides. The ram, the auto pilot and the calculator are located in the starboard engine compartment. The auto pilot fuse is located under the chart table. The sounder and depth finder under the forward floorboards of the starboard passageway. 7 ELECTRICITY 79 LAGOON 42"},{"d":"UG","p":80,"pdf":82,"sec":"7.4 Electronics","t":"ELECTRIC LAYOUT 1 - Port engine battery and coupling cut-outs. 2 - Engine battery. 4 5 6 7 8 9 10 11 ELECTRICITY 12 80 3 - Load balancer. 4 - Generator cut outs. 5 - Generator water filter. 6 - Generator fuel filter. 7 - Generator. 8 - Generator battery. 9 - Electrical panel. 10 - Switch of the inverter + voltmeter. 11 - Inverter automatic breaker. 12 - 12 V / 110 V - 220 V inverter. 1 2 3 Nota: the same layout can be observed in the other version. LAGOON 42 13 13 - Domestic batteries. 14 13 2 15 14 - Batteries chargers. 15 - On board and starboard engine cut-outs."},{"d":"UG","p":81,"pdf":83,"sec":"Recapitulation of the 12 V components","t":"RECAPITULATION OF THE 12 V COMPONENTS CHARGE AND ELECTRICAL CONVERSION 1 x 220 V / 12 V - 40 A charger 1 x 220 V / 12 V - 40 A charger (optional extra) 2 x 12 V - 125 A alternators Engines + board Engines + board Recharge service bank, batterie engines, generator BATTERIES / CONSUMING APPLIANCES 12 V CURRENT Service batteries VOLTAGE 12 V - 140 Ah (standard) START (+ Protection) Navigation electronics Lighting Navigation lights Refrigerators, freezer Electric toilets Deckwash pump Bilge pumps Winches Windlass 12 V 12 V 12 V 12 V 12 V 12 V 12 V 12 V 12 V 12 V electrical panel 12 V electrical panel 12 V electrical panel 12 V electrical panel 12 V electrical panel 12 V electrical panel 12 V electrical panel 12 V board 12 V board Starboard passageway cupboard Starboard passageway cupboard VHF Hifi Autoradio 12 V sockets 12 V 12 V 12 V 12 V 12 V board 12 V board 12 V board 12 V board 12 V terminal bloc 12 V terminal bloc 12 V terminal bloc 12 V terminal bloc Engine battery (x2) Generator battery Domestic batteries LAGOON 42 12 V - 110 Ah 12 V - 110 Ah 12 V - 140 Ah Protection 7 ELECTRICITY 81"},{"d":"UG","p":82,"pdf":84,"sec":"7.4 Electronics","t":"RECAPITULATION 110 V - 220 V COMPONENTS GENERATOR Force 13,5 Kva in 220 V Force 13,5 Kva in 110 V 100% of its charge in 220 V - 50 Hz 100% of its charge in 110 V - 60 Hz SHORE POWER SOCKETS ELECTRICITY Shore power socket Board 220 V - 50 Hz Shore power socket Air conditioning 220 V - 50 Hz 32 A simple shore power socket 32 A simple shore power socket Port transom connection Port transom connection US VERSION Shore power socket Board 110 V - 60 Hz Shore power socket Air conditioning 110 V - 60 Hz 32 A simple shore power socket (single phase) 50 A simple shore power socket (two-phase) Port transom connection Port transom connection 82 ELECTRIC DISTRIBUTION Left selector Right selector Air conditioning supplied by generator or shore power Board supplied by generator or shore power (or 12 V / 220 V - 2000 Va inverter) CHARGE 1 x 220 V / 12 V - 40 A charger 1 x 220 V / 12 V - 40 A charger optional extra LAGOON 42 Recharge of the service bank by generator or shore power Engine batteries charger supplied by the generator or the shore"},{"d":"UG","p":83,"pdf":85,"sec":"7.4 Electronics","t":"RECAPITULATION 110 V - 220 V COMPONENTS CONSUMING APPLIANCES VOLTAGE ELECTRICAL PANEL Television Outlets 220 V 220 V its own inverter Inverter or 220 V panel Water heater Washing machine Icemaker Watermaker 220 V 220 V or 110 V 220 V or 110 V 220 V or 110 V 220 V panel 220 V panel 220 V panel 220 V panel Air conditioning 220 V 220 V panel 7 ELECTRICITY 83 LAGOON 42"},{"d":"UG","p":85,"pdf":87,"sec":"7.4 Electronics","t":"MOTORIZATION 8 8.1 Engines 8.2 Fuel 8.3 Propellers - Anodes 8.4 Dash board 85"},{"d":"UG","p":86,"pdf":88,"sec":"8.1 Engines","t":"ENGINE LAYOUT 1 - Fuel valve. 2 - Fuel tank. 3 - Sea water filter. 4 - Fuel filter. 5 - 12 V batteries. 6 - Engine cut outs + coupling (port side). 7 - Engine. 8 - Engine water inlet valve. 9 - Fuel tank filler. MOTORIZATION Each hull has the same components. Nota: each valve in the boat is identified. 86 1 2 3 4 5 6 7 8 9 Nota: the same layout can be observed in the other version. LAGOON 42 COUPLING CUT OUTS ENGINE WATER INLET VALVE ENGINE CONTROLS"},{"d":"UG","p":87,"pdf":89,"sec":"8.1 Engines","t":"MOTORIZATION n 8.1 Engines ACCESS You have access to the engines through the transom extension hatches. l WARNING Stop the engines before opening the hatches. In case you have to intervene when the engines are running: - Stay away from belts and mobile parts. - Be careful with full clothes, long hair, rings, etc. (they may be caught). - Wear appropriate clothes (gloves, caps, etc.). ENGINE START WITH BATTERY COUPLING In case one of the start battteries is not available: - Activate (ON position) the coupling cut out located in the port engine compartment. - Start the engine concerned. - Turn the coupling cutout back to the OFF position. l Nota: in the standard configuration,the engine batteries are recharged by their respective engines. ENGINE MAINTENANCE Please follow the instructions for maintenance appearing in the guide supplied with the engines. l ENGINE WATER INLETS The water inlet valves of the engines (access through the engines compartments) shall absolutely be open before you start the engines. l STARTING Before starting the engines: - Check the fuel valves are open (access under the aft cabins berths, on the port and starboard tanks). - Open the valves of the engine cooling system. - Switch on the electrical circuit, setting the engines cutouts to ‘ON’ (accessed via the port and starboard engine compartments). - After having checked that the reverser handles are set on neutral, start the engines. l Please carefully read the engine instruction guide supplied with the boat; it gives you detailed explanations as to the best use of the engines and relative operations. LAGOON 42 Keep the strainers of the engine water inlet valves in the best possible state of cleanliness. Brush the strainers when the boat is careened. Be careful: do not cover the strainers with antifouling paint. Get used to checking immediately after starting the engines if water is expelled with the exhaust gases. If water does not flow out: - Stop the engines immediately. - Check the valves are open. Close the water inlet valves if the boat is left unattended for long. 8 MOTORIZATION 87"},{"d":"UG","p":88,"pdf":90,"sec":"8.1 Engines","t":"FUEL - WATER FILTER - FUEL FILTER FUEL GAUGE MOTORIZATION 88 LAGOON 42 WATER FILTER + FUEL FILTER"},{"d":"UG","p":89,"pdf":91,"sec":"8.1 Engines · 8.2 Fuel","t":"motoriZation Inspect and clean the water filters regularly (access in the engine bilges). VENTILATION OF THE ENGINE BAY The engine bay fans start up automatically as soon as the engines start. l n 8.2 Fuel FUEL TANKS The boat is fitted with two tanks. Each of them is filled separately. Check the fuel gauge of each tank on the electrical board. MAINTENANCE OF THE TANKS Regularly check the O rings of the fillers for good condition (to prevent water from entering the tanks). Do not turn off the fuel taps after each use (except in case the boat is unattended for long). Keep the fuel tanks as full as possible (to avoid condensation). Every year check the fuel system for condition (hose, valves, etc.). l Ask a professional to carry out the works on the damaged parts of the fuel system. l FILLING To prevent any handling mistake, never fill the water and fuel tanks at the same time. During filling, avoid handling contaminants near the fillers. Open and close the filler caps with the right key. Use both fillers to fill the tanks with fuel. Please note: the capacity of the tanks (that is indicated in the page ‘SPECIFICATIONS’) may be not completely useable according to the trim and load of the boat. Always keep 20% fuel as a reserve. l DANGER Stop the engine and put out your cigarettes when you are filling the fuel tanks. FUEL FILTERS In order to prevent any water infiltration, the fuel runs through two filters: the first one is on the pipe that links the tank to the engine (designed as a water decanter and pre-filter), the second one is an integral part of the engine (designed to filter fuel finely). To know when you have to intervene and how frequently you have to change them, please refer to the engine instruction guide. l Drain it by undoing the knurled screw on the base of the decantation bowl (but do not remove it). Allow to flow into a box till the fuel looks clean. Do it several times a year. Change the pre-filter at least once a year (access to it when you remove the bowl). LAGOON 42 8 MOTORIZATION 89"},{"d":"UG","p":90,"pdf":92,"sec":"8.2 Fuel","t":"DASH BOARD - FOLDING PROPELLER - ANODE DASH BOARD MOTORIZATION 90 LAGOON 42 FOLDING PROPELLER + ANODE"},{"d":"UG","p":91,"pdf":93,"sec":"8.3 Propellers - Anodes","t":"motoriZation n 8.3 Propellers - Anodes n 8.4 Dash board PROPELLERS The propellers supplied with your boat are the result of tests carried out jointly with the engine manufacturer. Do not change them without consulting a specialist. On the dash board you can find all the functions to monitor the engines. l FOLDING PROPELLERS (OPTIONAL EXTRA) Remove the folding propellers at the end of each season, dismantle them and clean them carefully. Grease the thrust bearing surfaces and teeth. Check that the blades move easily. l ANODES Regularly check the sacrificial anodes corrosion. The wear of the anodes depends on numerous factors and their lives may highly vary. Change them whenever necessary. Never paint an anode. l Ask a professional to check and maintain the whole propulsion system. LAGOON 42 Please refer to the engine instruction guide supplied with the boat; it gives you explanations about the indicator lights, dials and warning lights on the dash board. 8 MOTORIZATION 91"},{"d":"UG","p":93,"pdf":95,"sec":"8.4 Dash board","t":"WINTER STORAGE 9 9.1 Laying up 9.2 Protection 93"},{"d":"UG","p":94,"pdf":96,"sec":"8.4 Dash board","t":"DIMENSIONS FOR CRADLE POSITIONING WINTER STORAGE 94 2450 mm 8000 mm LAGOON 42"},{"d":"UG","p":95,"pdf":97,"sec":"9.1 Laying up","t":"WINTER STORAGE n 9.1 Laying up - Take ashore all the ship’s log, the ropes that are not used for mooring her, the galley equipment, supplies, clothes, the safety equipment. - Check the expiry dates of the safety equipment. - Have the liferaft overhauled. Take advantage of this laying up to draw up a complete inventory of the equipment. - Install an air dehumidifier in the saloon and leave the cabin and storage unit doors open (stowage cupboards, icebox). - Leave the cushions outside for long before putting them back into the boat in the upright and side position in order to have minimum contact surfaces. - Drain and clean the bilges. - Possibly place the floorboards in a vertical position to make possible the ventilation of the different compartments. - Open the refrigerators / freezer doors. OUTSIDE - Carefully drain the cockpit shower. - Thoroughly rinse the hull and deck. - Lubricate all the mechanical and mobile parts with vaseline (bolts, hinges, locks, etc.). - Protect all ropes and mooring lines against chafing. - Protect the boat to the highest degree with fenders. - Make sure the boat is properly moored. l n 9.2 Protection WATER SYSTEM - Drain the fresh water system. Let water run from the taps until the system runs dry. Check that there is no water left in the pipes and hoses (possible low points). - Take off the filters, remove the water. Clean the filters if necessary then put them back. - Drain the water heater. Check that there is no water left. Close the drain. - Lubricate all the water inlet valves and sea cock fittings. - Rinse and completely drain the toilets bowls. l INSIDE - Seal air inlets as much as you can. l LAGOON 42 ENGINES The engines winterizing has to be prepared by a specialist. The preparation for winterizing is different according to the place where the boat will be stored - either in the water or on the shore. l RECOMMENDATION All these recommendations do not make up an exhaustive list. Your dealer will give you the advice you need and will carry out the technical maintenance of your boat. 9 WINTER STORAGE 95"},{"d":"UG","p":97,"pdf":99,"sec":"9.2 Protection","t":"HANDLING 10 10.1 Preparation 10.2 Crane lifting 10.3 Mast stepping - Mast unstepping 97"},{"d":"UG","p":98,"pdf":100,"sec":"9.2 Protection","t":"DIMENSIONS FOR CRANE LIFTING HANDLING 98 2450 mm 8000 mm LAGOON 42"},{"d":"UG","p":99,"pdf":101,"sec":"10.1 Preparation","t":"HANDLING n 10.1 Preparation The initial launching and the first tests of the different equipments shall be carried out by your dealer so that you can expect to enjoy the warranty in case of some equipment failure. All further handling shall be carried out with the highest care by professionals. If the LAGOON boatyard are not involved in your handling operations, they cannot cover under guarantee any possible accidents linked to handling. If later you have to launch your boat yourself, you should take the following precautions: - Retract the sensors under the hull into their housings (they may be damaged by the handling slings). - Check the water suction boxes for cleanliness. - Turn off all the water inlet and drain valves (grey waters, black waters, engines). - Check the anodes are in good condition and properly installed. An anode shall never be painted. n 10.2 Crane lifting - Install a bow mooring rope, a stern mooring rope and fenders. When using a crane to move the boat, check that slings cannot touch any device (depth finder, speedometer, etc.) nor the propellers. LAGOON 42 The crane hook will be fitted with a gantry or a spreader system with two slings. The slings shall not be connected directly onto the hook, as it would result in unusual compressive stresses on the hull. - Crane lifting should be carried out slowly. - Control the movement of the boat using mooring ropes. DANGER Do not stay on board or under the boat during craning. 10 HANDLING 99 n 10.3 Mast stepping - Mast unstepping Mast stepping and mast unstepping shall be carried out by a specialist."},{"d":"UG","p":101,"pdf":103,"sec":"10.3 Mast stepping - Mast unstepping","t":"SAFETY 11 11.1 Preparation 11.2 Gas system 11.3 Fire 11.4 Bilge pump system 11.5 Safety equipments 11.6 General remarks 101"},{"d":"UG","p":103,"pdf":105,"sec":"11.1 Preparation","t":"SAFETY n 11.1 Preparation THE CREW For your own safety and your crew’s, you shall respect some basic principles: - Before you sail, check the different components of your safety equipment, their location and their expiry dates. - Check the location and validity of the official documents as well. - Tell the crew where the safety equipment is, how it works and the elementary safety procedures to follow. l When sailing, always be able to indicate your precise position. In case an incident on board should happen and help be asked, this will be the very first question you will be asked. THE BOAT For the sake of prevention and to be able to feel confident to face successfully the possible dangers on board (fire, leak), learn to recognize and locate the different elements which might be the cause of these disorders and the equipments to cope with them as well. l Risk of fire: - Electrical system (chapter 7) - Engines (chapter 8) - Gas system (chapter 11) Risk of leak: - Water systems (chapter 6) RECOMMENDATION RECOMMENDATION Equip the children (and depending on the weather, the whole crew as well) with life jackets or harnesses. WARNING Do not exceed the number of persons indicated in Chapter ‘SPECIFICATIONS’. If you do not take the number of persons into account, the combined weight of the persons and equipment should never exceed the maximum load recommended by the builder. LAGOON 42 In emergency situation, it is essential to be able to locate quickly all the appropriate safety equipments. 11 SAFETY 103"},{"d":"UG","p":104,"pdf":106,"sec":"11.1 Preparation","t":"GAS SYSTEM GAs VALVES LOCKER / STORAGE SPACE SAFETY 104 1 2 1 - Gas valves. 2A - Locker / storage space of gas bottles. 2B - BubbleLeak Detector. BubbleLeak Detector Nota: the same layout can be observed in the other version. LAGOON 42 2C - Electrovalve (U.S. version). 2D - LeakDetection Gauge (U.S. version). LeakDetection Gauge (US VERSION)"},{"d":"UG","p":105,"pdf":107,"sec":"11.2 Gas system · 11.3 Fire","t":"SAFETY n 11.2 Gas system The starboard cockpit locker has been designed to store two gas cartridges. The circuits opening / closing valves are located in the cupboard at the left of the oven. The boat in her U.S. version has an electrovalve located in the locker where the bottles are stored. Turn on the electronically controlled valve using the related circuit breaker on the electrical panel. US version: a pressure gauge is placed on the circuit after the regulator in the cylinder storage container. When the cylinder is open (system pressurised) and the valve under the appliance is closed, the pressure on the manometer must remain constant. If the pressure drops then this means that there is a leak on the gas circuit. DANGER In case of a leak, turn off the gas circuit immediately. Call a professional immediately to repair gas system. SAFETY RECOMMENDATION Close the gas valve and turn off the regulator tap when the stove and oven are not used. n 11.3 Fire The boat is delivered with no extinguisher. GAS LEAK DETECTION The gas circuit is equipped with a leak detection system. l Standard version: a bubble leak detector is placed on the circuit after the regulator in the cylinder storage container. When the cylinder is open (system pressurised) and the valve under the gas appliance is closed, press the red button on the detector. If nothing happens, the circuit is sealed. The appearance of bubbles in the detector liquid signals a leak on the gas circuit. LAGOON 42 11 Be sure: - To fit the boat with extinguishers in pursuance of the regulations of the country where your boat is registered. - To have the extinguishers checked in accordance with the instructions given. - To refill or replace the extinguishers by similar equipment if the extinguishers have been used or are out of date. - Make sure the extinguishers are accessible when people are on board. Tell the crew: - where the extinguishers are and how they work. - where the extinguisher hole in the engine bay is (under the aft cabins berths, both on the port and starboard sides). - where the emergency exits are. 105"},{"d":"UG","p":106,"pdf":108,"sec":"11.5 Safety equipments","t":"INSIDE SAFETY EQUIPMENTS 1 - Fire extinguisher. 2 - Emergency exit. 3 - Extinguisher vent. 4 - Distress flares. 5 - First aid kit. 6 - VHF (optional extra). 1 7 - ............................................ 8 - ............................................ 9 - ............................................ SAFETY 10 - .......................................... 106 2 11 - .......................................... 12 - .......................................... 13 - .......................................... 14 - .......................................... 3 15 - .......................................... RECOMMENDATION Nota: the same layout can be observed in the other version. LAGOON 42 Some components do not have a pre-determined place for them. Fill-in this drawing according to your own boat safety equipments."},{"d":"UG","p":107,"pdf":109,"sec":"11.3 Fire","t":"SAFETY ESSENTIAL PRUDENCE RULES Never: - Obstruct access to the emergency exits. - Obstruct safety controls (fuel valves, gas valves, power switches). - Obstruct the access to the extinguishers placed in cupboards or lockers. - Leave the boat unattended when a stove or heater is in use. - Use gas lamps in the boat. - Alter any of the boat’s systems (electricity, gas or fuel). - Fill up a tank when an engine is running or a stove or heater is on. - Smoke while handling fuels. PROCEDURE TO FOLLOW IN THE EVENT OF FIRE - Turn off the engines if operating. - Cut off the power supply, the fuel supply. - Cut off all sources of air (smother the fire using blankets). - Hold the extinguisher upright and aim at the heart of the fire. l l Make sure that engine bays are clean at all times and regularly check that there are no fumes or fuel and gas leaks. Do not store flammables products in the engine holds. If fire broke out in an engine hold: - Turn off the engines if operating. - Cut off the power supply, the fuel supply. - Shut off the air supply using towels to block off the engine air inlets, intakes and outlets. - Cast the extinguisher product using the extinguisher vent located at the back of the aft cabins berths. - Make sure that the fire is completely under control. - Open the bay access hatch to make any necessary repair. WARNING Should you replace components of the fire extinction system, only proper components with the same designation or with equivalent technical capacities and fire resistance should be used. DANGER Evacuate the area immediately after discharging the product to prevent asphyxia. Ventilate before entering. LAGOON 42 DANGER Always keep an extinguisher handy in case the fire should start again. 11 SAFETY 107"},{"d":"UG","p":108,"pdf":110,"sec":"11.5 Safety equipments","t":"OUTSIDE SAFETY EQUIPMENTS 1 - Extinguishers. MANUAL BILGE PUMP 2 - Location of the cranks. 3 - Location of the life raft. 4 - Manual bilge pumps. 5 - Life buoy location. 6 - ................................................................... 7 - ................................................................... 8 - ................................................................... SAFETY 9 - .................................................................... 108 10 - ................................................................. LOCATION OF THE CRANKS 11 - ................................................................. 12 - ................................................................. 1 2 3 4 Nota: the same layout can be observed in the other version. LAGOON 42 13 - ................................................................. 14 - ................................................................. 15 - ................................................................. RECOMMENDATION Some elements do not have a pre-determined location for them. Fill-in this drawing according to your own safety equipments. LOCATION OF THE LIFERAFT"},{"d":"UG","p":109,"pdf":111,"sec":"11.4 Bilge pump system","t":"SAFETY n 11.4 Bilge pump system n 11.5 Safety equipments BILGE PUMPS The boat is fitted with two bilge pumps in each hull: - an electric pump automatic release located in the well. - a manual cockpit pump. Before you sail, list the compulsory safety equipments. Do not exceed the number of persons indicated in Chapter ‘SPECIFICATIONS’. l For further information, please refer to Chapter ‘WATER SYSTEMS’. WARNING The list of the compulsory safety equipments corresponds to a certification category, a design category as well as to the regulations in the country where the boat is registered. MANUAL BILGE PUMPS In case of failure or if the electric bilge pumps are not enough, you can use the manual bilge pumps with cranks (in the cockpit’s port locker). l PROCEDURE TO FOLLOW IN THE EVENT OF A LEAK Make sure that the electric bilge pumps are switched on. If it is not enough to overcome the water level, ask a crew man to use a manual pump. l SAFETY LIFE RAFT The life raft is to be stored under the rear beam. Fit your boat with a life raft in pursuance of the regulations of the country where the boat is registered. l You shall use the life raft only if all else fails. RECOMMENDATION Before you sail to sea, carefully read the launching instructions on the life raft. LAGOON 42 11 109"},{"d":"UG","p":110,"pdf":112,"sec":"11.5 Safety equipments","t":"EMERGENCY TILLER - MAN HOLES EMERGENCY TILLER COVER 1 SAFETY 110 1 - Man hole. 2 - Emergency tiller cover. 2 Nota: the same layout can be observed in the other version. LAGOON 42 EMERGENCY HAMMER + MANHOLE HATCH"},{"d":"UG","p":111,"pdf":113,"sec":"11.6 General remarks","t":"SAFETY EMERGENCY TILLER The emergency tiller is stored in a locker. It shall be kept easily accessible. l To operate the tiller: - Use a winch handle and unscrew one of the tiller covers situated on one of the aft transom extensions. - Insert the tiller into the rudder stock, making sure it is well fitted into the tiller head block. - Unplug every device connected to the spindles of the rudders. CAPSIZING Two \"man holes\" are provided in each hull passageways. l n 11.6 General remarks MANOEUVRES - Know where your crew members are and inform them before you manoeuvre on the boat. - Carefully manoeuvre on the deck and always wear shoes. l ENGINES - Systematically stop the engines before you dive or swim next to the boat. - Never try to free a fishing net or a piece of rope that is caught on a propeller when the latter is rotating. l TOWING If you have to tow another boat, tow her at a reduced speed and as smoothly as you can. Be particularly careful when throwing or catching the towing line (It may catch on the propellers). l An emergency hammer located next to each hatch and at the bottom of the bib locker. You can gain access to the life raft under the rear beam. WARNING Regularly check the safety equipments are in good working order. Follow the service programme without fail. Generally speaking, take particular care of all the safety equipment of your boat. LAGOON 42 11 SAFETY 111"},{"d":"UG","p":113,"pdf":115,"sec":"11.6 General remarks","t":"MAINTENANCE 12 12.1 Maintenance schedule 113"},{"d":"UG","p":114,"pdf":116,"sec":"11.6 General remarks","t":"MAINTENANCE 12.1 Maintenance schedule The information given hereafter are only examples and it is not an exhaustive list. They must be adapted, according to the use of your boat. WARNING Follow without fail the recommendations given in the instruction guides by the manufacturers of the components added to the boat. RUNNING / STANDING RIGGING / SAILS Lubricate the mast railand cars (Teflon) ..............................MONTHLY Check the cap’s spreader................................................... QUATERLY Rinse and lubricate the blocks.............................................MONTHLY Control the halyard’s exits. ................................................. QUATERLY Shroud turnblock and swage fitting.................................... QUATERLY Check the shackes and blockers. ................. WHEN USED / QUATERLY Check the running rigging . .......................... WHEN USED / QUATERLY Rinse and clean the running rigging. ..................................... ANNUAL Check and rinse the sails. ............................................... WHEN USED Complete control the mast rigging......................................... ANNUAL Check the life lines............................................................. QUATERLY MAINTENANCE 114 DECK / DECK FITTING / HULL Careening, antifouling and chek the rudder. .......................... ANNUAL Clean the stainless steel devices ........................................MONTHLY Clean the hull..................................................................... QUATERLY Clean the teaks and check the
