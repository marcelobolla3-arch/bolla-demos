4.1 INFORMATION RELATING TO FIRE RISKS AND RISKS OF EXPLOSION - Make sure that the coolant is circulating properly. - Ensure that the engine compartment ventilation air inlets are kept clear. - Stop the engine and refrain from smoking while the fuel tank is being filled. - Have your fuel circuit checked regularly by a professional engineer. - Avoid any contact between inflammable materials and the hot sections of the engine. - Never switch off or cut off energy to the electric system when the engine is running. - Never block access to the fuel supply valve. - Do not obstruct or modify the ventilation system. - Never turn the engine over when the boat is on land. - Fuel stored outside the tanks (jerrycans, portable fuel tanks, etc.) must be stowed on deck and protected from bad weather and mechanical damage. - Regularly check that the engine compartment is clean and dry. Engine water intake valve: Fuel supply valve: 182 Engine "},{"d":"OM","p":183,"pdf":183,"sec":"14.1 Information Relating To Fire Risks And Risks Of Explosi","t":"DANGER FROM MOVING MECHANICAL PARTS - Keep away from the drive shafts and the mechanical parts of the engine when they are in motion (including belts, moving parts and hot components). - Be careful if you have long hair, bulky clothing, rings etc. (these may become caught). - Regularly check that the O ring on the filler cap is in good condition to prevent water ingress. 14.3 - Keep the fuel tank as full as possible to prevent condensation. GENERAL POINTS - Do not install an engine more powerful or heavier than recommended for this boat, since doing so may compromise the boat's stability. - Be careful with any possible risk of oil and fuel spillage. - Any alteration or modification to the exhaust system of the propulsion engine(s) is prohibited. - Follow the engine manufacturer's instructions exactly. - Make sure you have enough fuel before sailing. - Stop the engine before opening the engine compartment. - Do not close the fuel supply valve between each use of the engine (except in the event of prolonged disuse). - Get the whole propulsion system checked at least once a year by a professional engineer. see Chapter: MANOEUVRABILITY. Always start the engine with the control lever in neutral. Type of motorisation Your boat is fitted with two in-board diesel engines. Transmission type is: Sail-drive. Filling up with fuel - Fill the fuel tank by opening the cap marked \"DIESEL\", provided for this. - Fuel capacity: 2 x 285L. - Position of tanks: Port aft cabin & Starboard. - Regularly check that the O ring on the filler cap is in good condition to prevent water ingress. - Each fuel supply valve supplies one engine. - The generator has its own fuel supply valve. 183  - Never switch off the battery isolators when the boat's engine is running (risk of serious damage to the charging circuit). 14 Engine 14.2"},{"d":"OM","p":184,"pdf":184,"sec":"14.1 Information Relating To Fire Risks And Risks Of Explosi","t":"- Some of the gauges must be calibrated when you first fill the tanks: please consult your dealer. - The tanks' nominal capacity cannot be fully used due to the load and the need to maintain the correct trim. A 20% reserve should be kept. Deck filler - DIESEL NOTE: Ensure the seal is tightly closed to prevent ingress of water. Gauge on the electrical panel Fuel tank 184 Engine "},{"d":"OM","p":185,"pdf":185,"sec":"14.4 Starting The Engine","t":"14.4 STARTING THE ENGINE Before starting the engine, it is essential: - Before using the engine, make sure you carefully read the handbook provided by the engine manufacturer. - to open the fuel supply valve; - to open the seawater intake valve of the engine; - to switch on the battery supply by using the battery isolator switches; - to put the control lever in neutral. Make a habit of looking to see if seawater is pumped out with the exhaust gases as soon as you start the engine. If no water runs out, stop the engine immediately. Check the coolant flow. The engine compartment bilge fan is activated automatically when the engine is started. 185  - Learn how to judge the necessary distance of deceleration for the vessel to come to a complete stop (the reverse gear is not a brake). 14 Engine Engine compartment ventilator Location: Engine compartment (Port and starboard) - Always start the engine with the control lever in neutral."},{"d":"OM","p":186,"pdf":186,"sec":"14.5 Engine Water Intake Valve","t":"14.5 ENGINE WATER INTAKE VALVE The seawater intake valve plays a crucial role in ensuring that the engine runs well. - Keep the filter under the hull as clean as possible; - Brush the filter whenever the boat is lifted out. This valve must absolutely always be opened before starting the engine. A seawater filter filters the water before it goes through the heat exchanger. Regularly inspect the seawater filter and clean it if necessary. Screw/unscrew the cover of the filter by hand (never use tools). For lengthy absences, close the engine's seawater intake valve. Seawater intake: Intake filter Seawater filter Access: Engine compartment Supply valve (on the housing) 186 Engine "},{"d":"OM","p":187,"pdf":187,"sec":"14.6 Anti-Siphon Valve","t":"14.6 ANTI-SIPHON VALVE Anti-siphon valve Access: Engine compartment - The function of the anti-siphon valve is to inhibit the siphoning action when the engine stops, thus preventing a backflow of water. - It is possible that on starting the engine or at certain engine speeds some drops of water may be seen escaping from the anti-siphon valve. If this occurs, you must clean the anti-siphon valve: dismantle the water collector at the top of the anti-siphon valve, then clean the valve with fresh water to remove any impurities. - Then do the reverse procedure to refit the cleaned component, taking care not to refit the valve the wrong way round. 14.7 FUEL FILTER Engine running problems may stem from various causes, including dirty fuel. The injection pump may wear out if there is water in the system. The water results either from condensation resulting from an insufficiently filled tank, or from a filler cap which has either not been closed properly or which has a damaged seal. Location: Engine compartment In order to prevent any water infiltration, the fuel runs through two filters: - One filter is an integral part of the engine; its role is to filter fuel very finely. Please refer to the engine manufacturer's notes for any maintenance and for the frequency of filter changes. - The second filter is on the pipe that links the tank to the engine; it works as a water decanter and prefilter. Maintenance - Purge the impurities by unscrewing the screw located at the base of the decanting bowl (without removing it). Let the liquid run into a receptacle until the fuel runs clear. Do this several times a year. - Change the pre-filter at least once a year. 187  14 Engine - It is advisable to carry out this simple preventative maintenance procedure on the anti-siphon valve once a year."},{"d":"OM","p":188,"pdf":188,"sec":"14.8 Engine Installation","t":"14.8 ENGINE INSTALLATION 10 05 12 04 06 03 09 02 01 08 11 02 05 03 02 06 08 7 09 12 06 05 188 Engine "},{"d":"OM","p":189,"pdf":189,"sec":"14.8 Engine Installation","t":"Reference Designation Fresh air suction 2 Filler cap 3 Engine panel 4 Engine control lever 5 Fuel tank 6 Engine batteries 7 Fuel filter 8 Motor 9 Hot air extraction 10 Fuel tank vent 11 Seawater filter 12 Expansion tank 14 Engine 1 Yanmar engine Volvo engine 189 "},{"d":"OM","p":190,"pdf":190,"sec":"14.9 Engine Control","t":"14.9 ENGINE CONTROL - The engine manufacturer's notes provide detailed explanations on how to operate the engine and keep it running well. - Read the manufacturer's notes on use and maintenance of the engine. 1. Port engine control panel 2. Starboard engine control panel 3. Engine control lever (x 2) 14.10 ACCESS TO THE ENGINE Access to the engine can be gained via: - the cockpit. All access hatches to the must strictly be kept shut when at sea. 190 Engine "},{"d":"OM","p":191,"pdf":191,"sec":"14.11 PROPELLER","t":"14.11 PROPELLER - The propeller delivered with the boat is specifically selected after trials carried out in collaboration with the engine manufacturer. Never change the propeller without first consulting a professional engineer. - Propeller efficiency will drop if the propeller blades are damaged or dirty: clean the blades regularly and attentively. - During lift-out, check the propeller: it should turn freely on its axis and there should be no play. - Respect speed limits. - If this boat is equipped with a fixed blade propeller, when sailing at speeds over 8 knots it is essential to leave the reverse gear control in neutral. Propeller Engine 14 191 "},{"d":"OM","p":193,"pdf":193,"sec":"14.11 PROPELLER","t":"15 STEERING SYSTEM General points ................................................................................ 194 Diagram of layout ........................................................................... 195 193 15"},{"d":"OM","p":194,"pdf":194,"sec":"15.1 General Points","t":"15.1 GENERAL POINTS - The steering operates by steering cables. - The steering system is an important safety feature. For this reason, an annual inspection of the whole system must be carried out by a professional engineer. - Regularly check the tension of the steering cables and the tightness of the steering components. If needed, adjust the tension of the steering cables. Don't tighten the steering cables excessively. When properly adjusted the steering should work smoothly, with no play at all and no stiffness in the tiller or wheel (consult your dealer). - Regularly grease the chains and gears as well as the coupling bar ball joints. - Do not grease the steering cables or the pulleys. - Maintain the nylon, ertalon or teflon bushes with only a suitable lubricant. - The textile lines on the boat have a lifetime of 5 years. Beyond 5 years (the expiry date is sewn on the textile lines) the textile lines must be changed. - The bronze rings (mark B and C) are integrated into the rudder port tube. Each ring is a wearing part: make sure you change them regularly (Please contact your dealer). Cable adjustment - Line Sheaves - Line Coupling bar ball joint 194 Steering system "},{"d":"OM","p":195,"pdf":195,"sec":"15.2 Diagram Of Layout","t":"15.2 DIAGRAM OF LAYOUT D C Steering system 15 B A A 195 "},{"d":"OM","p":196,"pdf":196,"sec":"15.2 Diagram Of Layout","t":"A-A 17 COUPE A-A 16 E Detail B 7 11 Detail C Detail E 2 5 4 12 9 3 6 19 1 8 18 196 Steering system "},{"d":"OM","p":197,"pdf":197,"sec":"15.2 Diagram Of Layout","t":"Detail D 13 15 14 10 197  Designation 1 Rudder 2 Rudder stock 3 Balance bush 4 Rudder tube 5 Stock arm 6 Stock arm stop 7 Connecting rod 8 Tiller cable 9 Sheave 10 Movable Sheaves 11 Helm angle sensor 12 Rocker bar 13 Steering Gear 14 Chain 15 Steering wheel 16 Sector access port 17 Tiller 18 Angle bracket 19 In-line piston - Autopilot 15 Steering system Reference"},{"d":"OM","p":199,"pdf":199,"sec":"15.2 Diagram Of Layout","t":"16 DECK FITTINGS General points ................................................................................ 200 Equipment ....................................................................................... 202 Berthing, anchoring, towing.......................................................... 207 Main elements of the chain locker ................................................ 209 Electric windlass ............................................................................ 210 199 16"},{"d":"OM","p":200,"pdf":200,"sec":"16.1 General Points","t":"16.1 GENERAL POINTS Alcohol, solvent or acetone-based solutions must not be used to clean/maintain the outer surfaces of the boat. A warm, soapy, water-based solution is best for this purpose. 16.1.1 GRP - Regularly brush the deck using a gentle de-greasing agent then rinse the deck with fresh water. - Use as few cleaning agents as possible. - Don't use solvents or aggressive detergents. - Don't dump cleaning agents into the water: Consult the harbourmaster's office to find out the conditions of water use and the maintenance area for cleaning your vessel. - Do not use a pressure washer. 16.1.2 Plexiglas (PMMA) - Rinse plexiglas with fresh water. Never use solvents, alcohol, acetone or detergents on plexiglass. - Use a polish paste for thin scratches. - Consult your dealer if deep scratches occur. 16.1.3 Stainless steel Stainless steel is an alloy of iron and carbon (steel) with the addition of chromium. The chromium creates a protective film which insulates the steel from the surrounding environment. This coating is usually invisible due to its thinness. Thus, despite its name, this steel is not stainless and requires a minimal level of maintenance: - Chromed tools are preferable whenever handling stainless steel; Passivating paste is an acid-based product whose purchase and/or use may be subject to regulation. Please contact your dealer. - Re-nourish the protective film regularly with passivating paste. 200 Deck fittings "},{"d":"OM","p":201,"pdf":201,"sec":"16.1.4 Solid wood on exterior wooden panelling","t":"16.1.4 Solid wood on exterior wooden panelling - Wood exposed to harsh conditions such as salty air and UV rays tends to become whiter and to lose its natural colour. This phenomenon has no effect on the intrinsic qualities of the wood, but can spoil its aesthetic appeal. Never use detergents, acetone or other harsh products on the wood. - To maintain the colour of the wood, regularly wash the woodwork in fresh water using a sponge (if necessary, use a mild soap). - It is recommended that you oil the external woodwork regularly using teak oil in order to protect it from harsh conditions. 16.1.5 Exterior upholstery - Bring the removable cushions inside (washed with soapy water then dried) when the vessel is unoccupied. If the wind exceeds 20 knots, it is recommended that you stow all removable protection sheets (Bimini, awnings...). Maintenance To maintain the quality of the fabric, spray regularly with clarified water and brush with a soft brush (such as a clothes brush). A thorough clean every 2 years is recommended. Stain removal Never: Follow these steps for routine cleaning: - use a heat source (hairdryer/clothes dryer); - Remove as much debris as possible using a soft brush; - use detergent, silicone, acetone, chlorinebased products or hot water; - Spray the fabric with water; - Prepare a cleaning solution using mild soap and water (do not use detergent); - use a high-pressure cleaner. - Wash with a soft brush; - Wait for the soap solution to act; - Rinse thoroughly in fresh water; - Dry in the open air. 201  16 Deck fittings - Put canvas sheets/protective covering over the fixed upholstery."},{"d":"OM","p":202,"pdf":202,"sec":"16.2 Equipment","t":"16.2 EQUIPMENT No one must be onboard the tender while launching or retrieving it. 16.2.1 Davits - The davits enable the launch and retrieval of the tender from the transom. Any other use is dangerous and must be strictly avoided. - The davits are designed to support a maximum load of 200kg and a tender which is at most 3,40m long. - The davits are equipped with a pulley block for manoeuvering the tender. - Before heading out to sea, remove the outboard engine from the tender and store it on the boat. - Secure the tender taking account of sea conditions. - Secure the outboard engine to the tender once this is in the water. Mechanism - Refer to the manufacturer's instructions for use and maintenance. - Avoid handling the tender in strong wind or rough seas. - The tender must be empty during launching or lifting. 202 Deck fittings "},{"d":"OM","p":203,"pdf":203,"sec":"16.2.1 Davits","t":"Launching the tender - Insert the bung. - Free the locking system of the davit on the starboard pen board. - Free the jammer located on the starboard pen board. - Using the manoeuvring winch and the tackle, lower the tender to the water surface. Retrieving the tender from the water - Secure the pulley's hooks to the front and back of the tender. - Free the jammer located on the starboard pen board. - Lift the tender with the manoeuvring winch and the tackle until it stops against the pen boards. - Hold it up with the jammer and locking system located on the starboard pen board. Deck fittings - Pull out the bung. 203  16"},{"d":"OM","p":204,"pdf":204,"sec":"16.2.1 Davits","t":"ASSEMBLY 4 IN D6 spring hooks 6 Davit loops (L 0,8m) Aft part (Port) 1. Pass a loop through the davit ring where the pulley is hooked on. 2. Pass 2 more double loops inside the first. 3. Connect these 2 loops to the tender using stainless steel spring hooks. 204 Deck fittings "},{"d":"OM","p":205,"pdf":205,"sec":"16.2.1 Davits","t":"Fore part (Starboard) 1. Pass a loop through the davit ring where the pulley is hooked on by doing an extra dead turn. 2. Pass 2 more double loops inside the first. 3. Connect these 2 loops to the tender using stainless steel spring hooks. Deck fittings 16 4. The tender is put in place. 205 "},{"d":"OM","p":206,"pdf":206,"sec":"16.2.2 Solar panels","t":"16.2.2 Solar panels The solar panels are connected to the service battery bank. Solar panels are used to maintain battery charge. They are insufficient for recharging of the onboard batteries. - Refer to the manufacturer's instructions for use and maintenance. - The solar panels are fragile. Never walk on them. Location: Roof Regulator Access: Starboard engine compartment Maintenance - Clean regularly with clear water only or with a little neutral pH soap as needed. 206 Deck fittings "},{"d":"OM","p":207,"pdf":207,"sec":"16.3 Berthing, Anchoring, Towing","t":"16.3 BERTHING, ANCHORING, TOWING Anchoring points showing visible signs of deterioration must be replaced. 16.3.1 Anchor points Responsibility It is the responsibility of the owner/user of the boat to ensure that the berthing lines, towing cables, chains and mooring lines and the anchors are adequate for the intended use of the boat, i.e. that the lines or chains do not exceed 80 % of the breaking strength of the corresponding anchor point. MOORING TOWING A A/B A/B Anchor Point Breaking Strength 30,9kN 49,3kN 49,3kN Mooring Line/Chain Breaking Strength 24,7kN 39,4kN 39,4kN Reference (Diagram on next page) 207  16 Deck fittings MOORING LINES"},{"d":"OM","p":208,"pdf":208,"sec":"16.3.2 Towing","t":"16.3.2 Towing Responsibility: It is important that the owner thinks through the actions required when securing a towing cable onboard. Location of attachment points - Generally the breaking strength of lines/ chains must not exceed 80% of the breaking strength of the anchor points. - Always tow or be towed at low speed. Never exceed the maximum speed of a displacement hull during a tow. - Be particularly vigilant when the end of a towing cable is being thrown or received (the end may become caught in the propeller). - A towing cable must always be secured in such a way that it can be released under load. - Do not try to stop the boat by using a boathook or your foot, hand or any other part of your body. A. Mooring cleats (corresponding to the anchor points for the lifelines). B. Towing: - at the bow, to be towed, - at the stern, to tow. 208 Deck fittings "},{"d":"OM","p":209,"pdf":209,"sec":"16.4 Main Elements Of The Chain Locker","t":"16.4 MAIN ELEMENTS OF THE CHAIN LOCKER - Refer to the manufacturer's instructions for use and maintenance. General view - Windlass operations are dangerous: - Always keep the anchor chain or rope free and unfouled; - Carry out manoeuvres carefully and always wear shoes; - Avoid wearing baggy clothing and jewellery that could get caught in the engine when it is running. Tie up long hair.. Deck fittings 16 1. Handle fitting 2. Drum head 3. Gypsy 4. Remote control 5. Handle storage Fitting - Anchor 6. Mooring hook 7. Pig tail 8. Shackle 9. Bridle Keep the anchor in raised position with the strop on the cleat 209  Chain hook on bridle line"},{"d":"OM","p":210,"pdf":210,"sec":"16.5 Electric Windlass","t":"16.5 ELECTRIC WINDLASS General points Refer to the manufacturer's instructions for use and maintenance. - The windlass is DC powered. - The windlass is designed for anchoring purposes: Any other use is dangerous and must be strictly avoided. - An operation relay is fitted to the electrical circuit. - A circuit-breaker protects the power supply to the windlass. - The windlass operation is activated by an operational interlock relay which is powered by the engine's alternator: the windlass only works when the boat's engine is running. - The controls to raise/lower the windlass are protected by a circuit-breaker positioned between the batteries and the windlass relay. Operation - Before lowering the anchor, make sure that the chain or anchor rope is securely attached to the bitter end ring. - Activate the circuit-breaker then use the control to start the windlass. - Nobody should be aboard the tender during maneuvers carried out with the davits. If the port engine is not functioning,the windlass can work on service batteries (if available) by switching on the port engine ignition only (the engine alarm will then sound while the windlass is in use). Preparation of anchoring - Install the bridle by fixing it to the chain plates located at the ends of the fore beam. - Put the bridle through the stem bow roller. - Shackle the bridle to the central cleat during the lowering of the chain. - When at sea, secure the chain or anchor rope to secure points such as the chain stopper or the anchor rode to the belaying cleat (the windlass must not be used as the only method of securing the chain or rode). - With dual control, be careful to use only one control at a time. - When raising the anchor, use the boat's engine to move towards the position of the anchor until the boat is just over it: never use the windlass as a winch to move the boat forward. - When out at sea, cut the electrical supply to the windlass. - Cut the electrical supply when using the windlass manually. 210 Deck fittings "},{"d":"OM","p":211,"pdf":211,"sec":"16.5 Electric Windlass","t":"Maintenance - Regularly grease the supply terminals of the electric motor of the windlass and of the relay control box. Emergency anchoring procedure In the event of an electrical fault, it is possible to lower the anchor manually: Put the handle in the space provided to release the chain sprocket. Let the chain run out using the handle to control the speed as it runs. The handle serves only to release the chain sprocket in order to lower the anchor manually should the electric windlass break down. The handle cannot be used to raise the anchor manually. - Before anchoring check the depth of water, the power of the current and the nature of the sea bed. - Check the swing radius once the boat is at anchor. - After each trip rinse the windlass and anchor chain or rope with fresh water. 211  16 Deck fittings - Once a year, dismantle, carefully wash and grease all the moving parts of the windlass."},{"d":"OM","p":213,"pdf":213,"sec":"16.5 Electric Windlass","t":"17 HULL FITTINGS Interior upholstery.......................................................................... 214 Interior woodwork .......................................................................... 217 Interior maintenance ...................................................................... 217 213 17"},{"d":"OM","p":214,"pdf":214,"sec":"17.1 Interior Upholstery","t":"17.1 INTERIOR UPHOLSTERY GENERAL POINTS - The interior upholstery is designed for use inside the boat only. - The fabric used inside the boat has not had any special treatment to protect it from a saline atmosphere or from UV. - Make sure the curtains are drawn to protect the interior upholstery from exposure to sunlight. LEATHER Maintenance Leather must be regularly cleaned and waxed. - Test the product on a small hidden area of the surface before cleaning. To do so, clean the leather surface with a damp rag. This will remove dust. Every 6 months to a year depending on use, apply a leather shampoo on the leather then use a hydrating cream which will also protect it. Stain removal If the leather surface gets stained, clean immediatley using an absorbent piece of paper. Do not scour. Clean with inward motions to prevent the stain from spreading. - Avoid excessive moisture. - Do not scrub on leather surfaces. - If you notice leather colouring on the rag, immediately stop cleaning. - Dab with denatured alcohol, using a piece of cotton to apply (ink and food stains). - Apply absorbent powder (talcum) on grease stains. Wait a couple of hours, then brush away the excess powder. - Other: Apply white vinegar or acetic acid diluted in water. 214 Hull fittings "},{"d":"OM","p":215,"pdf":215,"sec":"17.1 Interior Upholstery","t":"ALCANTARA (microfibre) Stain removal The fabric must be free from dust before stain removal. To do so, use a vacuum cleaner. Rub with a duster soaked in a solution containing ammonia diluted by 10%. Dilute to the strength appropriate for this fabric. Try it out first on a hidden area such as the hem. If the appearance of the fabric changes, dilute accordingly. Scrub the Alcantara fabric in all directions, particularly on the stains. Rinse off the cleaning solution using a damp cloth. Dry in the open air. After taking the Alcantara fabric off, it's a good idea to use a gentle brush to bring back its softness. SYNTHETIC FABRIC Stain removal If you can remove the fabric: - Clean in the washing machine (use the programme for delicate fabrics) at 30°. - Do not iron. - Never use Javel water. - Do not dry-clean. - Do not tumble-dry. If you cannot remove the fabric: - Clean with the vacuum cleaner, - Clean with a foam for synthetic fabrics (see manufacturer's instructions for these products). 215  17 Hull fittings For difficult stains, dry-cleaning is recommended."},{"d":"OM","p":216,"pdf":216,"sec":"17.1 Interior Upholstery","t":"COATED FABRIC (PVC) Maintenance - The PVC must be regularly cleaned with soapy water to maintain its appearance and to avoid accumulation of debris. We strongly advise against using the following products: lacqeurs, aggressive cleaning products, detergents, xylene or acetone-based products which can cause permanent damage or make the fabric deteriorate. The use of such products is carried out at the owner's risk. Stain removal - All stains must be quickly removed to avoid formation of permanent stains. - Use mild water to remove stains on the surface of the fabric. Use only clean, white, damp pieces of cloth. - Difficult stains can be removed using a mixture of water (25%) and white spirit. - Rinse with clean water. - Dry with a soft piece of cloth. ACRYLIC (bimini fabric) Maintenance To maintain the quality of the fabric, spray regularly with clarified water and brush with a soft brush (such as a clothes brush). A thorough clean every 2 years is recommended. Stain removal Follow these steps for routine cleaning: - Remove as much debris as possible using a soft brush; - Spray the fabric with water; - Prepare a cleaning solution using mild soap and water (do not use detergent); - Wash with a soft brush; - Wait for the soap solution to act; - Rinse thoroughly in fresh water; - Dry in the open air. 216 Hull fittings "},{"d":"OM","p":217,"pdf":217,"sec":"17.3 Interior Maintenance","t":"INTERIOR WOODWORK Varnished wooden panels: - If in doubt or if stains persist, consult a cleaning specialist. The UV varnish has a matt appearance: - The acrylic varnish has medium resistance to external chemical damage as well as minor scratches. - Clean regularly with lukewarm soapy water. - Do not use polish (this may result in unwanted brightening of appearance). - For scratches, remove the panel and have it re-varnished by your dealer. - For winterisation, ensure the curtains are drawn to prevent prolonged exposure of the varnish and fabric to sunlight. This will prevent the risk of discolouration. - NEVER: The acrylic varnish used has a matt appearance: - use solvents or abrasive products; - The acrylic varnish features medium resistance to external chemical damage as well as minor scratches. - use a heat source (hairdryer/clothes dryer); - The varnished surface tends to get dirty quickly since it is not flat and reveals hollow pores. NOTE: Vigorously rubbing a varnish surface gives it a brighter appearance. - Do not use polish (this may result in unwanted brightening of appearance). - use a high-pressure cleaner. - Gently and regularly clean with lukewarm soapy water. - For scratches, remove the panel and have it re-varnished by your dealer. Floors: - The floors fitted onboard are laminated. - Clean regularly with lukewarm soapy water. - In the event of a scratch, remove the plank and replace it with a new one (consult your dealer). 17.3 INTERIOR MAINTENANCE - Take advantage of fine weather to air the interior upholstery. - Remove the cushions during lengthy periods of absence. - Make sure the bilges are clean and dry. - For lengthy periods of absence, leave the icebox and fridge doors open to prevent mould from developing. - Use a dehumidifier in the saloon and ensure cabin and storage doors are left open (cupboards, iceboxes...). - During long absence, rinse and dry chrome-plated part to avoid oxidation. 217  - use detergent, silicone, acetone, chlorine-based products or hot water; 17 Hull fittings 17.2"},{"d":"OM","p":219,"pdf":219,"sec":"17.3 Interior Maintenance","t":"18 HANDLING, TRANSPORT Lifting plan ...................................................................................... 220 Lifting............................................................................................... 221 Upper limit of antifoul .................................................................... 221 Launching and lifting ..................................................................... 222 Stepping and unstepping the mast............................................... 222 Winterisation................................................................................... 223 Transport......................................................................................... 224 219 18"},{"d":"OM","p":220,"pdf":220,"sec":"18.1 Lifting Plan","t":"18.1 LIFTING PLAN Note: Measurements are expressed in mm. The position of the lifting slings is shown in the pictogram below: 220 Handling, transport "},{"d":"OM","p":221,"pdf":221,"sec":"18.1 Lifting Plan","t":"LIFTING - Before the first application of antifouling to the hull, you can lightly sand the hull using wet and dry sandpaper of 400 or more. - The lower hull of your boat should be covered with an anti-fouling paint to prevent the adhesion of marine growth. - Follow the manufacturer's recommendations closely when applying antifouling. - The water quality where your boat is kept, along with the frequency of lifting, will determine the choice of antifouling. - Never let antifouling cover: - All bronze or steel surfaces, including the propellers, should be protected by a suitable antifoul paint. - During the lift-out, check the anodes and the propeller (see corresponding chapters). - Antifouling can deteriorate when the boat is ashore or dried out: Please observe the out-of-water time limit set by the supplier. Before applying antifouling NEVER: - Use any other solvents than ethylic alcohol; - Use pressure washer detergents; - Use scrapers; - Use grinding tools. If cleaning off existing antifouling requires high pressure washing: - Ensure the water temperature does not exceed 15 degrees; - The water pressure must not exceed 150 bar (2175 PSI); - The distance between the hose nozzle and the hull must not be less than 10 centimetres. The wet surface area of the boat is approximately: UPPER LIMIT OF ANTIFOUL The boat's hull has a shallow indent moulded along its length: the upper marking corresponds to the upper limit of antifoul on the hull. 221  - the sail-drive baseplate must be covered with copper-free antifouling. - Avoid using copper or tin-based antifouling: these are banned in some countries. - Do any sandblasting; 18.3 - the anodes; - the earthing plates (Generator / DC/AC converter); - the sensors of the electronic instruments. 18 Handling, transport 18.2"},{"d":"OM","p":222,"pdf":222,"sec":"18.4 Launching And Lifting","t":"18.4 LAUNCHING AND LIFTING The first time you use your boat a high level of skill and attention will be required. The proper functioning of all equipment will depend on the initial set-up being carried out correctly. For this reason the first launch must be carried out under your dealer's supervision. Before launching - Before strapping the boat when taking it out of the water, be sure to remove the probes from their housing to prevent the lifting strap from damaging them. - Replace the speedometer in its housing. - Check the cleanliness of the seawater filters. - Check the anodes (see Chapter: ELECTRICAL SYSTEM). - Close the hull opening by the cap for this purpose (supplied with the probes). - Check the propeller (see Chapter: STEERING SYSTEM). - Prepare enough fenders and lines. - Check the engine's seawater intake valve and the fuel feed valve (see Chapter: ENGINE). - When placing the slings make sure that the positioning marks are still visible. - Immerse the sling fully under the engine mounting. BLOCKING THE BOAT ASHORE 18.5 Do not stand onboard or beneath the boat during the handling operations. STEPPING AND UNSTEPPING THE MAST The stepping/unstepping operations require the skills of a professional rigger: please consult your dealer. 222 Handling, transport "},{"d":"OM","p":223,"pdf":223,"sec":"18.6 Winterisation","t":"18.6 WINTERISATION - Take advantage of laying-up to carry out a full inventory of the equipment. - Engine winterisation requires a professional engineer: please consult your dealer. - Check the expiry dates of the safety equipment. - Have the liferaft overhauled. - Empty the complete water system inside and outside and rinse it through with a mix of water and vinegar (do not use chlorine-based products). - This is not an exhaustive list of recommendations: Your dealer will give you the advice you need and will carry out technical maintenance of your boat. - Empty and rinse the entire blackwater system. - Dry out and clean the boat's bilges. - Grease and close all the valves and thru-hull fittings. 18 - Close all the boat's seacocks. - Put the covers back on the electronic screens. - Use a dehumidifier in the saloon and ensure cabin and storage doors are left open. - Air all of the cushions and upholstery for a while before putting them back onboard and arranging them so as to limit contact between surfaces. - Close the blackout curtains. - Leave the fridge/icebox doors open to prevent mould and smells from developing. - Protect the boat as well as possible with fenders. - Make sure the boat is properly moored. - Grease all mechanical and moving parts (bolts, hinges, locks...). - Remove the sails and store them somewhere dry and well-ventilated. - Remove the movable upholstery. - Disconnect the batteries. Make sure you recharge them during the Winter period if the boat is left inactive for a long time. 223  Handling, transport - Remove the depth sounder and speedometer heads."},{"d":"OM","p":224,"pdf":224,"sec":"18.7 Transport","t":"18.7 TRANSPORT Packing plan - If the boat can be transported by trailer, make sure you use a trailer that is appropriate for the boat and its weight. Note: Measurements are expressed in mm. 224 Handling, transport "},{"d":"OM","p":225,"pdf":225,"sec":"18.7 Transport","t":"19 ENVIRONMENT Waste management........................................................................ 226 225 19"},{"d":"OM","p":226,"pdf":226,"sec":"19.1 Waste Management","t":"19.1 WASTE MANAGEMENT - Throw all packaging in the recycling containers provided. - Once a piece of equipment has stopped working completely, find out about the relevant recycling regulations from your nearest recycling centre or from your dealer. - Make sure you follow the relevant local laws when scrapping. - Some onboard equipment can have a toxic effect on the environment and on human health due to the specific substances they contain: Do not throw any equipment in household waste containers and absolutely never dispose of equipment in the sea. - Dead batteries are toxic to health and to the environment. Batteries must not be put in with household waste and must be recycled separately. Contact the harbour master or a specialist company about recycling them. - Make sure you know the local enviromental regulations and follow the codes of best practice. - Do not pump out the toilets or the contents of the black water tank near the coast or in areas where this is forbidden. Use the pump-out facilities available in ports or marinas to empty the contents of the black water tank before leaving port. - Make sure you know the international regulations to prevent pollution in the marine environment (MARPOL Convention) and follow these as much as possible. 226 Environment "},{"d":"UG","p":1,"pdf":3,"sec":"","t":"Welcome aboard We share a common passion for the sea; we, LAGOON, as catamaran builders and you who want to live your passion on the seven seas. We are delighted to welcome you to the family of LAGOON catamaran owners and we congratulate you on it. This instruction guide is intended to help you to enjoy your boat in comfort and safety. It includes the boat specifications, the equipment provided or installed, the systems on board and tips on her use and maintenance. We advise you to read this guide carefully before setting sail in order to take the greatest advantage of your sailing. Our network of LAGOON official retailers is entirely at your disposal in order to help you discovering your boat. They will be the most able to do the maintenance on your boat."},{"d":"UG","p":2,"pdf":4,"sec":"","t":"REJOIGNEZ LE CLUB LAGOON ! JOIN THE CLUB LAGOON! Vous venez d’acquérir un catamaran Lagoon ! Saviez-vous qu’un club de propriétaires existait ? En tant que propriétaire Lagoon, vous bénéficiez d’un accès exclusif à ce club. You have just purchased a Lagoon catamaran! Did you know that an owner club exists? As Lagoon owner, you get an exclusive access to this club. POURQUOI LE CLUB LAGOON ? Il s’inscrit dans la logique de la Lagoon Attitude qui nous est chère : entretenir des relations simples et amicales avec nos clients, leur proposer des rendezvous privilégiés, aller à leur rencontre. Avec le Club Lagoon, nous voulons concrétiser cet état d’esprit en vous faisant bénéficier de certains avantages. WHY JOIN CLUB LAGOON? The Club reflects the Lagoon Attitude that we value so highly: in other words, our desire to develop warm, open relations with our customers, organise special events for you and meet you in person. With Club Lagoon, we wish to follow through with this way of thinking by giving you access to some specific benefits. QUELS AVANTAGES POUR LES MEMBRES DU CLUB LAGOON ? En tant que membre du Club Lagoon, vous avez accès au site privé www. club-lagoon.fr : des informations sur le chantier, nos catamarans et nos événements, des fiches techniques, des invitations aux salons nautiques, une boutique privée, et des offres exclusives de nos partenaires (à voir sur le site !). WHAT BENEFITS DO CLUB LAGOON MEMBERS ENJOY? As a member of Club Lagoon, you can access the private website www.club-lagoon. fr: here you will find exclusive information about the shipyard, our catamarans and our events, technical documents, invitations to boat shows, an exclusive boutique and special offers from our partners (you can see them on the website). L’adhésion au Club Lagoon est simple et gratuite. Nous serons très heureux de vous y accueillir, alors n’hésitez plus, rendez-vous sur notre site pour vous inscrire. Club Lagoon membership is free and it couldn’t be simpler to join. We look forward to welcoming you to the Club, so go to our website to register. www.club-lagoon.fr"},{"d":"UG","p":3,"pdf":5,"sec":"","t":"PREAMBLE n This user guide is a tool that will enable you to get to know your boat and apprehend the use of the components that are necessary for running her. n A WAY TO MAKE THE MOST OF THIS USER GUIDE In order to have an easier apprehension, this guide offers you two complementary reading levels: . The pages with text on the right hand side of the document develop the different subjects dealt with in the chapters, . The pages on the left hand side are given to the related photos, layouts or block diagrams. n The different warnings used throughout this guide are as follows: RECOMMENDATION Shows a piece of advice to do the appropriate actions or manoeuvres adapted to what you are thinking of doing. WARNING Draws your attention on dangerous ways of doing that may bring about injuries to people or damages to the boat or her components. DANGER Warns you about the existence of a hazard that may have serious or fatal consequences if the appropriate precautions are not taken. n Before you put out to sea, please read the owner’s manual (CE standard manual) delivered with your boat and please follow the instructions."},{"d":"UG","p":5,"pdf":7,"sec":"","t":"CONTENTS 1. SPECIFICATIONS............................. page 7 1.1 I D of your boat 1.2 Technical specifications 1.3 Helm station 1.4 Electrical panel 2. HULL / DECK.................................. page 15 2.1 Construction 2.2 Careening - Dry harbour 2.3 Deck equipments 2.4 Cockpit 2.5 Gangway 2.6 Steering system 2.7 Anchoring 2.8 Deckwash pump 2.9 Davit 2.10 Solar panels 2.11 Access to helm station 3. RIGGING / SAILS............................ PAGE 29 3.1 Sailing 3.2 Standing rigging 3.3 Running rigging 3.4 Sails 4. ACCOMMODATIONS. .................... PAGE 43 4.1 Saloon - Galley 4.2 Lighting 4.3 Portholes - Deck hatches 4.4 Window blinds Code 178397 - Indice B 5. UTILITY ABOARD........................... PAGE 49 5.1 Refrigerators - Freezer
