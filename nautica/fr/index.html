        fr:[["Pannes : moteur, générateur qui ne démarre pas, frigo qui ne repart pas","panne"],["Sécurité : eau dans la cale, odeur de gaz, fumée","sécurité · première ligne : prévenir"],["Dégâts : choc, échouement, voile déchirée","dégât"],["Décisions commerciales : prolonger, remises, caution","commercial"]]}};
</script>
<script>(function(){
"use strict";
const D=window.DATA, $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const LANGS=["it","en","es","fr"];
let uiLang=(()=>{const s=localStorage.getItem("bs_lang");if(LANGS.includes(s))return s;const n=(navigator.language||"it").slice(0,2);return LANGS.includes(n)?n:"it";})();
const qs=new URLSearchParams(location.search);
const pathLang=(location.pathname.match(/\/(it|en|es|fr)\/?$/)||[])[1];
if(LANGS.includes(pathLang))uiLang=pathLang;
if(LANGS.includes(qs.get("lang")))uiLang=qs.get("lang");
const T=()=>UI[uiLang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s'-]/g," ").replace(/['-]/g," ").replace(/\s+/g," ").trim();
const DOCN={OM:"Owner's Manual",UG:"User's Guide"};
function citeLabel(c){const[d,p,pdf,sec]=c;const s=sec?" §"+sec.split(" ")[0]:"";return d+s+" · p."+p;}
function citeTitle(c){const[d,p,pdf,sec]=c;return DOCN[d]+(sec?" — "+sec:"")+" — "+T().open+" "+p+(d==="UG"?" (PDF "+pdf+")":"");}

/* ---------- plan ---------- */
function planSVG(){const t=T();return D.svg.replace("__PLAN_ARIA__",esc(t.aria)).replace("__L_BOW__",t.bow).replace("__L_PORT__",t.port).replace("__L_STBD__",t.stbd).replace("__L_SCALE__",t.scale);}
function zoneName(z){return (D.zones[z]||{})[uiLang]||z;}
function light(root,zones){root.querySelectorAll(".z").forEach(e=>{e.classList.remove("on");void e.getBBox;});
 requestAnimationFrame(()=>root.querySelectorAll(".z").forEach(e=>{if(zones.includes(e.dataset.z))e.classList.add("on");}));}
function highlight(zones,lang){light($("#plan"),zones);const t=UI[lang||uiLang];
 $("#plancap").innerHTML=zones.length?"<b>"+esc(t.highlighted)+":</b> "+zones.map(z=>esc((D.zones[z]||{})[lang||uiLang]||z)).join(" · "):esc(t.planHint);}
function renderPlan(){$("#plan").innerHTML=planSVG();$("#plancap").textContent=T().planHint;
 $$("#plan .z").forEach(e=>e.addEventListener("click",()=>{const z=e.dataset.z;highlight([z]);
   const rel=D.topics.filter(tp=>tp.zones.includes(z)&&tp.level!=="emergency"&&tp.level!=="refuse").slice(0,5);
   $("#plancap").innerHTML="<b>"+esc(zoneName(z))+"</b> — "+esc(T().zoneHere)+": "+rel.map(tp=>'<a href="#" data-t="'+tp.id+'">'+esc(tp.title[uiLang])+"</a>").join(" · ");
   $$("#plancap a").forEach(a=>a.addEventListener("click",ev=>{ev.preventDefault();const tp=D.topics.find(x=>x.id===a.dataset.t);ask(tp.q[uiLang],tp.id);}));}));}
function miniPlan(zones){const d=document.createElement("div");d.className="mini";d.innerHTML=planSVG();light(d,zones);return d;}

/* ---------- language detection ---------- */
const SW={it:"il lo la i gli le un una di del della dei delle che non come dove perche cosa quando si ci mi ho ha e il nel sulla sul per con acqua barca accendo funziona posso devo sono qual quale questo questa c'e ce entra odore puzza bagno allarme suona salpancora dov".split(" "),
 en:"the an is are how do does where what why when can i my it of to on in with won't wont doesn't not there boat turn work works which smell water coming we our you should there's s t please".split(" "),
 es:"el la los las un una de del que no como donde por que cuando se me mi es esta hay puedo tengo hace agua barco funciona enciendo olor huele cual sale entra bano y pon llevanos tenemos hacemos esto estan son".split(" "),
 fr:"le les une des du aux je tu il elle nous vous est sont pas avec dans sur pour qui quoi comment pourquoi quand cette cet mon ma mes ton votre notre bateau eau ou ne ca peux peut faut suis ouvre ferme de la et un".split(" ")};
function detect(q){const w=norm(q).split(" ");const sc={it:0,en:0,es:0,fr:0};
 for(const L of LANGS)for(const x of w)if(SW[L].includes(x))sc[L]++;
 if(/[¿¡ñ]/.test(q))sc.es+=2; if(/\b(perche|cos'|c'e|dov'e|l'acqua)\b/.test(q.toLowerCase()))sc.it+=2;
 if(/[œ«»]/.test(q)||/\b(qu'|c'est|n'est|j'|l'eau|d'eau|où|ça|bateau)\b/i.test(q))sc.fr+=2;
 if(/\bil y(?: a)?\b/.test(norm(q)))sc.fr+=2;
 const best=LANGS.slice().sort((a,b)=>sc[b]-sc[a]);
 return (sc[best[0]]>=2&&sc[best[0]]>=sc[best[1]]+2)?best[0]:null;}

/* ---------- curated matching ---------- */
const STOP=new Set(("il lo la i gli le un una di del della dei delle che non come dove perche cosa quando si ci mi ho ha e nel sulla sul per con qual quale questo questa sono "+
 "the a an is are how do does where what why when can i my it of to on in with not there which "+
 "el los las de que no como donde por cuando se me mi es esta hay puedo tengo hace cual al lo con para y o en un una "+
 "cos cose che chi qualcosa something algo funziona funzionano funciona funcionan work works working use uso usa usare usar posso puedo can come how dove where cosa what serve sirve fare hacer do does "+"le les une des aux nous vous sont pas avec dans pour qui quoi comment pourquoi quand cette peux peut faut etre fait etre sont").split(" "));
const toks=s=>norm(s).split(" ").filter(w=>w.length>2&&!STOP.has(w));
const TK=D.topics.map(tp=>{const set=new Set();for(const L of LANGS){toks(tp.kw[L]+" "+tp.q[L]+" "+tp.title[L]).forEach(w=>set.add(w));}return set;});
const DF={};TK.forEach(s=>s.forEach(w=>DF[w]=(DF[w]||0)+1));
function tokMatch(set,w){if(set.has(w))return w;if(w.length>=5)for(const k of set){if(k.length>=5&&(k.startsWith(w.slice(0,5))&&w.startsWith(k.slice(0,5))))return k;}return null;}
function matchTopic(q){const n=" "+norm(q)+" ";
 for(const [id,res] of D.emerg){for(const r of res)if(new RegExp(r).test(n))return {id,score:99};}
 for(const r of D.refuse)if(new RegExp(r).test(n))return {id:"refuse-nav",score:99};
 const w=toks(q);let best=null,bs=0,second=0;
 D.topics.forEach((tp,i)=>{if(tp.level==="emergency"||tp.level==="refuse")return;let s=0;const seen=new Set();
  for(const x of w){const k=tokMatch(TK[i],x);if(k&&!seen.has(k)){seen.add(k);s+=Math.log(1+D.topics.length/DF[k]);}}
  if(s>bs){second=bs;bs=s;best=tp.id;}else if(s>second)second=s;});
 return bs>=1.6?{id:best,score:bs}:null;}

/* ---------- BM25 over manual pages ---------- */
const DICT=D.dict;const PG=D.pages;const N=PG.length;const PT=PG.map(p=>toks(p.t));const AVG=PT.reduce((a,b)=>a+b.length,0)/N;const PDF_={};
PT.forEach(ts=>new Set(ts).forEach(w=>PDF_[w]=(PDF_[w]||0)+1));const TF=PT.map(ts=>{const m={};ts.forEach(w=>m[w]=(m[w]||0)+1);return m;});
function expand(q){const n=norm(q);const out=[];let s=" "+n+" ";
 for(const k of Object.keys(DICT).sort((a,b)=>b.length-a.length)){if(s.includes(" "+k+" ")){out.push(...DICT[k].split(" "));s=s.replace(" "+k+" "," ");}}
 return out.concat(toks(s)).filter(w=>w.length>2&&!STOP.has(w));}
function bm25(q){const terms=[...new Set(expand(q))].filter(w=>PDF_[w]);const k1=1.4,b=.75;
 const r=PG.map((p,i)=>{let s=0,hit=0;for(const w of terms){const f=TF[i][w]||0;if(!f)continue;hit++;const idf=Math.log(1+(N-PDF_[w]+.5)/(PDF_[w]+.5));s+=idf*f*(k1+1)/(f+k1*(1-b+b*PT[i].length/AVG));}return {i,s,hit};});
 r.sort((a,b)=>b.s-a.s);return {terms,top:r.slice(0,3)};}
function passage(text,terms,len){const words=text.split(" ");let best=0,bi=0;const tset=new Set(terms);
 for(let i=0;i<words.length;i+=4){let s=0;for(let j=i;j<Math.min(words.length,i+45);j++){const w=norm(words[j]);if(tset.has(w))s++;}if(s>best){best=s;bi=i;}}
 let out=words.slice(Math.max(0,bi-3),bi+(len||55)).join(" ");
 for(const t of terms){out=out.replace(new RegExp("\\b("+t+")\\b","ig"),"\u0001$1\u0002");}
 return esc(out).replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");}
function pageOf(c){return PG.find(p=>p.d===c[0]&&p.p===c[1]);}

/* ---------- rendering answers ---------- */
function escBar(level,t){const idx={normal:0,info:0,base:1,emergency:2}[level];if(idx===undefined)return "";
 return '<div class="esc" aria-label="escalation">'+t.lv.map((x,i)=>'<span class="l'+i+(i===idx?" on":"")+'">'+esc(x)+"</span>").join("")+"</div>";}
function citeChips(cites){return cites.map(c=>'<span class="cite" role="button" tabindex="0" title="'+esc(citeTitle(c))+'" data-c="'+c[0]+":"+c[1]+'">'+esc(citeLabel(c))+"</span>").join("");}
function bindCites(el,stepTexts){el.querySelectorAll(".cite").forEach(ch=>ch.addEventListener("click",ev=>{ev.stopPropagation();const [d,p]=ch.dataset.c.split(":");const c=[d,+p];const pg=pageOf(c);
  const holder=ch.closest("li")||ch.parentElement;let ex=holder.querySelector(".excerpt[data-c='"+ch.dataset.c+"']");if(ex){ex.remove();return;}
  const terms=toks((ch.dataset.terms||"")+" "+(holder.dataset.en||""));ex=document.createElement("div");ex.className="excerpt";ex.dataset.c=ch.dataset.c;
  ex.innerHTML="<small>"+esc(DOCN[d]+" · "+(pg.sec||"")+" · "+T().open+" "+pg.p+(d==="UG"?" (PDF "+pg.pdf+")":""))+"</small>"+passage(pg.t,terms,60)+"…";holder.appendChild(ex);}));}
function answerCurated(tp,L,detected){const t=UI[L];const card=document.createElement("div");card.className="a "+tp.level;
 const allZones=[...new Set(tp.steps.flatMap(s=>s[2]).concat(tp.zones))];let h="";
 if(tp.level==="emergency")h+='<div class="emerg" role="alert"><p>'+esc(tp.lead[L])+'</p><div class="calls"><span>'+esc(t.vhf)+'</span>'+(L==="it"?'<a href="tel:1530">'+esc(t.calls)+' 1530</a>':'')+'<a href="tel:112">'+esc(t.calls)+' 112</a></div></div>';
 if(tp.level==="refuse")h+='<span class="badge refuse">'+esc(t.refuse)+"</span>";
 if(tp.level==="info")h+='<span class="badge info">'+esc(t.info)+"</span>";
 h+=escBar(tp.level,t);h+="<h3>"+esc(tp.title[L])+"</h3>";
 if(tp.level!=="emergency")h+='<p class="lead">'+esc(tp.lead[L])+"</p>";
 h+='<ol class="steps">'+tp.steps.map((s,i)=>'<li data-ix="'+i+'" data-en="'+esc(s[0].en)+'">'+esc(s[0][L])+(s[1].length?"<br>"+citeChips(s[1]):"")+"</li>").join("")+"</ol>";
 if(tp.nocover)h+='<div class="nocover"><b>'+esc(t.nocoverT)+":</b> "+esc(tp.nocover[L])+"</div>";
 h+='<div class="meta">'+[detected?esc(t.detected)+": "+L.toUpperCase():"",esc(zoneListTxt(allZones,L))].filter(Boolean).join(" · ")+"</div>";
 card.innerHTML=h;if(allZones.length&&tp.level!=="refuse")card.insertBefore(miniPlan(allZones),card.querySelector("h3"));
 card.querySelectorAll("ol.steps li").forEach(li=>li.addEventListener("click",()=>{const z=tp.steps[+li.dataset.ix][2];card.querySelectorAll("li").forEach(x=>x.classList.remove("hl"));li.classList.add("hl");
   if(z.length){highlight(z,L);const m=card.querySelector(".mini");if(m)light(m,z);}}));
 bindCites(card);highlight(allZones,L);return card;}
function zoneListTxt(z,L){return z.length?(UI[L].highlighted+": "+z.map(x=>(D.zones[x]||{})[L]||x).join(" · ")):"";}
function answerSearch(q,L,detected){const t=UI[L];const r=bm25(q);const card=document.createElement("div");card.className="a";
 const top=r.top.filter(x=>x.s>0);const ok=top.length&&(top[0].s>=7||(top[0].s>=4.5&&top[0].hit>=2)||(r.terms.length===1&&top[0].hit===1&&top[0].s>=3));
 let h='<span class="badge search">'+esc(t.search)+"</span>";
 if(!ok){h+='<p class="lead">'+esc(t.notFound)+"</p>";card.innerHTML=h;return {card,topic:"nocover"};}
 h+="<p>"+esc(t.searchLead)+"</p>";
 top.filter(x=>x.s>=top[0].s*0.6).slice(0,2).forEach(x=>{const p=PG[x.i];h+='<div class="excerpt"><small>'+esc(DOCN[p.d]+" · "+(p.sec||"")+" · "+t.open+" "+p.p+(p.d==="UG"?" (PDF "+p.pdf+")":""))+"</small>"+passage(p.t,r.terms,60)+"…</div>";});
 h+='<div class="meta">'+(detected?esc(t.detected)+": "+L.toUpperCase()+" · ":"")+esc(t.searchNote)+"</div>";card.innerHTML=h;highlight([],L);return {card,topic:"manual"};}

/* ---------- ask ---------- */
function ask(q,forceId){q=(q||"").trim();if(!q)return;const det=detect(q);const L=det||uiLang;
 const u=document.createElement("div");u.className="u";u.textContent=q;$("#msgs").appendChild(u);
 const m=forceId?{id:forceId}:matchTopic(q);let card,topic;
 if(m){const tp=D.topics.find(x=>x.id===m.id);card=answerCurated(tp,L,det&&det!==uiLang);topic=tp.id;}
 else{const r=answerSearch(q,L,det&&det!==uiLang);card=r.card;topic=r.topic;}
 card.dataset.topic=topic;$("#msgs").appendChild(card);
 u.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
 window.bsTrack("/"+window.BS.slug+"/q-"+topic,"q-"+topic);}
window.__ask=ask;

/* ---------- checklists ---------- */
let ckCur=D.checklists[0].id;const ckDone={};
function renderCk(){const t=T();const ck=D.checklists.find(c=>c.id===ckCur);ckDone[ckCur]=ckDone[ckCur]||new Set();const done=ckDone[ckCur];
 $("#cktabs").innerHTML=D.checklists.map(c=>'<button aria-pressed="'+(c.id===ckCur)+'" data-c="'+c.id+'">'+esc(c.title[uiLang])+"</button>").join("")+
  '<button class="nightbtn" id="nightbtn2" aria-pressed="'+document.body.classList.contains("night")+'">'+esc(document.body.classList.contains("night")?t.nightOn:t.night)+"</button>";
 $$("#cktabs button[data-c]").forEach(b=>b.addEventListener("click",()=>{ckCur=b.dataset.c;renderCk();}));
 $("#nightbtn2").addEventListener("click",toggleNight);
 $("#cksub").textContent=ck.sub[uiLang]+" · "+done.size+" "+t.of+" "+ck.items.length;
 $("#cklist").innerHTML=ck.items.map((it,i)=>'<li data-ix="'+i+'" data-en="'+esc(it[0].en)+'" class="'+(done.has(i)?"done":"")+'"><span class="box">'+(done.has(i)?"✓":"")+'</span><span class="tx">'+esc(it[0][uiLang])+"<br>"+citeChips(it[1].map(c=>D.cmap[c[0]+":"+c[1]]))+"</span></li>").join("");
 const mp=$("#ckmini");mp.innerHTML="";const mini=miniPlan([]);mp.appendChild(mini);
 $$("#cklist li").forEach(li=>li.addEventListener("click",()=>{const i=+li.dataset.ix;done.has(i)?done.delete(i):done.add(i);const z=ck.items[i][2];
   renderCk();const nl=$('#cklist li[data-ix="'+i+'"]');nl.classList.add("cur");light($("#ckmini .mini"),z);highlight(z);}));
 bindCites($("#cklist"));}

/* ---------- night mode ---------- */
function toggleNight(){const on=!document.body.classList.contains("night");document.body.classList.toggle("night",on);localStorage.setItem("bs_night",on?"1":"0");
 $("#nightbtn").setAttribute("aria-pressed",on);renderCk();const mc=document.querySelector('meta[name=theme-color]');if(mc)mc.content=on?"#000000":"#0E2A3B";}

/* ---------- KB section ---------- */
function renderKB(){const t=T();$("#kbmsgs").innerHTML=KB_MSGS.map(m=>'<div class="bub '+m.g+'"><div class="who"><span>'+m.ch+" · "+m.t+'</span><span class="ex">'+esc(t.ex)+"</span></div>"+esc(m.m)+"</div>").join("");
 $("#kbflow").innerHTML=t.flow.map(f=>"<li><b>"+esc(f[0])+"</b>"+esc(f[1])+"</li>").join("");
 $("#kbcl").innerHTML=KB_CLUSTERS.map(c=>'<div class="cl"><div class="n" data-n="'+c.n+'">0<small>'+esc(t.times)+'</small></div><div class="q">'+esc(c.q[uiLang])+'</div><span class="st '+c.s+'">'+esc(t.st[c.s])+"</span></div>").join("");
 const lane=(k)=>KB_LANES[k][uiLang].map(x=>"<li>"+esc(x[0])+" <i>· "+esc(x[1])+"</i></li>").join("");
 $("#laneA").innerHTML=lane("agent");$("#laneH").innerHTML=lane("human");
 $("#kbtot").innerHTML=[["msgs",{it:"messaggi",en:"messages",es:"mensajes",fr:"messages"}],["groups",{it:"gruppi",en:"groups",es:"grupos",fr:"groupes"}],["approved",{it:"risposte approvate",en:"approved answers",es:"respuestas aprobadas",fr:"réponses approuvées"}]].map(x=>'<span><b data-n="'+KB_TOTALS[x[0]]+'">0</b> '+x[1][uiLang]+"</span>").join(" · ");
 animateKB();}
let kbSeen=false;
function animateKB(force){const run=()=>{$$("#kbmsgs .bub").forEach((b,i)=>setTimeout(()=>b.classList.add("in"),force?0:i*350));
  $$("#kbflow li").forEach((li,i)=>setTimeout(()=>li.classList.add("on"),force?0:400+i*450));
  $$("[data-n]").forEach(el=>{const n=+el.dataset.n,small=el.querySelector("small");const fmt=v=>v.toLocaleString(uiLang==="en"?"en":uiLang==="fr"?"fr":"it");const st=performance.now(),dur=force?0:1400;
   const tick=now=>{const k=dur?Math.min(1,(now-st)/dur):1;el.firstChild.nodeValue=fmt(Math.round(n*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(tick);};
   if(!el.firstChild||el.firstChild.nodeType!==3)el.insertBefore(document.createTextNode("0"),el.firstChild);requestAnimationFrame(tick);});};
 if(force||kbSeen||!("IntersectionObserver" in window)){run();return;}
 const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){kbSeen=true;io.disconnect();run();}},{threshold:.15});io.observe($("#kb"));}
window.__kbNow=()=>animateKB(true);

/* ---------- i18n static ---------- */
function applyLang(){const t=T();document.documentElement.lang=uiLang;document.title="Lagoon 42 · "+t.tagline.split(" · ")[0]+" · BOLLA STUDIO";$$("[data-i]").forEach(e=>{e.textContent=t[e.dataset.i];});
 $("#q").placeholder=t.ask;$("#sendbtn").textContent=t.send;$$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===uiLang));
 $("#nightbtn").title=t.night;$("#nightbtn").setAttribute("aria-label",t.night);
 $("#chips").innerHTML=D.chips.map(id=>{const tp=D.topics.find(x=>x.id===id);return '<button class="chip" data-t="'+id+'">'+esc(tp.q[uiLang])+"</button>";}).join("");
 $$("#chips .chip").forEach(b=>b.addEventListener("click",()=>{const tp=D.topics.find(x=>x.id===b.dataset.t);ask(tp.q[uiLang],tp.id);}));
 renderPlan();renderCk();renderKB();}
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{uiLang=b.dataset.l;localStorage.setItem("bs_lang",uiLang);applyLang();}));
$("#nightbtn").addEventListener("click",toggleNight);
$("#askf").addEventListener("submit",e=>{e.preventDefault();const v=$("#q").value;$("#q").value="";ask(v);});
if(localStorage.getItem("bs_night")==="1")document.body.classList.add("night");
$("#nightbtn").setAttribute("aria-pressed",document.body.classList.contains("night"));
applyLang();
})();
