ey must be secured so there is no danger of them falling on machinery and they do not obstruct access to and from the compartment. 7 - The CO2 extinguishers must only be used only to fight electrical fires 7.4.2 Smoke alarm General points - The smoke detector is a photoelectric detector which operates with a 9 V alkaline battery (battery included). - The detector emits a flashing red light every minute in normal operation. - The smoke detector is designed to operate between 0° and + 50°C. - Whenever any smoke is detected, the 85 dB alarm is triggered. - The smoke detector is not designed to stop a fire from breaking out. It serves to warn the people onboard of the danger. - The detector is a device which warns people onboard in the event of smoke. Actions to take if the alarm is triggered: The skipper should check the source of the smokeand attempt to extinguish the fire with the resources at his/her disposal. If the fire spreads, the skipper must immediately evacuate the entire crew. - The service life of the smoke detector is approximately 10 years. Beyond 10 years, replace the smoke detector with an identical device. 69  - The smoke detector is not a gas detector. - The smoke detector is sensitive to dust and steam: avoid exposing the detector to these environments to prevent the triggering of unwanted alarms. - Never use a rechargeable battery. - Never trigger the alarm deliberately to check the operation of the detector. - A dirty detector may activate incorrectly or late. It is important to clean each detector for the safety of people onboard. - Never cover the smoke detector (with paint or ceiling panels, for example) and in general do not alter the appearance of the detector. - Do not fit the smoke detector in a different location from the one specified for the purpose. Information relating to fire risks and risks of explosion - The fire exits other than the door or main companionway are identified by the following symbol:"},{"d":"OM","p":70,"pdf":70,"sec":"7.4.2 Smoke alarm","t":"Commissioning of the boat - When the boat is first delivered, ensure that the battery protector is removed. Maintenance The smoke detector must be routinely tested when boarding or weekly if staying onboard for a prolonged period of time. If the device is faulty, change the battery. If the device is still faulty after changing the battery, replace the detector with the same model (consult your dealer). TEST button - Regularly check that each detector is working correctly by pressing and holding the device's TEST button for around ten seconds: - The detector's light flashes, then the alarm starts up. NOTE: The alarm emits are very loud noise (approximately 94 dB at one metre), remember to use hearing protection during the test. - When the TEST button is released, the alarm stops immediately. 70 Information relating to fire risks and risks of explosion "},{"d":"OM","p":71,"pdf":71,"sec":"7.4.2 Smoke alarm","t":"Changing the battery - The smoke detecter will emit an audible beep every minute for a month when the battery level is too low to operate. - In that case, change the battery as described below: - Remove the detector from its mounting (turn anti-clockwise), remove the empty battery and replace it with the same model of alkaline 9 V battery, ensuring a battery life of 5 years. - Connect the battery as shown in its housing (ensure the battery polarity +/- is correct). - Return the detector to its mounting (turn clockwise) until it fits perfectly. Annual routine maintenance - Remove the detector from its housing (turn anti-clockwise) and clean the vents on the side of the device with a vacuum cleaner or a soft brush. Winterisation - To ensure optimal operation, it is recommended that the smoke detector is stored for winter in a fresh and well-ventilated place, having removed the battery. - Once one person is onboard, it is important to replace the smoke detector in the position specified for the purpose, having first reinstalled the battery. 71  Information relating to fire risks and risks of explosion 7 - Use a damp cloth to clean the exterior of the detector cover."},{"d":"OM","p":72,"pdf":72,"sec":"7.4.3 Extinguisher discharge hole","t":"7.4.3 Extinguisher discharge hole The engine compartment has a port that makes it possible to discharge the extinguishing product inside without opening the usual access hatches. Location of the fire extinguisher port Access: Port aft cabin & Starboard A pictogram allows for easy location. 72 Information relating to fire risks and risks of explosion "},{"d":"OM","p":73,"pdf":73,"sec":"7.5 Emergency Exits In Case Of Fire","t":"7.5 EMERGENCY EXITS IN CASE OF FIRE - Think unlock the hatch (located in the front cabin) before using the boat. This should allow opening of the hatch by a person from the outside. Information relating to fire risks and risks of explosion 7 73 "},{"d":"OM","p":74,"pdf":74,"sec":"7.6 In The Event Of Capsize","t":"7.6 IN THE EVENT OF CAPSIZE Use the hammer located next to the panel (or in the trunk of the life raft) to break the glass. Passageway Skipper's cabin Emmergency hammer Do not use the skipper cabin whilst under way. The life-rafts are accessible on the transom (see the beginning of the chapter). 74 Information relating to fire risks and risks of explosion "},{"d":"OM","p":75,"pdf":75,"sec":"7.6 In The Event Of Capsize","t":"8 ELECTRICAL SYSTEM General information about the electrical system .......................... 76 DC installation (12 V or 24 V)........................................................... 79 AC system (110 v or 220 v) .............................................................. 93 Protection against electrolysis / Earth plate................................ 101 75 8"},{"d":"OM","p":76,"pdf":76,"sec":"8.1 General Information About The Electrical System","t":"8.1 GENERAL INFORMATION ABOUT THE ELECTRICAL SYSTEM - A risk of fire or explosion may result from careless use of the DC and AC systems. - A risk of electrocution may result from careless use of the AC system. NEVER: - work on a live electrical system; - modify the elecrical system of the vessel or the relevant diagrams: It is important that installation, maintenance and any modifications be carried out by a qualified marine electrician; - change or modify the strength of the safety devices protecting against power surges; - install or replace electrical equipment or materials with components which exceed the system's nominal electrical power capacity; - leave the boat unsupervised when the electrical system is live, apart from when the automatic bilge pump and the boat's fire protection and security system are in use (where installed). Electrical connections change over time. It is necessary to have the boat's electrics checked regularly and at least once every two years by a professional. Special attention should be paid to the tightness of the electrical connections. 76 Electrical system "},{"d":"OM","p":77,"pdf":77,"sec":"8.1 General Information About The Electrical System","t":"Electrical system 8 Reference Designation 1 Battery switches, Coupling, Power distributor 2 Port engine battery 3 Starboard engine battery 4 Battery switches, General fuse (12V) 5 Service batteries 6 Battery chargers, Power distributor 7 Electrical panel, Voltmeter 8 DC breakers 9 Generator battery 77 "},{"d":"OM","p":78,"pdf":78,"sec":"8.2 Diagram Of Layout","t":"8.2 DIAGRAM OF LAYOUT FKDUJHXU ;8 ! ;M ! 0 0 0 0\" 0 ;' -, 0 FKDUJHXU 0 - ;& ;+ ;% ! ;/ ! \" % % % ;L 78 Electrical system "},{"d":"OM","p":79,"pdf":79,"sec":"8.3 Dc Installation (12 V Or 24 V)","t":"8.3 DC INSTALLATION (12 V OR 24 V) 8.3.1 Battery use and distribution General points The boat is equipped with a direct current electrical system. The boat's electrical system comprises service batteries and the engine battery or batteries. The service batteries serve as the power supply for all the boat's electrical components. The \"engine\" battery is used only for powering the electric starter of the propulsion engine. The boat may also be equipped with: - a generator powered by its own battery; the batteries are charged either by a load distributor or: 8 - by the alternator linked to the engine when the engine is running, Electrical system - by the battery charger (where installed). It is essential that a professional engineer connects the batteries when the boat is first launched. Always check the condition of the batteries and charge system before putting to sea. The battery banks are isolated from one another by a charge divider (see below). Battery bank (standard) Engine battery: 2 x 110A Service batteries: 2 x 140A Spare service batteries: 2 x 140A 79  Generator battery: 1 x 110A"},{"d":"OM","p":80,"pdf":80,"sec":"8.3.1 Battery use and distribution","t":"Gel battery pack (optional) - Service batteries: 4 x 120A - Engine battery: 2 x 50A Maintenance - Keep the batteries clean and dry. - Regularly check that the terminals and connection cables are clean. If necessary, apply a thin coating of paraffin on the terminals to prevent corrosion. - Regularly recharge all of the batteries onboard. - All work carried out on a battery must only be carried out by someone qualified to do so. Whenever working on a battery, wear safety goggles and protective clothing. - Never smoke or produce a spark near a battery: this may cause an explosion. - Keep the batteries charged at all times: this will improve their lifespan. - Avoid long periods of electrical inactivity (for example when wintering the boat). Maintenance of lead batteries - Check the water levels in the batteries annually and top them up with distilled water if they are low. - Keep all metallic objects away from the batteries. - Lead batteries contain sulphuric acid: be careful not to knock them over whenever handling them. - If any acid accidentally splashes on your skin or in your eyes, rinse it off immediately and thoroughly with fresh water. See a doctor immediately. - Never touch the battery terminals: you may suffer an electric shock. - Refer to the manufacturer's instructions for use and maintenance. Charge controller - Batteries Control screen - IT IS ESSENTIAL THAT YOU DISCONNECT THE BATTERY CHARGER BEFORE DISCONNECTING THE BATTERY TERMINALS FOR MAINTENANCE (EITHER BY DISCONNECTING THE AC SHORE POWER SOCKET OR BY CUTTING THE AC CIRCUIT BREAKER OF THE BATTERY CHARGER). Location: Saloon 80 Electrical system "},{"d":"OM","p":81,"pdf":81,"sec":"8.3.1 Battery use and distribution","t":"Maintenance of watertight batteries - This type of battery needs no maintenance and does not produce any gas during normal use. No ventilation is needed. - The optimum temperature for use is between 10°C and 30°C. Lower temperatures will reduce the available capacity. Higher temperatures will increase the batteries' self-discharge rate. - Turn off all battery isolators before leaving the vessel: failure to do so may result in critical damage to the entire battery bank. - Avoid touching the battery isolators when they are live. - Never open watertight batteries. - Never add acid or distilled water. - The pressure valves are used to seal the batteries and cannot be opened without being permanently broken. - If the batteries overheat, a build-up of gas may develop: stay away from the batteries. - Never switch off the battery isolators when the boat's engine is running (risk of serious damage to the charging circuit). Electrical system 8 81 "},{"d":"OM","p":82,"pdf":82,"sec":"8.3.2 Battery switches","t":"8.3.2 Battery switches - Manual battery switches: to make the system live, manually turn the positive and negative battery isolator switches. Positive isolator switch Negative isolator switch Port engine compartment Starboard engine compartment 4. Battery breaker - \"positive terminal engine\" - Starboard 5. Common battery negative isolator 6. Battery switch \"service positive\" 1. Battery breaker - \"positive terminal engine\" - Port 2. Common battery negative isolator 3. Connection of the battery bank 82 Electrical system "},{"d":"OM","p":83,"pdf":83,"sec":"8.3.3 Power distributor","t":"8.3.3 Power distributor - The electronic charge dividers isolate the battery banks from each other and allow the charge to be directed automatically to the battery with the lowest charge. They provide the advantage of preventing a drop in voltage. - The charge divider is electronic. It is designed to distribute the charging current with a low voltage drop between the battery banks (engine and service batteries). It prevents the current from circulating from one battery to another. When the voltage of the charger or alternator is available, the charge divider indicator lights up green. Power: 150A Location: Port and starboard engine compartment Electrical system 8 8.3.4 Connection of the battery bank If one of the engine batteries is low on power, use the battery link function by actuating the linking system. Location: Port aft cabin Coupling handle Put the handle in the emplacement provided. Turn the handle to connect the coupling circuit when starting the engine. Remove the handle once the engine is running. 83 "},{"d":"OM","p":84,"pdf":84,"sec":"8.3.5 Battery charger","t":"8.3.5 Battery charger General points - The battery charger runs on AC power. - A breaker protects the electrical circuit. - The battery charger charges all of the batteries onboard while keeping the service battery bank isolated from the engine's battery bank. Capacity: 2 x 40A Location: Starboard engine compartment IT IS ESSENTIAL THAT YOU DISCONNECT THE BATTERY CHARGER BEFORE DISCONNECTING THE BATTERY TERMINALS FOR MAINTENANCE (EITHER BY DISCONNECTING THE AC SHORE POWER SOCKET OR BY CUTTING THE AC CIRCUIT BREAKER OF THE BATTERY CHARGER). Operation - The charger runs fully automatically. It can stay permanently connected to the batteries and does not need to be disconnected when starting the engine. - In some electrical circuits, there may be battery chargers coupled in parallel. Maintenance - Before doing any maintenance, cut the AC supply. - Regularly vacuum out any dust particles which may accumulate in the charger. An annual check of the tightness of the nuts and bolts is necessary to ensure the correct operation of the charger. 84 Electrical system "},{"d":"OM","p":85,"pdf":85,"sec":"8.3.6 Layout of hull wiring looms - DC circuit","t":"8.3.6 Layout of hull wiring looms - DC circuit 8 Electrical system 3'&7 85 "},{"d":"OM","p":86,"pdf":86,"sec":"8.3.7 Layout of deck wiring looms - DC circuit","t":"8.3.7 Layout of deck wiring looms - DC circuit 86 Electrical system "},{"d":"OM","p":87,"pdf":87,"sec":"8.3.8 Layout of roof wiring looms - DC circuit","t":"8.3.8 Layout of roof wiring looms - DC circuit 1 8 Electrical system 87 "},{"d":"OM","p":88,"pdf":88,"sec":"8.3.9 Electrical panel","t":"8.3.9 Electrical panel Location: Starboard passageway 100 10.4V 200 300 0 V 10 OFF ECLAIRAGE INT. CABIN LIGHTS 12.5 15 BORD ELECT. NAVIGATION NAV. INSTRUMENTS GROUPE FROID FRIDGE UNIT UX. ECLAIRAGE PONT DECK FLOODLIGHT AUXILIAIRE AUXILARY ON ON OFF ON O CHAUFFE-EAU WATER HEATER OFF O A C FEU DE MOUILLAGE ANCHOR LIGHT GROUPE D'EAU WATER PUMP CHARGEUR BATTERIE BATTERY CHARGER AUTO ON OFF ON ON OFF O 2 1 PRISES AC AC PLUGS PRISES AC AC PLUGS AC power 12V DC 10A MAX FEUX MOTEUR STEAMING LIGHTS POMPE DE CALE BILGE PUMP Scheiber 230 V AC FEUX DE NAV. NAV. LIGHTS Reverse polarity 12 V DC 88 Electrical system "},{"d":"OM","p":89,"pdf":89,"sec":"8.3.9 Electrical panel","t":"Designation 1 Electrical panel 2 Multi-function display 3 Change over switch - voltmeter inlet / Water gauge / Fuel oil gauge 4 Contrast selector 5 Voltmeter selector 6 Water meter selector 7 Fuel meter selector 8 12V DC socket electrical panel 18 \"Interior lighting\" general circuit-breaker 19 \"Navigation light/ engine light\" switch 21 \"Anchor light\" switch 22 \"Deck lighting\" switch 23 \"Auxiliary\" switch (option) 24 \"Navigation electronics\" switch 25 Switch - bilge pump 26 Switch - water unit 27 \"Refrigerated unit\" switch A6 bipolar circuit breaker \"water heater\" A7 bipolar circuit breaker \"battery charger\" A8 Bipolar circuit breaker \"AC sockets\" A10 Live shore power line warning light - \"Shore Power\" A11 Warning light - reversal of polarity A12 Voltmeter 89  8 Electrical system Reference"},{"d":"OM","p":90,"pdf":90,"sec":"8.3.10 Circuit breakers","t":"8.3.10 Circuit breakers A circuit-breaker can be reset (manually press the black button to restart it). Location: Saloon (Under map table) 3-cabin layout \" + \" + \" + +- 4-cabin layout 0 \" 0 When replacing fuses/circuit-breakers, always ensure replacements are of the correct capacity (see the colour-codes). \" + \" + \" + +- 0 \" 0 90 Electrical system "},{"d":"OM","p":91,"pdf":91,"sec":"8.3.10 Circuit breakers","t":"Designation 1 Lighting: Port forward 2 Lighting: Port aft 3 3-cabin layout: Lighting: forward / Starboard centre 4 Lighting: Starboard aft 5 Lighting: Starboard side 6 Lighting: Starboard centre 7 3-cabin layout: Shower pumps: Starboard forward 8 Shower pumps: forward / Port aft 9 Pump for deck washing 10 HiFi - saloon 11 Port electric bilge pump 12 Starboard electric bilge pump 13 12V socket: Cabins - forward / Port aft 14 12V socket: Cockpit & Electrical panel 15 12V socket: Cabins - forward / Starboard aft 16 VHF / AIS 17 Cooler 18 Fridge in cockpit 19 Electric windlass 20 Ventilators: Cabins - forward / Port aft 21 Ventilators: Central - Port / Starboard 22 Ventilators: Cabins - forward / Starboard aft 23 TV Antenna 24 3-cabin layout: Hifi - AFT owner's cabin 25 Electric toilet - Port 26 Electric toilet - Starboard 4-cabin layout: Shower pumps: Central / Starboard aft 4-cabin layout: Unused 91  4-cabin layout: Lighting: forward / Central - Starboard aft 8 Electrical system Reference"},{"d":"OM","p":92,"pdf":92,"sec":"8.3.11 Fuses","t":"Location: Starboard engine compartment 1. Breaker - Solar panels Location: Starboard passageway 2. Breaker - Electric windlass 3. Breaker - Port electric primary winch 4. Breaker - DC/AC converter 8.3.11 Fuses - A fuse protects an electrical circuit from excess current. If it blows, you must replace it with another fuse of the same rating. General circuit fuse - 12V Location: Starboard engine compartment 92 Electrical system "},{"d":"OM","p":93,"pdf":93,"sec":"8.4 AC system (110 V or 220 V)","t":"8.4 AC SYSTEM (110 V OR 220 V) If a DC/AC converter is fitted on board: it is essential to switch off the DC and AC circuits before working on the cabin AC sockets. 8.4.1 General points - The boat is equipped with an alternating current electrical system. - The electrical system of the boat consists of an AC shore socket and if appropriate: - Never let the end of the boat/shore supply cable hang in the water: This may result in an electric field that could injure or kill nearby swimmers. - 1 DC/AC converter. - The AC electrical system is used to power the following components (where installed): - Air conditioning, - Household appliances, - Incorrect use of alternating current systems will result in a danger of electrouction. - Do not work on a live AC system. To reduce the risk of electric shock and fire: - Water heater, - Interior AC sockets, - Battery charger(s). Guidelines for using the AC electrical system correctly - Do not modify the vessel's electrical installations or the relevant diagrams. Installation, maintenance and modifications must be carried out by an electrician qualified in marine electricity. Have all electrical installations checked (tightening and connections) every year. - Disconnect the boat's shore power when the system is not in use. - Connect the relay boxes or metal casings of the installed electrical equipment to the boat's protective conductor (green or green with yellow stripe). - Turn off the shore supply with the onboard cut-off switch before connecting or disconnecting the vessel/shore supply line. - Connect the boat/shore power cable on the boat before plugging it into the socket onshore. - Disconnect the boat/shore power cable at the shore socket first. - If the reverse polarity indicator is activated immediately disconnect the cable. - After using the socket onshore, close its protective cover tightly. - Do not modify the connections of the boat/shore power cable: only use compatible connections. DO NOT MODIFY THE CONNECTIONS OF THE BOAT/ SHORE POWER CABLE. - Use double-insulated or earthed appliances. - If the reverse polarity indicator is activated, do not use the electrical installation. Rectify the polarity fault before using the vessel's electrical installation (this applies only to polarised circuits with a polarity indicator). Electrical connections change over time. It is necessary to have the boat's electrics checked regularly and at least once every two years by a professional. Special attention should be paid to the tightness of the electrical connections. Every month, you are advised to test the circuit breaker or residual current differential switch, recognisable by its \"test\" button. 93  8 Electrical system - 1 Generator,"},{"d":"OM","p":94,"pdf":94,"sec":"8.4.2 AC shore socket","t":"8.4.2 AC shore socket LOCATION OF COMPONENTS Ref 1: AC shore socket - General Ref 2 (Europe Version): Bipolar circuit breaker (Protection) Ref 2 (US Version) Ref 3: Differential switch - On-board AC (Operation) 1. Bipolar circuit breaker - onboard & Air conditioning 2. Galvanic isolator Operation - First plug the extension cable into the AC socket on the boat, then into the socket onshore. - First unplug the extension cable from the socket onshore, then from the AC socket on the boat. 94 Electrical system "},{"d":"OM","p":95,"pdf":95,"sec":"8.4.3 Diagram of layout","t":"8.4.3 Diagram of layout AC ELECTRICAL SYSTEM Europe Version & Brazil Version 1 1 JDOYDQLF LVRODWRU 1 + F + ; ; : : ; : : : : A:( : ; ;; ; ;; A:( -% & : - : - C) : : ; ; ; ; ; : : : - C) ; ; ; ; ; ; ; ;; ;; - ; + : F + Electrical system 1 8 1 1 1 : 1 : 1 : 1 US Version -% & \" \" \" -% % C \" ? C \" -% % ? \" ? C ? C 95 "},{"d":"OM","p":96,"pdf":96,"sec":"8.4.4 DC/AC converter","t":"8.4.4 DC/AC converter Description - The inverter converts the DC voltage of the service battery bank to AC voltage. The circuit between the inverter and the batteries is protected by a fuse or a circuit-breaker. - The inverter is earthed by an earthing plate located under the hull (see Chapter: EARTHING PLATES). Operation Power supply for the 220V AC electric sockets in the cabins: Once there is sufficient nominal voltage coming from the AC switch panel, AC power is supplied by the onshore socket or by the generator. If there is insufficient nominal voltage coming from the AC switch panel, the AC power supply automatically switches over to the inverter. In this way, the power for the 220V sockets in the cabins can be supplied by the inverter, itself supplied by the service battery bank. Be careful to disconnect the inverter circuit to prevent the AC power supply automatically switching over and to prevent accidental discharge of the service battery bank. This can be done by: - setting the inverter's circuit-breaker to the OFF position; or, - setting the switch located on the inverter to the OFF position. Simply cutting the AC power supply at the switch panel does not cut the AC power supply to the cabins: it is also necessary to disconnect the DC supply. Operation - The inverter is fully automatic. - A remote control is located near the boat's switch panel. To start the converter put the switch on the invertor in the \"REMOTE\" position then put the switch located on the remote control in the \"ON\" position. - If the switch on the inverter is in the \"OFF\" position, you cannot use the remote control to start it. - The DC/AC converter operates by default when shore power is not supplied. It is controlled by a relay connected to the shore power supply. This converter powers the indoor sockets and some onboard appliances. - When shore power is not connected, the relay automatically connects the inverter to a part of the onboard AC circuit. - When the shore power socket is plugged in and powered, the relay automatically disconnects the inverter. 96 Electrical system "},{"d":"OM","p":97,"pdf":97,"sec":"8.4.4 DC/AC converter","t":"Maintenance - Check at least once a year that the inverter cables and connections are securely tightened. - Clean the inverter by removing any accumulated dust to ensure good ventilation. Control located on the equipment Remote control Location: Saloon Refer to the manufacturer's instructions for use and maintenance. NEVER: - connect the inverter AC lead to an AC terminal or to the onboard generator. - disconnect the wiring from the inverter when in use. - open the inverter. LAYOUT OF COMPONENTS: STARBOARD PASSAGEWAY Bipolar circuit breaker DC/AC converter 97  Electrical system 8"},{"d":"OM","p":98,"pdf":98,"sec":"8.4.5 Bundles installation - Hull - AC circuit","t":"8.4.5 Bundles installation - Hull - AC circuit &( FRQY 34 98 Electrical system "},{"d":"OM","p":99,"pdf":99,"sec":"8.4.6 AC breakers","t":"8.4.6 AC breakers Location: Starboard passageway AC elements - onboard AA AB AC 230 AC 12 DC from left to right: 2 MODULE VIDE C 10 C 10 C 16 C 16 1. Charger - Generator 2. Washer 3. Ice maker 4. Watermaker MODULE VIDE MODULE VIDE MODULE VIDE 99  Electrical system 8"},{"d":"OM","p":100,"pdf":100,"sec":"8.4.6 AC breakers","t":"Air conditioning: 1 2 1 H1 H2 2 3 H5 4 H8 from left to right: C 6 C 6 C 16 C 10 C 10 C 10 4CL 4CL 3CL 3CL 2CL 2CL 1CL 1CL PCL2 PCL2 PCL1 PCL1 B1 B2 B3 B4 B5 B6 B7 B8 B9 B10B11 B12B13 B14 1. Mains power 2. Seawater pump (Port) 3. Seawater pump (Starboard) 4. Compressor (Port forward) 5. Compressor (Saloon) 6. Compressor (Port aft) 7. Compressor (Starboard aft) 100 Electrical system "},{"d":"OM","p":101,"pdf":101,"sec":"8.5 Protection Against Electrolysis / Earth Plate","t":"8.5 PROTECTION AGAINST ELECTROLYSIS / EARTH PLATE - Never cover the anodes in antifoul. 8.5.1 Anodes General points - The sacrificial anode protects the submerged elements of the boat against electrolysis. - A sacrificial anode is a consumable part that protects submerged metal parts by its dissolution (oxidation). The anodes used are made of a metal that is more readily reductive than the metal they are protecting. - During the first few weeks that the boat is in the water, check the anodes and replace them if necessary: they erode very rapidly during this period. - On a new boat, all the underwater metallic components seek to reach the same electric potential, which leads to the rapid deterioration of the anodes during the first few weeks in the water. - You can put several anodes on the hull. - At least 2 times a year, check the corrosion on all of the anodes. Change the anode if necessary (Before it has lost 50% of its weight). - Use the appropriate anodes for the cruising area: magnesium anodes for fresh water; zinc anodes for seawater. - When the boat is kept in a dry dock, a light deposit of dust will settle on the anodes: clean the anodes before relaunching. Cleaning anodes - Use emery paper. Do not use metal brushes or steel tools to clean the boat as this may damage the galvanic protection. 101  Electrical system 8 Maintenance"},{"d":"OM","p":102,"pdf":102,"sec":"8.5.1 Anodes","t":"Replacing the anodes - The anodes are fastened with screws and nuts. First, remove the screws and nuts that hold the anode, then clean the contact surface. Press the new anode to obtain a good electrical contact. - Change all the anodes every year. General anode Location: Starboard engine compartment Propeller anode & Base Location: Base 102 Electrical system "},{"d":"OM","p":103,"pdf":103,"sec":"8.5.2 Earthing plates","t":"8.5.2 Earthing plates - An earthing plate is a shot-peened plate mounted on the hull to recreate an earth neutral point on the electrical circuit of the equipment supplying AC power (generator and AC/DC convertor). The earthing plate earths this equipment. - Never antifoul over the earthing plates. The earthing plate is not an anode: it must not be allowed to deteriorate. - If the earthing plate deteriorates, consult a professional immediately to determine the cause. Because it is mounted across the hull below the waterline, deterioration of the earthing plate puts the boat at risk of sinking. Outside view Location: Starboard hull Inside view Location: Starboard passageway Electrical system 8 103 "},{"d":"OM","p":105,"pdf":105,"sec":"8.5.2 Earthing plates","t":"9 LIQUEFIED PETROLEUM GAS (LPG) SYSTEM General points ................................................................................ 106 Operation of the LPG system ........................................................ 108 Verification of the LPG system ..................................................... 108 Diagram of layout ........................................................................... 111 105 9"},{"d":"OM","p":106,"pdf":106,"sec":"9.1 General Points","t":"9.1 GENERAL POINTS - The working pressure of the LPG unit is 28 millibars. - Recommended cylinder capacity: Europe Version: 2,75 kg of butane. US Version: 10 lb of propane. - Have the hoses, the entire LPG system and the flue pipes in the LPG system inspected professionally and regularly (or at intervals determined by the national requirements of the country in which the boat sails), and have them replaced if damage is detected. - Taps attached to empty cylinders must be closed and disconnected. Protective covers, lids or caps must be held in place. Spare bottles must be stored outside on the boat and protected from weather and mechanical damage. If a gas leak occurs, it is essential that the gas escapes outside. - Do not impede access to the components of the LPG system. - Do not use the housings or the LPG bottle lockers to store other equipment. - Check the vent pipes at least once a year. Replace them if they have deteriorated or split. 106 Liquefied Petroleum Gas (LPG) System "},{"d":"OM","p":107,"pdf":107,"sec":"9.1 General Points","t":"Location of components 107  Designation 1 Gas cylinder locker 2 Thru-hull fitting 3 Drain 4 Gas system 5 Gas supply valve 6 Bubble tester 7 bubble gas leak detector 8 Gas cylinder 9 Liquefied Petroleum Gas (LPG) System Reference"},{"d":"OM","p":108,"pdf":108,"sec":"9.2 Operation Of The Lpg System","t":"9.2 OPERATION OF THE LPG SYSTEM - Valves for supply lines and cylinder valves must be closed when appliances are not in use, before changing a cylinder and immediately in case of emergency. - Appliance valves must be closed before opening the cylinder valve. - Ventilation is necessary when appliances that consume oxygen from inside the boat are used. - If the stove is not suspended by gimbals, it should not be used when wide roll angles or continuous listing are likely. - Please refer to the manufacturer's notes for the use and maintenance of the LPG cooker. 9.3 VERIFICATION OF THE LPG SYSTEM The LP system should be tested for leakage before each use in any of the following ways: - If the LPG circuit is equipped with a pressure gauge: Before each use, close the appliance valve, open the LPG cylinder valve, allow the pressure gauge to stabilize, close the LPG cylinder valve and observe the pressure indicated by the pressure gauge near the LPG cylinder for 3 minutes. The pressure indicated by the manometer should be constant if there is no leak in the system. The pressure indicated by the manometer should be constant if there is no leak in the system. If bubbles are observed in the detector liquid, there is a leak. NOTE: The pressure gauge only indicates vapour pressure, which is a constant at a given temperature. It gives no indication of the amount of LPG remaining in the cylinder.. - If the LPG circuit is equipped with a bubble leak detector, use it as follows: Regularly observe the bubble leak detector. OR Once the installation is pressurised and stabilised, press the detector push button. The installation is not leaking if bubbles do not appear in the detector liquid. If bubbles are observed in the detector liquid, there is a leak. - Carry out a manual search by applying a foaming solution, soapy water or a detergent (with the burner taps closed and the installation and gas bottle taps left open). Foaming solutions for detecting leaks in gas installations conforming to EN 14291 are adequate for these requirements. 108 Liquefied Petroleum Gas (LPG) System "},{"d":"OM","p":109,"pdf":109,"sec":"9.3 Verification Of The Lpg System","t":"- If an LPG leak is detected or suspected, immediately take the following measures: - Disconnect the LPG supply from the supply valve(s); - Extinguish all naked flames and other sources of ignition (heaters, cooking appliances, pilot lights, etc.); - Do not operate electrical switches; - Evacuate the area if possible. NOTE: Leak tests carried out by the boat user are not a substitute for regular and complete checks of the LPG circuit by a competent professional. To ensure sufficient ventilation, make sure that you open the hatches or ports near the hotplate when using it. - If a leak or fire from an LPG tank is detected, close the main LPG supply valve and do not use LPG appliances. - Do not use an installation with a leak before it has been inspected and repaired by a competent person. - Do not modify the boat’s LPG system. Installation, modification and maintenance should be carried out by a qualified individual. Have the system checked at regular intervals or as prescribed by national requirements. - Never use a naked flame to check for leaks. - Do not use a hotplate or an oven to heat the living areas. - Fuel-burning equipment with a naked flame consumes the oxygen in the cabin and leaves combustion residue in the boat. Ventilation is necessary when this equipment is used.Open the vents provided for this purpose when using this equipment. Do not use a hotplate or an oven to heat the living areas. Never obstruct the openings provided for ventilation. - Ventilation requirements have been calculated for LPG appliances as installed. Additional ventilation openings may be required if other appliances are installed in addition to these (please consult a professional). - Never leave the boat unsupervised when equipment using LPG with a naked flame is on. - Do not smoke or use a naked flame when replacing LPG bottles. Close the tap on the empty bottle before detaching to replace it. - Do not use solutions containing ammonia when testing for leaks manually (ammonia, which is present in certain soaps and detergents, attacks brass connections). Although the damage may at first be impossible to detect, the cracks and leaks may appear several months after contact with the ammonia). To change an LPG bottle 1. Close the tap on the LPG bottle 2. Detach the LPG bottle 3. Replace the LPG bottle 4. Attach the new LPG bottle 5. Open the tap on the LPG bottle 109  - When the cooker is on, ventilate well to prevent any risk of asphyxiation. - Do not use the cooker as a means of heating. 9 Liquefied Petroleum Gas (LPG) System - Cease use of all LPG appliances;"},{"d":"OM","p":110,"pdf":110,"sec":"9.3 Verification Of The Lpg System","t":"Gas cylinder locker (Europe Version) Gas cylinder locker (US Version) Cooking equipment (Europe Version) Gas supply valve (Europe Version) 110 Liquefied Petroleum Gas (LPG) System "},{"d":"OM","p":111,"pdf":111,"sec":"9.4 Diagram Of Layout","t":"9.4 DIAGRAM OF LAYOUT Europe Version Designation 1 Regulator valve 2 Gas cylinder 3 Drain 4 Gas bottle connection kit 5 Bubble tester kit 6 Rubber washers 7 Ringed PVC sheath 8 Copper gas connection kit 9 Label 10 Gas appliance connection kit 11 Bulkhead fitting 9 US Version Reference 111  Designation 1 Regulator valve 2 Gas cylinder 3 Drain 4 Electromagnetic valve (12V) 5 Bulkhead fitting 6 Wire passage 7 Ringed PVC sheath 8 Solenoid switch 9 Plastic propane pipe 10 Gas appliance connection kit Liquefied Petroleum Gas (LPG) System Reference"},{"d":"OM","p":113,"pdf":113,"sec":"9.4 Diagram Of Layout","t":"10 DOMESTIC APPLIANCES Fridge............................................................................................... 114 Microwave ....................................................................................... 117 Washer............................................................................................. 118 113 10"},{"d":"OM","p":114,"pdf":114,"sec":"10.1 Fridge","t":"10.1 FRIDGE General points - The fridge comprises 3 components: the compressor, the evaporator and the condenser. These components are connected by a closed refrigerant gas circuit. The fridge is air-cooled. - The fridge is DC powered. It is designed to chill food and drink. Any other use is dangerous and must be strictly avoided. - A breaker protects the electrical circuit. - Refer to the manufacturer's instructions for use and maintenance. - Never heat or use tools to defrost the inside of the fridge more quickly (doing so may damage the interior surface). - Never obstruct the heat exchanger of the fridge. - The ON/OFF start button is located on the fridge. - The thermostat is in the inside compartment of the fridge. It enables selection of the desired temperature setting for the inside of the fridge. - The refrigration power can be affected by: - The ambient temperature, - The quantity of food to chill, - The frequency with which the door is opened. Maintenance - Clean the evaporator with a damp cloth at least once a year. Never use cleaners which are abrasive or acidic, or which contain solvents, for cleaning the evaporator. - Regularly clean the fridge/icebox door seal with a damp cloth. - Regularly defrost the fridge. - When winterising the boat, leave the fridge door/icebox cover open to prevent mould and odours from developing. 114 Domestic appliances "},{"d":"OM","p":115,"pdf":115,"sec":"10.1 Fridge","t":"LAYOUT OF COMPONENTS Ref 1: Fridge - Cockpit (Positive temperature) Closed Open 115  Domestic appliances 10"},{"d":"OM","p":116,"pdf":116,"sec":"10.1 Fridge","t":"Ref 2: Freezer (Negative temperature) NOTE: The control is located directly inside the device. Ref 3: Fridge (Positive temperature) Refrigeration unit Access: Port aft cabin Fridge NOTE: The control is located directly inside the device. 116 Domestic appliances "},{"d":"OM","p":117,"pdf":117,"sec":"10.2 Microwave","t":"10.2 MICROWAVE General points - The microwave is AC powered. - A breaker protects the electrical circuit. - The microwave is designed to reheat food and drink or to cook food. Any other use is dangerous and must be strictly avoided. - The microwave must never be started when empty. - Remove all foil or metallic packaging elements before putting food in the microwave. - Remove airtight coverings from packaging before putting food in the microwave. Location Domestic appliances 10 Starting up - Use the switch to select the desired power source (shore power or generator). - Put the microwave circuit-breaker in the ON position. Maintenance - Regularly check the door seals. - Regularly clean the inside of the fridge with a damp sponge. 117 "},{"d":"OM","p":118,"pdf":118,"sec":"10.3 Washer","t":"10.3 WASHER General points Never allow children to use the domestic electrical equipment unsupervised. - The washing machine runs on an AC power supply. - A breaker protects the electrical circuit. - The washing machine is supplied with water from the onboard tanks via a supply valve. Starting up - Refer to the manufacturer's instructions for use and maintenance. - Check the level in the water tanks and switch on the water system. - Open the water supply valve/washing machine. - Turn on the AC circuit (shore or generator) and actuate the washing machine circuit breaker. - Do not operate the washing machine/ dishwasher when at sea. - Start the washing machine. 118 Domestic appliances "},{"d":"OM","p":119,"pdf":119,"sec":"10.3 Washer","t":"EUROPE VERSION Location: Starboard passageway 1. AC socket 2. Onboard water supply (cold water only) 3. Washing machine outlet US VERSION Location: Starboard passageway (under desk) 1. AC socket 2. Onboard water supply (hot water / cold water) 3. Washing machine outlet 119  Domestic appliances 10"},{"d":"OM","p":121,"pdf":121,"sec":"10.3 Washer","t":"11 AUDIO-VISUAL EQUIPMENT Television ........................................................................................ 122 HiFi................................................................................................... 123 121 11"},{"d":"OM","p":122,"pdf":122,"sec":"11.1 Television","t":"11.1 TELEVISION General points - Power for the television is supplied by alternating current. Depending on the equipment of the boat, alternating current may be provided by: - the AC shore power socket, - the generator, - the DC/AC converter powered by service batteries. - A circuit-breaker protects the circuit. - Pre-cabling for the aerial is already installed on the boat. Starting up - First turn on the circuit breaker, then switch on the TV. Television - Saloon Television - Owner's cabin 122 Audio-visual equipment "},{"d":"OM","p":123,"pdf":123,"sec":"11.2 Hifi","t":"11.2 HIFI - The sound system is DC powered. Refer to the manufacturer's instructions for use and maintenance. - The speakers allow amplification of the sound from the TV or the DVD player. - The sound from the TV comes out of the integral speakers. - The sound from the TV can come from the speakers if AUX is selected on the DVD player. - The sound from the DVD player comes from the speakers. - The sound from the radio comes from the inside and outside speakers. It is possible to select either inside or outside speakers by adjusting the balance control. Radio 11 Audio-visual equipment Loudspeaker 123 "},{"d":"OM","p":125,"pdf":125,"sec":"11.2 Hifi","t":"12 ONBOARD COMFORT Air conditioning .............................................................................. 126 Electronic equipment ..................................................................... 133 Fuel-burning equipment for purposes other than propulsion (Generator, Heating)....................................................................... 139 125 12"},{"d":"OM","p":126,"pdf":126,"sec":"12.1 Air Conditioning","t":"12.1 AIR CONDITIONING General points - The air-conditioning is powered by alternating current. - The air-conditioning cools the air temperature inside the boat (only when the boat is floating in water). - The cooling circuit consists of one or more compressors that operate independently. A compressor is called \"reversible\" because it can heat the boat if the seawater temperature exceeds 13°C. - In winter, you can programme the dehumidifier function on the air conditioning controls. - The refrigeration compressors are made by one or two seawater pumps. These pumps are run on AC voltage and are master controlled by one or two relay boxes. - Seawater is drained via a through-hull fitting equipped with a valve, located above the waterline. Each compressor has its own through-hull drainage fitting. It is advisable to check the flow of water visually once the air conditioning starts running. Operation Before starting the engine: - Open the raw water intake valves and evacuation valves; - Make sure that the control panel is in the STOP position; - Use the switch on the chart table to select the power source (shore power or generator). - If using shore power: plug into the shore power socket; - If using the generator: before turning on the air conditioning, leave the generator running for approximately 3 minutes. If the seawater pump is deprimed (eg. in case of running aground), carry out the following procedure: - Disconnect the discharge hose from the seawater pump by loosening the 2 stainless steel collars; - Blow air through the pipe using a compressor; - Re-connect the discharge hose with 2 stainless steel collars. When the air conditioning is running: - Switch the air-conditioning circuit-breakers ON. - Select the temperature of each compressor using the control units. 126 Onboard comfort "},{"d":"OM","p":127,"pdf":127,"sec":"12.1 Air Conditioning","t":"COMPRESSORS - LOCATION . - Refer to the manufacturer's instructions for use and maintenance. - When the air conditioning is running, check visually that the seawater has been fully drained. - Never start the generator when the air conditioning is already on. - Always turn off the air conditioning before turning off the generator. - Close the seawater intake valve; - Unscrew the top of the filter; - Clean the filtering screen; - Put everything back in place. 3-cabin layout 4-cabin layout - Clean the air filter (located in the compressor) regularly for maximum performance. - Clean the cooling coil at least once a year. - To prevent the air-conditioning circuit from freezing: never run the system when the seawater temperature drops below 5°C. - Winterisation: drain the whole seawater system. - The cooling gas circuit requires no maintenance. 127  12 Onboard comfort - Regularly check and clean the seawater filter placed on the thru-hull seawater intake."},{"d":"OM","p":128,"pdf":128,"sec":"12.1 Air Conditioning","t":"LAYOUT OF COMPONENTS Ref 1: Seawater drainage 1. Condensation water drainage 2. Seawater drainage Ref 2: Seawater intake Ref 3 Location: Starboard passageway 1. Circuit breakers - Air conditioning (see Chapter: AC BREAKERS) 2. Relay box (Seawater pump) 1. Seawater pump 2. Seawater filter 3. Seawater intake 128 Onboard comfort "},{"d":"OM","p":129,"pdf":129,"sec":"12.1 Air Conditioning","t":"DIAGRAM - AIR CONDITIONING 129  Designation 1 Insulated pipe 2 Ambient air intake 3 Refrigeration unit 4 Mounting support 5 Condensation water pipe 6 Seawater pump 7 Filter 8 Seawater supply valve 9 Conditioned air outlet 10 Manual control 11 Relay box 12 Temperature sensor 13 Seawater drainage pipe 14 Thru-hull fitting 15 Seawater supply 16 Seawater intake filter 12 Onboard comfort Reference"},{"d":"OM","p":130,"pdf":130,"sec":"12.1 Air Conditioning","t":"Air-conditioning controls Please refer to the key on the following page 130 Onboard comfort "},{"d":"OM","p":131,"pdf":131,"sec":"12.1 Air Conditioning","t":"Manual control of the air-conditioning NOTES 1. Data display Screen displaying desired temperature, programmed values and error messages. - When the system is in dehumidifying mode, the system's safety devices remain active: if there is an interruption in the flow of seawater or a drop in AC voltage, the system automatically stops. 2. MODE Enables navigation between the different operating modes. 3. POWER/OFF Lights up when the system is switched off. The manual ventilator may continue to run. - In cooling mode, the system works efficiently when the seawater temperature is below 30°C. 4. COOL Indicates that the compressor is activated when cooling. - In heating mode, the system works efficiently when the seawater temperature is above 13°C. - It is important to switch the system to HEATING mode at least once a month to prevent the changeover cock from becoming stuck in the COOLING mode. 6. Option (Auxiliary heating). 7. AUTOMATIC Comes on when the system is in AUTO mode. 8. DEHUMIDIFY Comes on when the system is in dehumidifying mode. 9. + and - keys Allow you to raise or lower the desired temperature. 10. Cooling indicator This indicates that the compressor is in COOLING mode. 11. Heating indicator This indicates that the compressor is in HEATING mode. 12. Option (Auxiliary heating). 13. Temperature control indicator This indicates the temperature control setting (desired ambient temperature). 14. Indicator for the manual ventilator This comes on when the manual ventilator is running. 15. Indicator for the automatic ventilator This comes on when the ventilator is running in automatic mode. 16. Ventilator key Allows you to select manual or automatic mode for the ventilator. 17. Ventilator speed indicator Shows current ventilator speed. 131  12 Onboard comfort 5. HEAT Indicates that the compressor is activated when heating."},{"d":"OM","p":132,"pdf":132,"sec":"12.1 Air Conditioning","t":"LOCKING METHOD - It is possible to lock the control buttons to prevent settings from being changed accidentally: Press these three buttons simultaneously: MODE, UP (arrow pointing up), FAN. LC appears on the screen, which signifies \"LOCK\". - To unlock and resume use of the buttons, press the same three buttons simultaneously: MODE, UP (arrow pointing up), FAN. UL appears on the screen, which signifies \"UNLOCK\". SCREEN LIGHTING - If the control box is switched off by a fault (in the cabins for example), touching any button automatically and instantly lights the screen up blue. To alter the light intensity of the screen, press these two buttons simultaneously: MODE, UP (arrow pointing up) until the required intensity is reached. - It is possible to programme whether or not the controls are illuminated by default: In this case the ON mode must be selected for permanently illuminated controls or the SLEEP mode for permanently unilluminated controls. Procedure: - Simultaneously press these two buttons: MODE and DOWN (arrow pointing down). - Select n°18 on the menu using the arrows, then confirm by pressing MODE. - With the arrows select either ON for illumination by default or SL (SLEEP) to turn the box off. - Press FAN 2 times to confirm the selection. 132 Onboard comfort "},{"d":"OM","p":133,"pdf":133,"sec":"12.2 Electronic Equipment","t":"12.2 ELECTRONIC EQUIPMENT The onboard electronics are powered by direct current. Control: Electrical panel Sensors Location of sensors: - Before strapping the boat when taking it out of the water, be sure to remove the probes from their housing to prevent the lifting strap from damaging them. 12 Onboard comfort - Close the hull opening by the cap for this purpose (supplied with the probes). Ref 1: DST800 Sensor Ref 2: Forward Scan Sensor - Do not store equipment on top of the sensors. - Do not cover the sensors in antifoul when antifouling the hull. - Regularly clean the sensors. 133 "},{"d":"OM","p":134,"pdf":134,"sec":"12.2 Electronic Equipment","t":"Autopilot - To ensure optimum perfomance, keep all metallic objects away from the gyrocompass. - Do not store equipment close to the calculator and electrical connections. - Place the protective covers on the repeaters when unused for long periods. - When sailing, store the protective covers inside the boat to avoid loss. VHF VHF Location: Chart table - The various repeater displays are back-lit. - Regularly clean the dials of the repeaters with fresh water. - Refer to the manufacturer's instructions for use and maintenance. 134 Onboard comfort "},{"d":"OM","p":135,"pdf":135,"sec":"12.2 Electronic Equipment","t":"Gyrocompass Location: Starboard passageway Vessel Management Unit Location: Starboard engine compartment Location: Starboard engine compartment 1. Hydraulic piston 2. Tank 135  Pilot control Location: Steering station Onboard comfort 12"},{"d":"OM","p":136,"pdf":136,"sec":"12.2 Electronic Equipment","t":"LAYOUT OF COMPONENTS 136 Onboard comfort "},{"d":"OM","p":137,"pdf":137,"sec":"12.2 Electronic Equipment","t":"Onboard comfort 12 137 "},{"d":"OM","p":138,"pdf":138,"sec":"12.2 Electronic Equipment","t":"12/24V 5A 12V 2A 12/24V 5A 12V 12V 2A 138 Onboard comfort "},{"d":"OM","p":139,"pdf":139,"sec":"12.3 Fuel-Burning Equipment For Purposes Other Than Propulsi","t":"12.3 FUEL-BURNING EQUIPMENT FOR PURPOSES OTHER THAN PROPULSION (GENERATOR, HEATING) 12.3.1 General points - Make sure that the ventilation openings in the engine (and, if installed, generator) compartment are well-cleared. - Stop the engine and refrain from smoking while the fuel tank is being filled. - Have your fuel circuit checked regularly by a professional engineer. - Avoid any contact between inflammable materials and the hot sections of the engine. - Take all necessary precautions to avoid contact with naked flames and other hot areas. - Do not obstruct or modify the ventilation system. 12 Onboard comfort - Fuel stored outside the tanks (jerrycans, portable fuel tanks, etc.) must be stowed on deck and protected from bad weather and mechanical damage. 139 "},{"d":"OM","p":140,"pdf":140,"sec":"12.3.2 Generator","t":"12.3.2 Generator DIAGRAM OF LAYOUT Reference Designation 1 Fuel filter 2 Seawater filter 3 Water trap 4 Anti-siphon valve 5 Differential circuit breaker 6 Generator 7 Water/gas separator 8 Seawater inlet 9 Seawater drainage 10 Outlet 140 Onboard comfort "},{"d":"OM","p":141,"pdf":141,"sec":"12.3.2 Generator","t":"General points - The generator is a machine which can produce AC electrical power using mechanical power (fuel). The generator powers onboard equipment operating at 220V or 110V, moored or sailing. - The generator starts with its own battery (12V circuit). - Make sure that there is enough fuel in the fuel tank before using the generator. The generator is supplied with fuel by the port/starboard tank. - The cooling water and exhaust gases are separated in the separator to avoid noise pollution. The seawater is discharged below the waterline. The exhaust- pipe is located above the waterline. Check visually that the exhaust gases are being expelled properly. Make sure that the ventilator in the generator compartment is working. - Check to see if any leaks appear (seawater, coolant, fuel, exhaust gases). If there is a leak, stop the generator at once and have the leak repaired. - Maintenance of the generator must only be done by qualified and proficient personnel. Before working on the generator, it is imperative to isolate the generator's battery power, to prevent it from starting accidentally. - The generator can be started by the switch on the generator itself or by the switch on the control panel. Starting up - Fill the generator with water to prevent the seawater pump from running dry (refer to the supplier's recommendations). - Open the raw water intake valves and evacuation valves. - Open the fuel supply valve. - Turn the generator's battery switch to the ON position. - Switch the generator's circuit-breaker to the ON position. - Turn on the generator using the remote control (located near the main switch panel). or on the generator itself. - Make sure that no AC equipment is running. Toggle the shore power/ generator switch. 141  12 Onboard comfort - The generator is earthed by an earthing plate which is located under the hull (see Chapter: EARTHING PLATES)."},{"d":"OM","p":142,"pdf":142,"sec":"12.3.2 Generator","t":"Control - Generator (on appliance) Remote control Master switch - Generator In the event of the generator catching fire - Do not open the generator. - Cut the power supply (electrical and fuel) to the boat's engines, to the generator and to the ventilators. - Use the extinguisher access port on the generator to discharge the contents of the portable extinguisher. Extinguisher access port - Refer to the manufacturer's instructions for use of the generator. - Never start the generator when the air conditioning is already on. Always turn off the air conditioning before turning off the generator. - Never connect the shore power to the generator: you may suffer an electric shock. - An extinguisher access port is provided on the generator in the event of a fire starting in the generator. 142 Onboard comfort "},{"d":"OM","p":143,"pdf":143,"sec":"12.3.2 Generator","t":"LAYOUT OF COMPONENTS Ref 2: Tank selection pull - Lever pushed: Port tank supply - Lever pulled: Staboard tank supply Ref 3: Earthing plate Ref 4: Seawater drainage Access: Starboard passageway Ref 5: Seawater inlet Location: Starboard passageway 1. Seawater pump 2. Seawater inlet 143  12 Onboard comfort Ref 1: Fuel supply valve"},{"d":"OM","p":144,"pdf":144,"sec":"12.3.2 Generator","t":"Ref 6 1. Battery 2. Battery charger Ref 8 Ref 9: Generator Ref 7 1.Seawater filter 2.Battery isolator - Positive& Negative terminal& 3. Fuel filter Ref 10: Breaker 1.Water/gas separator 2.Water trap 144 Onboard comfort "},{"d":"OM","p":145,"pdf":145,"sec":"12.3.3 Water heating","t":"12.3.3 Water heating Thermostat The water pump and the diesel pump are built into the heater. The cabins and saloon are fitted with heating units to which the water piping is connected. The fluid used for the heating is a mixture of water and coolant. - A sudden cut in the electrical supply may damage the heater: REMEMBER TO SWITCH OFF THE HEATER BEFORE ISOLATING THE BATTERIES. - It is essential to disconnect the electrical supply and to allow the hot components to cool before doing any maintenance or work on the heater. 12 Onboard comfort The correct fuel is diesel. Be aware of the hazards associated with using the incorrect fuel. - Please refer to the manufacturer's instructions for the use and maintenance of the heating system. 145 "},{"d":"OM","p":146,"pdf":146,"sec":"12.3.3 Water heating","t":"LAYOUT OF COMPONENTS Ref 1: Heater 1. Fuel supply 2. Hot water out 3. Combustion air input 4. Exhaust 5. Water supply 6. Ventilator 7. Heat exchanger 8. Combustion chamber 9. Water pump Ref 2: Fuel supply socket 146 Onboard comfort "},{"d":"OM","p":147,"pdf":147,"sec":"12.3.3 Water heating","t":"Ref 3: Heating unit Ref 4: Water circulation pump Ref 5: Expansion tank Onboard comfort 12 Ref 6: Control - Heater 1. Thermostat 2. Control - Heater 3. Switch - Ventilator 147 "},{"d":"OM","p":148,"pdf":148,"sec":"12.3.3 Water heating","t":"SCHEMATIC DIAGRAM OF WATER CIRCUIT - The heater must be switched off when refilling the fuel tank. - The heater's exhaust gases are very hot: they may burn fenders or cables located too close to the through-hull exhaust. - The heater and its components may be hot during and immediately after operation and may cause injury if touched. - The air at the outlets of the heater may be hot and can cause injury if a part of the body (e.g. the legs) remains exposed for a long time to the flow of hot air. Reference - Before switching on the heating, make sure that the combustion air, exhaust and heating air intake and outlet ports are not obstructed while the heater is running. Designation 1 Drain tap 2 Heater 3 Unit heaters 4 Expansion tank - Never store inflammable material near the heater. Servicing and maintenance - To ensure optimum operation of the heating circuit, be sure to operate the heater once a month, even in the Summer, to prevent the seals from drying out or the metering pump and burner motor from seizing. - You are advised to perform a complete servicing of the heating circuit every 3 years. - The burner combustion chamber must be replaced every 10 years. - If the boat is to be used for oceanic sailing, provide yourself with a maintenance kit and a diagnostic device. - Reduce the amount of reserve fuel as much as possible; use tanks made of corrosionresistant material. - Store the reserve fuel tanks on deck. Avoid exposure to temperatures exceeding 60°C (see Chapter: ENGINE). 148 Onboard comfort "},{"d":"OM","p":149,"pdf":149,"sec":"12.3.3 Water heating","t":"Easystart Control (Timer) - The water heating operates on direct current. - The Easystart timer serves to turn the heater on and off, as well as selecting its operating time, the length of time and how the heater should operate. Please refer to the manufacturer's instructions for the use and maintenance of the heating system. - The Easystart timer allows for selection of units of temperature (°C or °F), the operating language (English or German) and the time. 1. Menu bar 2. Programme bar (day of week and programme display) 3. 'Previous' button 4. Initiation button (timer ON/OFF; displays temperature, times, length of operation and desired temperature) 5. Display bar 6. 'Next' button 7. 'Confirm' button 8. Cover and fixing screws 9. Status bar 149  Onboard comfort 12"},{"d":"OM","p":151,"pdf":151,"sec":"12.3.3 Water heating","t":"13 WATER SYSTEMS General points ................................................................................ 152 Using a valve................................................................................... 153 Fresh water filling system ............................................................. 154 Fresh water distribution system ................................................... 157 Main plumbing equipment ............................................................. 158 Blackwater system (Toilet) ............................................................ 170 Waste water system ....................................................................... 177 151 13"},{"d":"OM","p":152,"pdf":152,"sec":"13.1 General Points","t":"13.1 GENERAL POINTS - It is essential to rinse the entire on-board water system the first time the boat is used (the water system is protected in the factory by a non-toxic antifreeze). - The water tanks may have had an anti-algae treatment using a copper sulphate based product. It is advisable to renew the treatment according to the area in which the boat is sailing. - Regularly check water-tightness of joints in the water system installations. Check that screws and bolts are well tightened and replace them if they are worn or corroded. - Drain all the water systems during winterisation (in particular the cockpit shower and water heater) to avoid damage from freezing. - Disconnect the onshore shore water supply before leaving the boat (if fitted). - Clean/change the filters regularly. - If the boat is sailing in temperatures below freezing, antifreeze can be used in the water systems: use a non-toxic antifreeze for potable water. NEVER USE AUTOMOBILE ANTIFREEZE: RISK OF POISONING. 152 Water systems "},{"d":"OM","p":153,"pdf":153,"sec":"13.2 Using A Valve","t":"13.2 USING A VALVE The valve is closed when the valve handle is at right angles to the pipe. The valve is open when the valve handle is in line with the pipe. Valves, thru-hull inlets and other brass or bronze fittings have a lifespan of around 5 years. All valves, thru-hull inlets and other brass or bronze accessories must be checked by a professional every year and replaced as necessary. 1. Open valve 2. Closed valve Using the drainage valve - The direct-to-sea drainage valve can be sealed by means of the drilled hole on the handle. - To lock the drainage valve in the closed position: Pass the tightening collar around the drainage valve and feed through the hole in the handle as shown. Plastic valve Bronze valve 153  - Beware of any unintentional draining. Water systems 13"},{"d":"OM","p":154,"pdf":154,"sec":"13.3 Fresh Water Filling System","t":"13.3 FRESH WATER FILLING SYSTEM Reference Designation 1 Water tank 2 \"WATER\" deck filler 3 Water tank vent 4 Valve closure 154 Water systems "},{"d":"OM","p":155,"pdf":155,"sec":"13.3 Fresh Water Filling System","t":"FRESH WATER FILLING SYSTEM - OPTION: EXTRA WATER TANK Water systems 13 Reference Designation 1 Fresh water tank - Port (option) 2 \"WATER\" deck fillerVent 3 Vent 4 Valve closure 5 Fresh water tank - Starboard (option) 155 "},{"d":"OM","p":156,"pdf":156,"sec":"13.3 Fresh Water Filling System","t":"Water tank (Port) Gauge: on the electrical panel Starboard tank (option) 156 Water systems "},{"d":"OM","p":157,"pdf":157,"sec":"13.4 Fresh Water Distribution System","t":"13.4 FRESH WATER DISTRIBUTION SYSTEM 3-cabin layout Water systems 13 Reference Designation 1 Water unit 2 Water heater 3 Sink mixer tap 4 Washbasin mixer tap 5 Washbasin/shower mixer tap 6 Mixer shower 7 Cockpit shower 157 "},{"d":"OM","p":158,"pdf":158,"sec":"13.5.1 Water unit","t":"13.5 MAIN PLUMBING EQUIPMENT 13.5.1 Water unit - The water unit is powered by direct current. - It supplies all the boat's plumbed-in equipment with fresh water. It is fitted with a pressure switch that activates the flow when the pressure in the water system falls. - The water unit must only be used with the fresh water supply. All other use (e.g. seawater, bilge water, oil products) must be strictly avoided. - The water unit is switched on at the electrical panel. - Make sure that the water unit never runs dry. - The pressure and capacity of the water unit depend on the temperature of the stored fresh water supply. Access: Port engine compartment 1. Fresh water filter 2. Water unit 3. Expansion tank 4. Water tank / water unit supply valve (this valve enables isolation of the water pump for maintenance) 158 Water systems "},{"d":"OM","p":159,"pdf":159,"sec":"13.5.2 Cockpit shower","t":"13.5.2 Cockpit shower - The cockpit shower provides fresh water for rinsing off. - The shower is fitted with a mixer tap. - The tap has a dual function: - It allows the water to be turned on or off; - It allows a choice of water temperature (hot water / cold water). DIAGRAM OF LAYOUT Reference 159  Designation 1 Water unit 2 Water heater 3 Cockpit shower (Port) 4 Cockpit shower (Starboard) Water systems 13"},{"d":"OM","p":160,"pdf":160,"sec":"13.5.2 Cockpit shower","t":"Operation: - To use the shower, turn on the water by tipping the tap on its axis. - Press the button on the top of the shower to allow the flow of water. - Choose the required temperature by turning the tap clockwise or anti-clockwise. - After using the shower, it is important to turn off the water by tipping the tap back into its original position. Location: Scoop - Port (standard) Scoop - Starboard (Option) 160 Water systems "},{"d":"OM","p":161,"pdf":161,"sec":"13.5.3 Deck wash pump (seawater/fresh water)","t":"13.5.3 Deck wash pump (seawater/fresh water) - The deck wash pump is supplied by direct current. - The deck wash pump allows the deck or the boat's tender to be washed. - The deck wash pump is switched on at the electric panel. - Emplacement of the sea water/fresh water selector valve: Port engine compartment Operation - Open the seawater intake valve. - Select the seawater or fresh water supply. - Attach a hose to the connector provided in the cockpit. 13 Water systems - Start the pump. 161 "},{"d":"OM","p":162,"pdf":162,"sec":"13.5.3 Deck wash pump (seawater/fresh water)","t":"DIAGRAM OF LAYOUT 1. Connection 2. Deck wash pump 3. Seawater filter 4. Control 5. Onboard water / seawater selection valve 6. Seawater intake 162 Water systems "},{"d":"OM","p":163,"pdf":163,"sec":"13.5.4 Shore fresh water supply","t":"13.5.4 Shore fresh water supply General points Disconnect the onshore shore water supply before leaving the boat. There are two options for supplying the fresh water circuit of the boat: 1. via the water unit supplied by one or more water tanks, 2. by fresh water taken from the dock. NOTES These two possibilities of supplying fresh water circuit of the boat are independent from each other. 1. Supply of the fresh water circuit by the water unit and the water tanks - Open the valve of the desired water tank located near the water unit (if the boat has several water tanks, it is advisable to open only one valve at a time). 2. Supply of the fresh water circuit by taking fresh water from the dock - Connect a water pipe to the onshore water supply. - Open the water supply tap located on the pontoon. Connection: Scoop (Port aft) - A non-return valve in the distribution circuit allows the shore supply water to be used without opening the valve. - The connection of the water intake is located in the cockpit. 163  - It is not possible to fill up the water tanks using the onshore water supply. 13 Water systems - Switch on the water unit. - The water from the onshore supply is delivered under pressure directly into the onboard water circuit. It is not necessary to switch on the water unit."},{"d":"OM","p":164,"pdf":164,"sec":"13.5.5 Sea water/fresh water foot pump","t":"13.5.5 Sea water/fresh water foot pump - The foot pump enables the use of sea water/fresh water without the need for electricity. - Emplacement of the sea water/fresh water selector valve, under the sink. - Water from the foot pump comes out at the spout located at the sink. DIAGRAM OF LAYOUT Ref 1: Seawater intake Ref 2: Foot pump Ref 3: Spout Ref 4: Onboard water / seawater selection valve 5. Fresh water tapping 164 Water systems "},{"d":"OM","p":165,"pdf":165,"sec":"13.5.5 Sea water/fresh water foot pump","t":"Seawater electric pump DIAGRAM OF LAYOUT 2 4 1 Reference Designation 1 Spout 2 Seawater electric pump 3 Electric pump control 4 Seawater intake 165  3 Water systems 13"},{"d":"OM","p":166,"pdf":166,"sec":"13.5.6 Water heater","t":"13.5.6 Water heater - The water heater enables the use of hot water on board the boat. - The water heater functions by recovering calories from the port engine cooling circuit or the on-board AC electrical circuit. Refer to the manufacturer's instructions for use and maintenance. - The water heater thermostat regulates the water temperature only when it is operating with electrical resistance. The thermostat is pre-set in the factory. - The mixer tap allows the temperature leaving the water heater to be adjusted. - Never switch on the water heater if it is not filled with water. Location: Port aft cabin 1. Water heater - 40L 2. Mixer tap 166 Water systems "},{"d":"OM","p":167,"pdf":167,"sec":"13.5.7 Watermaker","t":"13.5.7 Watermaker General points - The watermaker allows fresh water to be produced from the seawater. - The watermaker can be supplied either: - by DC (direct current), - by AC (alternating current). - A circuit-breaker protects the circuit. - The watermaker circuit comprises several elements: - seawater intake, 13 - seawater filter(s), Water systems - circulation pump, - electric valve for automated rinsing, - manual rinsing valve, - motor block and high-pressure pump, - membrane block, - control panel, - seawater discharge valve. Operation - Seawater enters the membrane block under pressure, which allows only pure water to pass out. - A sensor at the membrane block outlet allows measurement of the salt content of water filtered in this way. A three-way valve allows drinking water to be directed automatically to the tanks or for water that is too salty to be discharged to the sea. - The drinking water filtered by the membranes is sterile; it is advisable to treat it with a weak dose of chlorine from time to time and to mineralise it if consumption is prolonged. - Fresh water production is affected by the temperature of the seawater used and the cleanness of the filter. 167 "},{"d":"OM","p":168,"pdf":168,"sec":"13.5.7 Watermaker","t":"Operation - Before starting the watermaker circuit, check that the supply and discharge valves are open. - Using the watermaker with DC supply needs a lot from the battery bank: make sure to recharge them regularly by running the boat's engine. - The different quality and salinity of the seawater used affect the production of fresh water; it is advisable not to use the watermaker in areas of heavy sail traffic or where the water is muddy, polluted or brackish. - The membranes are temperature-sensitive; in the event of negative (0°C and less) or too hot (60°C and over) temperatures, the membranes are likely to tear. Maintenance - Every week, rinse the system with fresh water. This can be done manually or automatically as preferred. The fresh water used for rinsing the circuit must not be under pressure as this can damage the membranes. - Every 6 months, the seawater filter must be changed. - When the watermaker is not being used for a long period, rinse the system every month or sterilise the membranes. DIAGRAM OF LAYOUT DIAGRAM OF LAYOUT 168 Water systems "},{"d":"OM","p":169,"pdf":169,"sec":"13.5.7 Watermaker","t":"Watermaker Membranes 5 - 25 filters Control Location: Chart table A. Rinsing pump B. Filter 169  Water systems 13"},{"d":"OM","p":170,"pdf":170,"sec":"13.6 Blackwater System (Toilet)","t":"13.6 BLACKWATER SYSTEM (TOILET) General points - Blackwater is human waste including water flushed from the toilets. - Close the valves after each use and especially when the boat is unattended. - Regularly check the valves and thru-hull seacocks for proper operation and watertightness. - Regularly check the tightness of the flexible pipe clamps and connections. 170 Water systems "},{"d":"OM","p":171,"pdf":171,"sec":"13.6.1 Diagram of blackwater system","t":"13.6.1 Diagram of blackwater system 3 CABINS 3 HEADS VERSION Ref 2: Seawater intake Ref 6: WC drainage (to sea) Reference Designation 1 Toilet 2 Seawater intake 3 Blackwater tank 4 Vent 5 \"WASTE\" deck connection 6 WC drainage (to sea) 171  Water systems 13"},{"d":"OM","p":172,"pdf":172,"sec":"13.6.1 Diagram of blackwater system","t":"4 CABINS 4 HEADS VERSION Reference Designation 1 Toilet 2 Seawater intake 3 Blackwater tank 4 Vent 5 \"WASTE\" deck connection 6 WC drainage (to sea) 172 Water systems "},{"d":"OM","p":173,"pdf":173,"sec":"13.6 Blackwater system (toilet)","t":"YOUR BOAT IS FITTED WITH A BLACKWATER TANK To minimise odours from this tank, we suggest following the use and maintenance guidelines below: 1) Holding tank Location: in each head Capacity: 80L - A blackwater tank is used solely for the temporary collection of water from the toilets. - The tank can be emptied in 2 ways: - By connection to a pumping system that empties the tank by suction. This system uses the \"WASTE\" deck connection. - Only use water-soluble toilet paper to avoid blockages. 13 Note: Sanitary towels and other items (paper handkerchiefs, dressings etc.) in the toilets and blackwater tank will result in blockages. Water systems - Via the thru-hull fitting, which empties directly into the sea (provided that the laws of the country in which the vessel sails permit dumping into the sea). - Faecal matter causes the formation of unpleasant odours in the blackwater tanks, to which the use of salt water for flushing the toilets also contributes. Algae present in salt water also give off unpleasant odours. - Completely empty the blackwater system before leaving the vessel unattended in temperatures below freezing. - Ask for information about the laws in force in your country or your marina about discharging your waste waters into the sea. 2) Use of toilets - Every time the toilets are used, flush afterwards with copious amounts of water in the bowl using the toilet pump (manual or electric). - When you are leaving the boat for several days, flush with fresh water. You may wish to use the shower in the head for this purpose. Seawater allowed to stagnate in the bowl gives off bad odours. 3) Maintenance of blackwater tank - The risk of unpleasant odours forming increases when the waste water remains in the tank for a long time. - Whenever possible empty the tank regularly, even before it is full. - Every time the tank is emptied put in about 5 litres of fresh water and add an appropriate detergent additive (available from chandleries). A very simple method is to add soda salts, which clean and disinfect at the same time. 173 "},{"d":"OM","p":174,"pdf":174,"sec":"13.6 Blackwater system (toilet)","t":"- Before winterising, flush the tank with copious amounts of fresh water filling it through the 'WASTE' deck connection. Leave at least 5 litres of fresh water mixed with a detergent additive. - Disinfecting: Disinfect the tank once a year by filling it with a solution of Javel water (1 to 1000). WASTE filler cap - Never use automobile anti-freeze in the blackwater system: risk of poisoning. Control - Electric toilet - Respect local regulations regarding the emptying of blackwater tanks. 4) Using the drainage valve - The direct-to-sea drainage valve can be sealed by means of the drilled hole on the handle. - To lock the drainage valve in the closed position: Pass the tightening collar around the drainage valve and feed through the hole in the handle as shown. Plastic valve - Beware of any unintentional draining. 174 Water systems "},{"d":"OM","p":175,"pdf":175,"sec":"13.6.1 Diagram of blackwater system","t":"Layout diagram of blackwater system Emptying by gravity 175  Designation 1 Toilet 2 Seawater intake valve 3 Thru-hull seacock 4 Blackwater tank 5 Vent 6 \"WASTE\" deck connection 13 Water systems Reference"},{"d":"OM","p":176,"pdf":176,"sec":"13.6 Blackwater system (toilet)","t":"Using a marine toilet fitted with a tank emptied by gravity I. Open the seawater intake valve (Ref 2). - Refer to the manufacturer's instructions for use and maintenance. II. Fill the bowl by using the manual toilet pump. III. Using the toilet (Ref 1). IV.a. To empty the organic waste in the tank: - Make sure the thru-hull seacock (Ref 3) is closed. - Empty the bowl using the manual toilet pump. IV.b. For direct discharge into the sea: - Open the thru-hull seacock (Ref 3). - Empty the bowl using the manual toilet pump. IV.c. To discharge through the deck: - Open the deck connection marked \"WASTE\" (Ref 6). - Use the pump-out system where fitted at a port. Using an DC electric WC fitted with a tank emptied by gravity I. Open the seawater intake valve (Ref 2). II. Fill the bowl by pressing the fill button. III. Using the toilet (Ref 1). IV.a. To empty the organic waste in the tank: - Make sure the thru-hull seacock (Ref 3) is closed. - Empty the bowl by pressing the empty button. IV.b. For direct discharge into the sea: - Open the thru-hull seacock (Ref 3). - Empty the bowl by pressing the empty button. IV.c. To discharge through the deck: - Open the deck connection marked \"WASTE\" (Ref 6). - Use the pump-out system where fitted at a port. 176 Water systems "},{"d":"OM","p":177,"pdf":177,"sec":"13.7 Waste Water System","t":"13.7 WASTE WATER SYSTEM General points - Waste water comprises the water coming from the sink, showers, air conditioning drains and washbasins. - Observe local regulations regarding the emptying of greywater tanks. - Close the valves after each use and especially when the boat is unattended. - Regularly check the valves and thru-hull seacocks for proper operation and watertightness. - Regularly check the tightness of the flexible pipe clamps and connections. Water systems 13 177 "},{"d":"OM","p":178,"pdf":178,"sec":"13.7 Waste Water System","t":"Layout diagram waste water 3-cabin layout Reference Designation 1 Sink plug hole / Washbasin drain plug 2 Sink drainage 3 Washbasin drainage / Shower drainage 4 Shower pump 5 Collector - Waste water 6 Shower plug hole 7 Switch - shower pump 178 Water systems "},{"d":"OM","p":179,"pdf":179,"sec":"13.7 Waste Water System","t":"SHOWER Drain plug Shower pump drainage Shower screen Holding NOTE: To maintain essential closed Navigation. - The shower drainage is automated: There is no control switch to drain water from the showers. - In integrated heads, when the taps are opened the shower drainage pump is activated, whether the tap is pointing towards the shower or the washbasin: the noise from the drainage pump is normal, even if water is only flowing into the washbasin. 179  Water systems 13"},{"d":"OM","p":181,"pdf":181,"sec":"13.7 Waste Water System","t":"14 ENGINE Information relating to fire risks and risks of explosion ............ 182 Danger from moving mechanical parts ........................................ 183 General points ................................................................................ 183 Starting the engine ......................................................................... 185 Engine water intake valve.............................................................. 186 Anti-siphon valve............................................................................ 187 Fuel filter ......................................................................................... 187 Engine installation.......................................................................... 188 Engine control ................................................................................ 190 Access to the engine...................................................................... 190 Propeller .......................................................................................... 191 181 14"},{"d":"OM","p":182,"pdf":182,"sec":"14.1 Information Relating To Fire Risks And Risks Of Explosi","t":"1
