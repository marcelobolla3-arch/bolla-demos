<!doctype html><meta charset="utf-8"><script>(function(){
  var lang="it";
  try{
    var requested=(new URLSearchParams(location.search).get("lang")||"").toLowerCase();
    if(requested==="fr") lang="fr";
    else if(!requested){
      var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
      for(var i=0;i<list.length;i++){
        if(String(list[i]||"").toLowerCase().split("-")[0]==="fr"){ lang="fr"; break; }
      }
    }
  }catch(e){}
  location.replace(lang+"/"+location.search+location.hash);
})();</script><a href="it/" data-keep-query>it</a> <a href="en/" data-keep-query>en</a> <a href="de/" data-keep-query>de</a> <a href="es/" data-keep-query>es</a> <a href="fr/" data-keep-query>fr</a><script>document.querySelectorAll("[data-keep-query]").forEach(function(a){try{var u=new URL(a.getAttribute("href"),location.href);a.href=u.pathname+location.search+location.hash;}catch(e){}});</script>
