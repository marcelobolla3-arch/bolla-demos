<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0b0b0c; color: #f4f4f5; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }

    p { margin: 0 0 16px; line-height: 1.45; color: #a1a1aa; font-size: 0.95rem; }

</style>
</head>
<body>
  <main>
    <h1>Cómo se ve el agente en la práctica</h1>
    <p>Video corto de BOLLA STUDIO. El agente atiende a los clientes por WhatsApp, en la web y por teléfono, las 24 horas.</p>
    <p class="langs">
      <a href="../es/" data-keep-query>ES</a>

      <a href="../it/" data-keep-query>IT</a>

    </p>

      Tu navegador no reproduce el video. <a href="reel.mp4">Descargalo acá</a>.
    </video>
    <p class="meta"><a href="https://bollastudio.com">bollastudio.com</a> · Marcelo Bolla</p>
  </main>
<script id="bolla-metrics">
(function(){
 var BASE='/bolla-video-comunidad-argentina/es';
 var m=(location.search+location.hash).match(/[?&#]internal=([01])/);
 var mo=(location.search+location.hash).match(/[?&#]interno=([01])/);
 var bollaOff=false;
 function bollaCookie(on){try{var secure="";try{if(location.protocol==="https:")secure="; Secure";}catch(e){}document.cookie=on?"bolla_internal=1; Path=/; Max-Age=34560000; SameSite=Lax"+secure:"bolla_internal=; Path=/; Max-Age=0; SameSite=Lax";}catch(e){}}
 function bollaStore(on){try{if(on)localStorage.setItem("skipgc","t");else localStorage.removeItem("skipgc");}catch(e){}bollaCookie(on);}
 try{var qh=location.search+location.hash;var ia=m?qh.lastIndexOf("internal="):-1;var io=mo?qh.lastIndexOf("interno="):-1;if(ia>=0||io>=0){var bollaOn=(io>ia?mo[1]:m[1])==="1";bollaOff=!bollaOn;bollaStore(bollaOn);}}catch(e){}
 var internal=false;try{internal=localStorage.getItem("skipgc")==="t";}catch(e){}
 try{if(!internal&&/(?:^|; )bolla_internal=1(?:;|$)/.test(document.cookie||"")){internal=true;try{localStorage.setItem("skipgc","t");}catch(e){}}else if(internal)bollaCookie(true);}catch(e){}
 var bollaAudit="";try{var bollaPm=location.search.match(/[?&]p=([^&#]*)/)||location.search.match(/[?&]link_id=([^&#]*)/);if(bollaPm)bollaAudit=decodeURIComponent(bollaPm[1]).toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,60);}catch(e){}if(bollaAudit.indexOf("bmaudit-")===0){internal=true;if(!bollaOff)bollaStore(true);}
 var sm=location.search.match(/[?&]p=([^&#]*)/);
 var tag=sm?decodeURIComponent(sm[1]).toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,60):"";
 var q=[]; window.bsTrack=function(sub,title){ if(internal) return;
  var ep=BASE+sub+(tag?'?p='+tag:'');
  if(window.goatcounter&&window.goatcounter.count) window.goatcounter.count({path:ep,title:title||sub,event:true}); else q.push([ep,title||sub]); };
 if(internal) return;
 window.goatcounter={no_onload:true};
 var s=document.createElement("script"); s.async=true; s.src="https://gc.zgo.at/count.js";
 s.setAttribute("data-goatcounter","https://bollastudio.goatcounter.com/count");
 s.onload=function(){ try{ window.goatcounter.count({path:BASE+'/'+(tag?'?p='+tag:''),title:'video comunidad-argentina es'});
  q.forEach(function(e){window.goatcounter.count({path:e[0],title:e[1],event:true});}); q=[]; }catch(e){} };
 document.head.appendChild(s);
 var played=false;
 document.addEventListener('play',function(ev){
  if(played||!ev.target||String(ev.target.tagName)!=='VIDEO') return;
  played=true; window.bsTrack('/play','video-play');
 },true);
})();
document.querySelectorAll('[data-keep-query]').forEach(function(a){
 try{ var u=new URL(a.getAttribute('href'),location.href); a.href=u.pathname+location.search+location.hash; }catch(e){}
});
</script>
</body>
